  const orderedFeatures=[...grouped.values()].flat();
  const batchHtml=featureBatchToolbarHtml(features);
  const allPending=features.flatMap(feature=>(featureDetails.get(feature.id)?.pending||[]).map(change=>({feature,change})));
  const allActive=featureTestMapRaw.features.filter(item=>item.status==='active');
  const gapItems=[['missing','缺少 XMind',allActive.filter(item=>!featureDetails.get(item.id).hasXmind).length],['no_owner','未配置负责人',allActive.filter(item=>!item.owner_id).length],['unlinked','未关联 PRD',allActive.filter(item=>!featureDetails.get(item.id).prdIds.size).length],['no_task','未创建事项',allActive.filter(item=>!featureDetails.get(item.id).tasks.length).length],['no_plan','无 TestHub 计划',allActive.filter(item=>!featureDetails.get(item.id).plans.size).length]];
  const gapHtml=`<div class="feature-module-section"><div class="feature-module-head"><div><div class="feature-module-title"><i class="ti ti-scan"></i>覆盖缺口</div><div class="feature-module-summary">点击分类即可定位需要补齐的功能</div></div><button class="btn-secondary" onclick="document.getElementById('featureMapState').value='all';renderFeatureTestMapRows()">查看全部</button></div><div class="feature-card-stats" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));">${gapItems.map(([value,label,count])=>`<button class="feature-mini-stat" style="border:0;cursor:pointer;${count?'color:#9a3412;':''}" onclick="document.getElementById('featureMapState').value='${value}';renderFeatureTestMapRows()"><strong>${count}</strong><span>${label}</span></button>`).join('')}</div></div>`;
  const editHtml=userRole==='admin'&&features.length?`<div style="display:flex;justify-content:flex-end;gap:7px;align-items:center;"><select class="dashboard-filter" id="featureQuickEdit">${features.map(item=>`<option value="${item.id}">${escapeDashboardHtml(item.module_name)} · ${escapeDashboardHtml(item.name)} · ${featurePlatformText(item.platform_scope)}</option>`).join('')}</select><button class="btn-secondary" onclick="openFeatureEditor(document.getElementById('featureQuickEdit').value)"><i class="ti ti-edit"></i> 编辑功能</button></div>`:'';
  const pendingByRelease=new Map();allPending.forEach(item=>{const release=releaseMap.get(item.change.release_id);const label=release?.version||'未知版本';pendingByRelease.set(label,(pendingByRelease.get(label)||0)+1);});
  const alertHtml=allPending.length?`<div class="feature-map-alert"><div><strong><i class="ti ti-alert-triangle"></i> ${allPending.length} 项测试资产待更新</strong><div class="release-meta" style="margin-top:4px;">${[...pendingByRelease.entries()].map(([label,count])=>`${escapeDashboardHtml(label)}：${count} 项`).join(' · ')}</div></div><button class="btn-secondary" onclick="document.getElementById('featureMapState').value='pending';renderFeatureTestMapRows()">进入待处理清单</button></div>`:'';
  const sections=[...grouped.entries()].map(([key,moduleFeatures])=>{
    const [productLine,moduleLabel]=key.split('::');
    const covered=moduleFeatures.filter(item=>featureDetails.get(item.id).hasXmind).length;
    const cards=moduleFeatures.map(feature=>{
      const detail=featureDetails.get(feature.id);
      const pendingChange=detail.pending[0];
      const featureGaps=[!detail.hasXmind?'缺少 XMind':'',!feature.owner_id?'未配置负责人':'',!detail.prdIds.size?'未关联 PRD':'',!detail.tasks.length?'未创建事项':'',!detail.plans.size?'无 TestHub 计划':''].filter(Boolean);
      const statusClass=pendingChange?'pending':(featureGaps.length?'missing':'');
      const statusText=pendingChange?'XMind 待更新':(featureGaps.length?`待补齐 ${featureGaps.length} 项`:'覆盖完整');
      const featureGapHtml=featureGaps.length?`<div class="feature-asset-list">${featureGaps.map(item=>`<span class="feature-state-chip missing">${item}</span>`).join('')}</div>`:'';
      const percent=detail.total?Math.min(100,Math.round(detail.executed/detail.total*100)):0;
      const openDefects=detail.defects.filter(item=>!['verified','closed'].includes(item.status)).length;
      const assetHtml=detail.assets.length?detail.assets.slice(0,5).map(asset=>`<button class="feature-asset-pill" onclick="openFeatureTestAsset('${asset.id}')"><i class="ti ti-${asset.asset_type==='xmind'?'sitemap':'file'}"></i>${escapeDashboardHtml(asset.name)}</button>`).join(''):'<span class="release-meta">尚未添加 XMind 或用例资产</span>';
      const changeHtml=pendingChange?(()=>{const release=releaseMap.get(pendingChange.release_id);return `<div class="feature-change-alert"><strong>${escapeDashboardHtml(release?.version||'新版本')} · ${featureChangeTypeText(pendingChange.change_type)}</strong><div style="margin-top:3px;">${escapeDashboardHtml(pendingChange.change_summary||'版本发生变更，请确认原测试资产是否需要更新')}</div><div class="feature-card-actions"><button class="risk-action" onclick="openFeatureAssetEditor('${feature.id}','${pendingChange.release_id}')">上传新版资产</button><button class="risk-action" onclick="markFeatureChangeNotNeeded('${pendingChange.id}')">确认无需更新</button></div></div>`;})():'';
      return `<article class="feature-visual-card ${statusClass}"><div class="feature-card-top"><div><div class="feature-card-name">${escapeDashboardHtml(feature.name)}</div><div class="feature-card-meta">${featurePlatformText(feature.platform_scope)} · 维护人：${escapeDashboardHtml(memberMap.get(feature.owner_id)||'未指定')}</div></div><span class="feature-state-chip ${statusClass}">${statusText}</span></div>${featureGapHtml}${changeHtml}<div class="feature-asset-list">${assetHtml}</div><div class="feature-progress-wrap"><div class="feature-progress-head"><span>TestHub 用例执行</span><strong>${detail.executed}/${detail.total}</strong></div><div class="feature-progress-track"><div class="feature-progress-fill" style="width:${percent}%"></div></div></div><div class="feature-card-stats"><div class="feature-mini-stat"><strong>${detail.plans.size}</strong><span>测试计划</span></div><div class="feature-mini-stat"><strong>${detail.rounds.length}</strong><span>测试轮次</span></div><div class="feature-mini-stat"><strong>${openDefects}/${detail.defects.length}</strong><span>未关闭/BUG</span></div></div><div class="feature-card-actions"><button class="btn-secondary" onclick="openFeatureAssetEditor('${feature.id}')"><i class="ti ti-plus"></i> 添加资产</button>${userRole==='admin'?`<button class="btn-secondary" onclick="openFeatureChangeEditor('${feature.id}')"><i class="ti ti-history"></i> 登记变更</button>`:''}</div></article>`;
    }).join('');
    return `<section class="feature-module-section"><div class="feature-module-head"><div><div class="feature-module-title"><i class="ti ti-folders"></i>${escapeDashboardHtml(moduleLabel)}</div><div class="feature-module-summary">${escapeDashboardHtml(productLine)} · ${moduleFeatures.length} 个功能</div></div><div style="min-width:130px;"><div class="feature-progress-head"><span>XMind 覆盖</span><strong>${qualityPercent(covered,moduleFeatures.length)}%</strong></div><div class="feature-progress-track"><div class="feature-progress-fill" style="width:${qualityPercent(covered,moduleFeatures.length)}%"></div></div></div></div><div class="feature-card-grid">${cards}</div></section>`;
  }).join('');
  board.innerHTML=batchHtml+gapHtml+editHtml+alertHtml+(sections||'<div class="dashboard-empty">当前筛选条件下暂无功能</div>');
  board.querySelectorAll('.feature-visual-card').forEach((card,index)=>{const feature=orderedFeatures[index];if(!feature)return;const selected=selectedFeatureIds.has(feature.id);card.classList.toggle('selected',selected);card.insertAdjacentHTML('afterbegin',`<button class="feature-select-toggle" title="${selected?'取消选择':'选择功能'}" onclick="event.stopPropagation();toggleFeatureSelection('${feature.id}')"><i class="ti ti-${selected?'check':'square'}"></i></button>`);});
  const count=document.getElementById('featureMapCount');if(count)count.textContent=`${features.length} 个功能`;
}

async function renderTaskRecords(workspaceData) {
  const content = document.getElementById('content');
  content.style.padding = '24px';
  content.innerHTML = '<div class="history-card"><div class="dashboard-loading">正在加载工作事项…</div></div>';

  try {
    if (!workspaceData) throw new Error('工作事项模块未提供页面数据');
    const {
      tasksResult,
      profilesResult,
      progressResult,
      testHubResult,
      assigneesResult,
      dailyResult,
      historyResult,
      releasesResult,
      portfolioPlansResult,
      activityResult,
      requirementsResult,
      prdsResult,
      testHubSuitesResult,
      planCacheResult,
      qaProjectsResult,
      viewModel,
      renderListPage,
    } = workspaceData;
    dashboardMembers = viewModel.resourceMembers;
    taskProgressByTask = new Map();
    (progressResult.data || []).forEach(log => {
      const logs = taskProgressByTask.get(log.task_id) || [];
      logs.push(log);
      taskProgressByTask.set(log.task_id, logs);
    });
    taskTestHubProgressByTask = new Map((testHubResult.data || []).map(snapshot => [snapshot.task_id, snapshot]));
    taskAssigneesByTask = new Map();
    (assigneesResult.data || []).forEach(item => {
      const list = taskAssigneesByTask.get(item.task_id) || [];
      list.push(item);
      taskAssigneesByTask.set(item.task_id, list);
    });
    taskTestHubDailyByTask = new Map();
    (dailyResult.data || []).forEach(item => {
      const list = taskTestHubDailyByTask.get(item.task_id) || [];
      list.push(item);
      taskTestHubDailyByTask.set(item.task_id, list);
    });
    testHubPlanDirectoryCache = new Map((planCacheResult.data || []).map(item => [String(item.plan_id), item]));
    taskAllocationHistoryByTask = new Map();
    (historyResult.data || []).forEach(item => {
      const list = taskAllocationHistoryByTask.get(item.task_id) || [];
      list.push(item);
      taskAllocationHistoryByTask.set(item.task_id, list);
    });
    taskActivityByTask = new Map();
    (activityResult.data || []).forEach(item => {
      const list = taskActivityByTask.get(item.task_id) || [];
      list.push(item);
      taskActivityByTask.set(item.task_id, list);
    });
    const {
      unitTasks,
      visibleTasks,
      names,
      releaseNames,
      portfolioNames,
      requirementNames,
      prdNames,
      testHubSuites,
      todayKey: taskTodayKey,
    } = viewModel;
    taskRecordCache = new Map(visibleTasks.map(task => [task.id, task]));
    rebuildTaskSchedule(dashboardMembers, unitTasks, dashboardWorkCalendar);

    const taskDetails = new Map();
    const rows = visibleTasks.map(task => {
      const range = taskAllocationRangeText(task);
      const assignments = taskAssigneeList(task);
      const points = task.effort_person_days
        ? `${Number(task.effort_person_days).toFixed(2)} 人天 / ${assignments.length} 人 / 事件每日 ${resourceDailyPoints(task).toFixed(2)} 点`
        : '-';
      const snapshot = taskTestHubProgressByTask.get(task.id);
      const taskPlanIds = getTaskTestHubPlanIds(task);
      const testHubPlanCount = taskPlanIds.length;
      const snapshotMatches = testHubPlanCount > 0 && testHubSnapshotMatchesTask(task, snapshot);
      const effectiveSnapshot = snapshotMatches ? snapshot : null;
      const actual = taskActualProgressPoints(task, taskProgressByTask.get(task.id) || [], effectiveSnapshot);
      const taskEffort = Number(task.effort_person_days || 0);
      const progressPercent = taskEffort > 0 ? Math.min(100, actual.totalActual / taskEffort * 100) : (task.status === 'done' ? 100 : 0);
      const selectedSuiteIds = new Set((task.testhub_scope_suite_ids || []).map(String));
      const cachedScopedSuites = task.testhub_scope_mode === 'suite'
        ? testHubSuites.filter(item => item.library_id === task.testhub_library_id
          && taskPlanIds.includes(String(item.plan_id))
          && selectedSuiteIds.has(String(item.suite_id)))
        : [];
      const cachedScopedTotal = cachedScopedSuites.reduce((sum, item) => sum + Number(item.case_count || 0), 0);
      const snapshotTotalCases = Number(effectiveSnapshot?.total_cases || 0);
      const displayedTotalCases = snapshotTotalCases || cachedScopedTotal;
      const executedCases = Number(effectiveSnapshot?.executed_cases || 0);
      const perPlanProgress = testHubPlanProgressItems(effectiveSnapshot);
      const perPlanProgressText = perPlanProgress.length > 1
        ? ` · 分计划 ${perPlanProgress.map((item, index) => `${index + 1}: ${Number(item.executed || 0)}/${Number(item.total || 0)}`).join(' + ')}`
        : '';
      const scopeAwaitingSync = task.testhub_scope_mode === 'suite' && !snapshotTotalCases && cachedScopedTotal > 0;
      const scopedSuiteNames = (effectiveSnapshot?.scope_suite_names?.length
        ? effectiveSnapshot.scope_suite_names
        : [...new Set(cachedScopedSuites.map(item => item.suite_name).filter(Boolean))]);
      const testHubScopeText = task.testhub_scope_mode === 'suite'
        ? ` · 模块：${escapeDashboardHtml(scopedSuiteNames.length ? scopedSuiteNames.join('、') : `${Number(task.testhub_scope_suite_ids?.length || 0)} 个已选模块`)}`
        : '';
      const testHubText = testHubPlanCount
        ? !snapshotMatches
          ? ` · TestHub ${testHubPlanCount} 个计划${testHubScopeText} · 计划已变更，待同步 Case 数`
          : ` · TestHub ${testHubPlanCount} 个计划${testHubScopeText} · 已执行 ${executedCases} / 总 Case ${displayedTotalCases}${perPlanProgressText}${scopeAwaitingSync ? '（范围待同步）' : ''}`
        : '';
      const canEdit = canCurrentUserEditTask(task);
      const canUpdateStatus = canCurrentUserUpdateTaskStatus(task);
      const memberIds = assignments.map(item => item.member_id).join(',');
      const progressMode = testHubPlanCount ? 'auto' : 'manual';
      const overdue = ['todo','in_progress','blocked'].includes(task.status) && task.due_date && task.due_date.slice(0, 10) < taskTodayKey;
      const syncText = effectiveSnapshot?.synced_at ? `同步 ${new Date(effectiveSnapshot.synced_at).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })}` : testHubPlanCount ? '尚未同步' : '手工填报';
      const warningsHtml = renderTaskDataWarnings(task, snapshotMatches, effectiveSnapshot);
      const assigneeNames = assignments.map(item => names.get(item.member_id) || '未命名成员');
      const detailActions = `<div class="task-drawer-actions">
        <button class="btn-secondary" onclick="closeTaskDetailDrawer();openEditQaTask('${task.id}', '${canEdit ? 'full' : 'readonly'}')">${canEdit ? '查看/编辑' : '查看配置'}</button>
        ${canEdit ? `<button class="btn-secondary" onclick="closeTaskDetailDrawer();duplicateQaTask('${task.id}')">复制事项</button>` : ''}
        ${canUpdateStatus ? `<button class="btn-primary" onclick="closeTaskDetailDrawer();openProgressModal('${task.id}')">${testHubPlanCount ? '更新状态' : '更新状态/进度'}</button>` : ''}
        ${userRole === 'admin' && testHubPlanCount ? `<button class="btn-secondary" onclick="syncTestHubProgress('${task.id}', this)">刷新 TestHub</button>` : ''}
      </div>`;
      taskDetails.set(task.id, {
        title:task.title,
        subtitle:`${taskStatusText(task.status)} · ${assigneeNames.join('、')} · ${progressMode === 'auto' ? 'TestHub 自动进度' : '手工进度'}`,
        actionsHtml:detailActions,
        description:task.description || '',
        testRound:Number(task.test_round || 1),
        range,
        releaseName:task.release_id ? (releaseNames.get(task.release_id) || '未命名版本') : '',
        portfolioName:task.portfolio_plan_id ? (portfolioNames.get(task.portfolio_plan_id) || '已关联项目') : '',
        requirementName:task.requirement_id ? (requirementNames.get(task.requirement_id) || '已关联验收范围') : '',
        prdName:!task.requirement_id && task.prd_id ? (prdNames.get(task.prd_id) || '已关联 PRD') : '',
        warningsHtml,
        progressPercent,
        progressMode,
        actualTotal:actual.totalActual,
        taskEffort,
        syncText,
        points,
        testHubText,
        reconciliationHtml:renderTaskCaseReconciliation(task, effectiveSnapshot),
        planSyncHtml:renderTaskPlanSyncStatus(task, effectiveSnapshot),
        memberProgressHtml:renderTaskMemberProgressSummary(task, names, effectiveSnapshot),
        memberDailyHtml:renderTaskMemberDailyDetail(task, names, effectiveSnapshot),
        status:task.status,
        blockedReason:task.blocked_reason || '',
        blockedUntil:task.blocked_until || '',
        completionNote:task.completion_note || '',
        allocationHistoryHtml:renderTaskAllocationHistory(task, names),
        activityHtml:renderTaskActivity(task, names)
      });
      return {
        id:task.id,
        title:task.title,
        canEdit,
        canUpdateStatus,
        memberIds,
        status:task.status,
        progressMode,
        overdue,
        startDate:task.allocation_start_date || '',
        endDate:task.allocation_end_date || task.due_date?.slice(0, 10) || '',
        warningsHtml,
        testRound:Number(task.test_round || 1),
        releaseName:task.release_id ? (releaseNames.get(task.release_id) || '未命名版本') : '',
        portfolioName:task.portfolio_plan_id ? (portfolioNames.get(task.portfolio_plan_id) || '已关联') : '',
        assigneeNames,
        assignmentCount:assignments.length,
        progressPercent,
        actualTotal:actual.totalActual,
        taskEffort,
        range,
        syncText,
        testHubPlanCount
      };
    });

    const todayKey = dashboardTodayInputValue();
    const memberActiveTasks = visibleTasks.filter(task =>
      task.status !== 'done' && task.status !== 'cancelled'
      && taskAssigneeList(task).some(item => item.member_id === currentUser.id)
      && task.allocation_start_date <= todayKey && task.allocation_end_date >= todayKey
      && isResourceWorkday(todayKey)
    );
    const memberPlannedToday = memberActiveTasks.reduce((sum, task) => sum + taskMemberDailyPlanOnDate(task, currentUser.id, todayKey), 0);
    const memberActualToday = memberActiveTasks.reduce((sum, task) => {
      if (taskUsesTestHubProgress(task)) {
        const snapshot = taskTestHubProgressByTask.get(task.id);
        return sum + taskMemberTestHubPoints(task, currentUser.id, todayKey, testHubSnapshotMatchesTask(task, snapshot) ? snapshot : null);
      }
      return sum + (taskProgressByTask.get(task.id) || [])
        .filter(log => log.executor_id === currentUser.id && log.work_date === todayKey && log.source === 'manual')
        .reduce((subtotal, log) => subtotal + Number(log.progress_points || 0), 0);
    }, 0);
    const memberGapToday = Math.max(memberPlannedToday - memberActualToday, 0);
    const memberSummary = canViewTeamTasks() ? '' : `<div class="member-work-summary"><div><span>今日计划</span><strong>${memberPlannedToday.toFixed(2)}</strong><small>点</small></div><div><span>今日实际</span><strong>${memberActualToday.toFixed(2)}</strong><small>点</small></div><div class="${memberGapToday > 0.01 ? 'has-gap' : ''}"><span>今日差额</span><strong>${memberGapToday.toFixed(2)}</strong><small>点</small></div><div><span>负责事项</span><strong>${memberActiveTasks.length}</strong><small>项</small></div></div>`;
    renderListPage({
      memberSummary,
      rows,
      taskDetails,
      overlays:`${taskEditorModalHtml()}${progressModalHtml()}${progressSavePreviewModalHtml()}${taskCaseTraceModalHtml()}`
    });
    loadTaskAssignees();
    restoreTeamTaskViewState();
    filterTeamTaskRows();
  } catch (error) {
    console.error('[tasks] load failed:', error);
    content.innerHTML = `<div class="history-card"><div class="dashboard-empty">工作事项加载失败：${escapeDashboardHtml(error.message)}</div></div>`;
  }
}

      <td>${t.task_type === 'smoke' ? '🔥 冒烟' : '🔄 回归'}</td>

  content.innerHTML = `
    <div class="auto-header">
      <div>
        <div class="auto-title">自动化测试</div>
        <div class="auto-subtitle">Liene Photo APP · Android / iOS · Appium 2.x</div>
      </div>
    </div>

    <!-- 一键部署 -->
    <div class="deploy-card" style="margin-bottom:16px;">
      <div class="deploy-icon"><i class="ti ti-download"></i></div>

async function triggerTask() {
  const btn = document.getElementById('triggerBtn');
  const task_type = document.getElementById('taskType').value;
  const platform  = document.getElementById('taskPlatform').value;
  const device_id = document.getElementById('taskDevice').value || null;
  const triggered_by = document.getElementById('userName').textContent;
  const task_module   = document.getElementById('taskModule').value;

  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader" style="animation:spin 0.7s linear infinite"></i> 提交中...';

  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session?.access_token) throw new Error('登录状态已失效，请重新登录');

    const resp = await fetch(`${SUPABASE_URL}/functions/v1/smooth-task`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ task_type, platform, device_id, triggered_by, task_module }),
    });
    const data = await resp.json();
    if (data.success) {
      showToast('任务已提交，等待 Runner 执行', 'success');
      setTimeout(() => renderAutomation(), 800);
    } else {
      showToast('提交失败：' + (data.error || '未知错误'), 'error');
    }
  } catch (e) {
    showToast('网络错误：' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-player-play"></i> 运行';
  }
}

function showToast(msg, type = 'success') {
  const el = document.createElement('div');
  el.style.cssText = `
    position:fixed;bottom:24px;right:24px;z-index:9999;
    padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;
    background:${type === 'success' ? '#1DD1A1' : '#E24B4A'};color:#fff;
    box-shadow:0 4px 16px rgba(0,0,0,0.15);
    animation:slideIn 0.25s ease;
  `;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function dashboardTodayInputValue() {
  return dashboardDateInputValue(0);
}

function dashboardDateInputValue(dayOffset) {
  const now = new Date();
  now.setDate(now.getDate() + dayOffset);
  const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
}

function escapeDashboardHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function safeDashboardExternalUrl(value) {
  try {
    const url = new URL(value);
    return ['http:', 'https:'].includes(url.protocol) ? url.toString() : '';
  } catch {
    return '';
  }
}

function addDashboardDate(dateKey, dayOffset) {
  const date = new Date(`${dateKey}T00:00:00Z`);
  date.setUTCDate(date.getUTCDate() + dayOffset);
  return date.toISOString().slice(0, 10);
}

function isResourceWorkday(dateKey, calendar = dashboardWorkCalendar) {
  if (calendar.has(dateKey)) return calendar.get(dateKey).is_workday;
  const weekday = new Date(`${dateKey}T00:00:00Z`).getUTCDay();
  return weekday !== 0 && weekday !== 6;
}

function resourceWorkDates(startDate, endDate, calendar = dashboardWorkCalendar) {
  const dates = [];
  for (let date = startDate; date <= endDate; date = addDashboardDate(date, 1)) {
    if (isResourceWorkday(date, calendar)) dates.push(date);
  }
  return dates;
}

function resourceWorkSlots(startDate, endDate, startPeriod = 'am', endPeriod = 'pm', calendar = dashboardWorkCalendar) {
  if (!startDate || !endDate || endDate < startDate) return [];
  const slots = [];
  for (const date of resourceWorkDates(startDate, endDate, calendar)) {
    for (const period of ['am', 'pm']) {
      if (date === startDate && startPeriod === 'pm' && period === 'am') continue;
      if (date === endDate && endPeriod === 'am' && period === 'pm') continue;
      slots.push({ date, period });
    }
  }
  return slots;
}

function resourceTaskWorkSlots(task, calendar = dashboardWorkCalendar) {
  return resourceWorkSlots(
    task.allocation_start_date,
    task.allocation_end_date,
    task.allocation_start_period || 'am',
    task.allocation_end_period || 'pm',
    calendar
  );
}

function taskAllocationPeriodText(period) {
  return period === 'pm' ? '下午' : '上午';
}

function taskAllocationRangeText(task) {
  if (!task.allocation_start_date || !task.allocation_end_date) return '-';
  return `${task.allocation_start_date} ${taskAllocationPeriodText(task.allocation_start_period)} → ${task.allocation_end_date} ${taskAllocationPeriodText(task.allocation_end_period)}（含截止时段）`;
}

function resourceSlotClosed(slot, todayKey, now = new Date()) {
  if (slot.date < todayKey) return true;
  if (slot.date > todayKey) return false;
  return slot.period === 'am' ? now.getHours() >= 13 : now.getHours() >= DAILY_PROGRESS_CUTOFF_HOUR;
}

function futureResourceWorkDates(count, calendar = dashboardWorkCalendar, startDate = dashboardResourceStartDate || dashboardTodayInputValue()) {
  const dates = [];
  let date = startDate;
  while (dates.length < count) {
    if (isResourceWorkday(date, calendar)) dates.push(date);
    date = addDashboardDate(date, 1);
  }
  return dates;
}

function resourceDailyPoints(task, calendar = dashboardWorkCalendar) {
  if (!task.allocation_start_date || !task.allocation_end_date || !task.effort_person_days) return 0;
  const slots = resourceTaskWorkSlots(task, calendar);
  return slots.length ? Number(task.effort_person_days) / (slots.length / 2) : 0;
}

function taskOfflineDailyPoints(task, calendar = dashboardWorkCalendar) {
  const totalEffort = Number(task.effort_person_days) || 0;
  const onlineEffort = Math.min(Number(task.testhub_effort_person_days) || 0, totalEffort);
  const slots = resourceTaskWorkSlots(task, calendar);
  return slots.length ? Math.max(totalEffort - onlineEffort, 0) / (slots.length / 2) : 0;
}

function taskActualProgressPoints(task, progressLogs = [], testHubSnapshot = null) {
  const totalEffort = Number(task.effort_person_days) || 0;
  const testHubEffort = Math.min(Number(task.testhub_effort_person_days) || 0, totalEffort);
  const offlineEffort = Math.max(totalEffort - testHubEffort, 0);
  const manualPoints = progressLogs
    .filter(log => log.source === 'manual')
    .reduce((total, log) => total + Number(log.progress_points), 0);
  const manualActual = Math.min(manualPoints, offlineEffort || (testHubEffort ? 0 : totalEffort));
  const testHubRatio = Math.min(Math.max(Number(testHubSnapshot?.progress_ratio) || 0, 0), 1);
  const testHubActual = testHubEffort * testHubRatio;
  return {
    manualActual,
    testHubActual,
    totalActual: Math.min(manualActual + testHubActual, totalEffort),
    testHubRatio,
  };
}

function resourcePointsOnDate(tasks, memberId, dateKey, calendar = dashboardWorkCalendar) {
  if (!isResourceWorkday(dateKey, calendar)) return 0;
  return resourceTasksOnDate(tasks, memberId, dateKey, calendar)
    .reduce((total, task) => total + taskMemberDailyPlanOnDate(task, memberId, dateKey, calendar), 0);
}

function resourceTasksOnDate(tasks, memberId, dateKey, calendar = dashboardWorkCalendar) {
  if (!isResourceWorkday(dateKey, calendar)) return [];
  return tasks.filter(task => taskAssigneeList(task).some(item => item.member_id === memberId)
    && task.status !== 'cancelled'
    && task.allocation_start_date <= dateKey
    && task.allocation_end_date >= dateKey);
}

function buildOverdueCarryover(members, tasks, visibleDates, calendar = dashboardWorkCalendar) {
  const result = new Map();
  if (!visibleDates.length) return result;
  const today = dashboardTodayInputValue();
  const lastVisibleDate = visibleDates.at(-1);
  if (lastVisibleDate < today) return result;
  const memberIds = new Set((members || []).map(member => member.id));
  const distributionDates = [];
  let cursor = today;
  while (cursor <= lastVisibleDate) {
    if (isResourceWorkday(cursor, calendar)) distributionDates.push(cursor);
    cursor = addDashboardDate(cursor, 1);
  }
  for (const task of tasks || []) {
    if (!['todo','in_progress','blocked'].includes(task.status)
      || !task.allocation_end_date
      || task.allocation_end_date > today) continue;
    const snapshot = taskTestHubProgressByTask.get(task.id);
    for (const assignment of taskAssigneeList(task)) {
      if (!memberIds.has(assignment.member_id)) continue;
      const allocated = Number(assignment.allocated_effort || 0);
      let remaining = Math.max(0, allocated - taskMemberActualPoints(task, assignment.member_id, snapshot));
      if (remaining <= 0.001) continue;
      const member = (members || []).find(item => item.id === assignment.member_id);
      const dailyCapacity = Number(member?.daily_capacity) || 1;
      const carryStart = addDashboardDate(task.allocation_end_date, 1);
      for (const date of distributionDates) {
        if (date < carryStart || remaining <= 0.001) continue;
        const points = Math.min(remaining, dailyCapacity);
        const key = `${assignment.member_id}|${date}`;
        const items = result.get(key) || [];
        items.push({ task, points });
        result.set(key, items);
        remaining -= points;
      }
    }
  }
  return result;
}

function buildResourceCapacity(members, tasks, calendar = dashboardWorkCalendar) {
  const dates = futureResourceWorkDates(RESOURCE_HORIZON_WORKDAYS, calendar);
  const carryoverByMemberDate = buildOverdueCarryover(members, tasks, dates, calendar);
  const rows = members.map(member => {
    const capacity = Number(member.daily_capacity) || 1;
    const cells = dates.map(date => {
      const scheduledTasks = resourceTasksOnDate(tasks, member.id, date, calendar);
      const carryoverItems = carryoverByMemberDate.get(`${member.id}|${date}`) || [];
      const linkedTasks = [...new Map([...scheduledTasks, ...carryoverItems.map(item => item.task)].map(task => [task.id, task])).values()];
       const scheduledPoints = scheduledTasks.reduce((total, task) => total + taskMemberDailyPlanOnDate(task, member.id, date, calendar), 0);
       const carryoverPoints = carryoverItems.reduce((sum, item) => sum + Number(item.points || 0), 0);
       const points = scheduledPoints + carryoverPoints;
       const periodPoints = Object.fromEntries(['am', 'pm'].map(period => [period, linkedTasks.reduce((total, task) => {
         return total + taskMemberPeriodPlanOnDate(task, member.id, date, period);
       }, 0) + carryoverPoints / 2]));
       const actualPoints = linkedTasks.reduce((total, task) => {
         if (taskUsesTestHubProgress(task)) return total + taskMemberTestHubPoints(task, member.id, date, taskTestHubProgressByTask.get(task.id));
         return total + (taskProgressByTask.get(task.id) || [])
           .filter(log => log.source === 'manual' && log.executor_id === member.id && log.work_date === date)
           .reduce((sum, log) => sum + Number(log.progress_points || 0), 0);
       }, 0);
       // Capacity color is based on the whole workday. Half-day values explain
       // the distribution but must not turn a 1.00 / 1.00 day into overload.
       const level = points > capacity + 0.001
         ? 'over' : points < capacity - 0.001 ? 'under' : 'normal';
       const actualLevel = actualPoints > capacity + 0.001
         ? 'over' : actualPoints < capacity - 0.001 ? 'under' : 'normal';
       return { date, points, scheduledPoints, carryoverPoints, carryoverItems, actualPoints, periodPoints, capacity, level, actualLevel, tasks:linkedTasks };
    });
    return { member, cells };
  });

  const risks = [];
  rows.forEach(row => {
    const over = row.cells.filter(cell => cell.level === 'over');
    const under = row.cells.filter(cell => cell.level === 'under');
    if (over.length) {
      const first = over[0];
      risks.push({
        level: 'high',
        title: `${row.member.name || '未命名成员'}所选${RESOURCE_HORIZON_WORKDAYS}个工作日有 ${over.length} 天资源超负荷`,
        meta: `${first.date.slice(5).replace('-', '/')}：${first.points.toFixed(2)} / ${first.capacity.toFixed(2)} 点`,
        action: 'resource', actionLabel: '调整资源'
      });
    }
    const carryover = row.cells.filter(cell => cell.carryoverPoints > 0.001);
    if (carryover.length) {
      const first = carryover[0];
      risks.push({
        level: 'high',
        title: `${row.member.name || '未命名成员'}有延期事项滚动占用后续资源`,
        meta: `${first.date.slice(5).replace('-', '/')}：延期占用 ${first.carryoverPoints.toFixed(2)} 点`,
        action: 'resource', actionLabel: '查看延期占用'
      });
    }
    if (under.length) {
      const first = under[0];
      risks.push({
        level: 'low',
        title: `${row.member.name || '未命名成员'}所选${RESOURCE_HORIZON_WORKDAYS}个工作日有 ${under.length} 天资源不足`,
        meta: `${first.date.slice(5).replace('-', '/')}：${first.points.toFixed(2)} / ${first.capacity.toFixed(2)} 点`,
        action: 'resource', actionLabel: '查看资源'
      });
    }
  });
  return { dates, rows, risks };
}

    return `<th>${date.slice(5).replace('-', '/')}<br>${parsed.toLocaleDateString('zh-CN', { weekday:'short' })}</th>`;
  }).join('');
  const body = rows.map(row => `
    <tr>
      <td class="resource-member">${escapeDashboardHtml(row.member.name || '未命名成员')}</td>
      ${row.cells.map(cell => {
        const detailKey = `${row.member.id}|${cell.date}`;
        resourceCellDetailCache.set(detailKey, { member:row.member, cell });
        const taskNames = cell.tasks.map(task => task.title).join('、');

        const level = showingActual ? cell.actualLevel : cell.level;

          ? `计划 ${cell.points.toFixed(2)}`

function buildTaskScheduleRisks(tasks, members, progressLogs, testHubSnapshots, now, calendar = dashboardWorkCalendar) {
  const memberMap = new Map(members.map(member => [member.id, member]));
  const snapshotMap = new Map(testHubSnapshots.map(snapshot => [snapshot.task_id, snapshot]));
  const todayKey = dashboardLocalDateKey(now);
  const risks = [];

  tasks.forEach(task => {
    // Completed/cancelled work remains in historical capacity statistics, but it
    // must never create overdue, not-started, blocked or delay risks.
    if (['done', 'cancelled'].includes(task.status)) return;
    taskAssigneeList(task).forEach(assignment => {
    const member = memberMap.get(assignment.member_id);
    const memberName = member?.name || (assignment.member_id === currentUser.id ? '我' : '未命名成员');
    const due = task.due_date ? new Date(task.due_date) : null;
    const label = `${memberName} · ${task.title}`;
    const logs = progressLogs.filter(log => log.task_id === task.id && log.executor_id === assignment.member_id && log.work_date <= todayKey);
    const manualCumulative = taskUsesTestHubProgress(task) ? 0 : logs.reduce((sum, log) => sum + Number(log.progress_points || 0), 0);
    const testHubCumulative = taskMemberTestHubPoints(task, assignment.member_id, null, snapshotMap.get(task.id));
    const actualCumulative = Math.min(manualCumulative + testHubCumulative, Number(assignment.allocated_effort));

    if (task.status === 'blocked') {
      risks.push({
        level: 'high',
        title: `${label} 当前已阻塞`,
        meta: `${task.blocked_reason || '尚未填写阻塞原因'}${task.blocked_until ? ` · 预计 ${task.blocked_until} 解除` : ''}`,
        action: 'task', actionLabel: '处理阻塞', taskId: task.id
      });
      return;
    }

    if (due && due < now) {
      risks.push({
        level: 'high',
        title: `${label} 已超过截止日期`,
        meta: `截止 ${due.toLocaleDateString('zh-CN')}，当前仍为${taskStatusText(task.status)}`,
        action: 'task', actionLabel: '查看任务', taskId: task.id
      });
      return;
    }

    const taskSlots = resourceTaskWorkSlots(task, calendar);
    const startReached = taskSlots.length && resourceSlotClosed(taskSlots[0], todayKey, now);
    const notStarted = task.status === 'todo'
      && actualCumulative <= 0.001
      && startReached;
    if (notStarted) {
      risks.push({
        level: 'medium',
        title: `${label} 到计划开始日仍未开始`,
        meta: `计划 ${task.allocation_start_date} ${taskAllocationPeriodText(task.allocation_start_period)}开始，实际累计仍为 0 点`,
        action: 'task', actionLabel: '开始处理', taskId: task.id
      });
      return;
    }

    const closedSlots = taskSlots.filter(slot => resourceSlotClosed(slot, todayKey, now)).length;
    const plannedCumulative = taskSlots.length
      ? Number(assignment.allocated_effort) * closedSlots / taskSlots.length
      : 0;
    const progressGap = plannedCumulative - actualCumulative;

    if (plannedCumulative > 0 && progressGap > 0.01) {
      risks.push({
        level: 'medium',
        title: `${label} 实际进度落后，可能延期`,
        meta: `截至今日计划 ${plannedCumulative.toFixed(2)} 点，实际 ${actualCumulative.toFixed(2)} 点，差 ${progressGap.toFixed(2)} 点`,
        action: taskUsesTestHubProgress(task) ? 'task' : 'progress',
        actionLabel: taskUsesTestHubProgress(task) ? '查看自动进度' : '填报进度',
        taskId: task.id
      });
    }
    });
  });

  return risks;
}

    wrap.innerHTML = '<div class="dashboard-empty">资源数据加载失败，请先执行资源容量迁移后刷新</div>';

  }
  const memberFilter = document.getElementById('resourceMemberFilter');

    memberFilter.innerHTML = `<option value="all">全部成员</option>${resource.rows.map(row => `<option value="${row.member.id}">${escapeDashboardHtml(row.member.name || '未命名成员')}</option>`).join('')}`;
    memberFilter.value = resource.rows.some(row => row.member.id === dashboardResourceMemberFilter) ? dashboardResourceMemberFilter : 'all';
  }

    (dashboardResourceMemberFilter === 'all' || row.member.id === dashboardResourceMemberFilter)

    console.error('[dashboard] query failed:', error);
    return { data: fallback, failed: true };

}

function getTestHubSyncHealth(record, failed = false, now = new Date()) {
  if (failed) return { state:'failed', label:'不可用', stale:false };
  if (!record) return { state:'stale', label:'尚未同步', stale:true };
  if (record.status === 'running') return { state:'running', label:'同步中', stale:false };
  if (record.status === 'failed') return { state:'failed', label:'同步失败', stale:true };
  const lastSuccess = record.last_success_at ? new Date(record.last_success_at) : null;
  const stale = !lastSuccess || now.getTime() - lastSuccess.getTime() > 60 * 60 * 1000;
  return stale ? { state:'stale', label:'超过 1 小时', stale:true } : { state:'success', label:'运行正常', stale:false };
}

function renderTestHubSyncHealth(record, failed) {
  if (userRole !== 'admin') return;
  const dot = document.getElementById('testHubSyncHealthDot');
  const title = document.getElementById('testHubSyncHealthTitle');
  const meta = document.getElementById('testHubSyncHealthMeta');
  const state = document.getElementById('testHubSyncHealthState');
  const diagnostics = document.getElementById('testHubSyncDiagnostics');
  const errorBox = document.getElementById('testHubSyncError');
  const mappingButton = document.getElementById('testHubSyncMappingButton');
  if (!dot || !title || !meta || !state || !diagnostics || !errorBox || !mappingButton) return;
  const health = getTestHubSyncHealth(record, failed);
  dot.className = `sync-health-dot ${health.state}`;
  state.textContent = health.label;
  title.textContent = failed ? 'TestHub 同步健康状态尚未启用' : record?.status === 'failed' ? 'TestHub 本地同步最近一次失败' : 'TestHub 本地同步';
  const lastText = record?.last_success_at ? new Date(record.last_success_at).toLocaleString('zh-CN') : '暂无成功记录';
  const nextText = record?.next_expected_at ? new Date(record.next_expected_at).toLocaleTimeString('zh-CN', { hour:'2-digit', minute:'2-digit' }) : '--:--';
  meta.textContent = `上次成功：${lastText} · 下次预计：${nextText}`;
  diagnostics.innerHTML = record ? [
    `计划缓存 ${Number(record.cached_plan_count || 0)}`,
    `任务成功 ${Number(record.progress_success || 0)}`,
    `任务失败 ${Number(record.progress_failed || 0)}`,
    `执行记录 ${Number(record.execution_record_count || 0)}`,
    `已映射 ${Number(record.mapped_executor_count || 0)} 人`,
    `未映射 ${Number(record.unmapped_executor_count || 0)} 人`
  ].map(value => `<span class="sync-health-chip">${escapeDashboardHtml(value)}</span>`).join('') : '';
  const unmapped = Number(record?.unmapped_executor_count || 0);
  mappingButton.style.display = unmapped > 0 ? '' : 'none';
  mappingButton.textContent = `处理 ${unmapped} 位未映射成员`;
  errorBox.style.display = record?.status === 'failed' && record.error_message ? '' : 'none';
  errorBox.textContent = record?.status === 'failed' && record.error_message ? `失败原因：${record.error_message}` : '';
}

function dashboardRiskItemHtml(risk, index) {
  const label = risk.level === 'high' ? '高风险' : risk.level === 'medium' ? '中风险' : '提醒';
  const action = risk.action
    ? `<button class="risk-action" onclick="handleDashboardRiskAction(${index})">${escapeDashboardHtml(risk.actionLabel || '处理')}</button>`
    : '';
  const adminActions = userRole === 'admin'
    ? `<button class="risk-action" title="24 小时后再次提醒" onclick="setDashboardRiskAction(${index}, 'snoozed')">稍后</button><button class="risk-action" title="当前风险内容不再提醒；内容变化后会重新出现" onclick="setDashboardRiskAction(${index}, 'acknowledged')">已处理</button>`
    : '';
  return `<div class="risk-item"><span class="risk-level risk-${risk.level}"></span><div class="risk-main"><div class="risk-title">${escapeDashboardHtml(risk.title)}</div><div class="risk-meta">${label} · ${escapeDashboardHtml(risk.meta)}</div></div>${action}${adminActions}</div>`;
}

function dashboardRiskKey(risk) {
  const value = `${risk.level}|${risk.title}|${risk.meta}|${risk.taskId || ''}|${risk.action || ''}`;
  let hash = 2166136261;
  for (let index = 0; index < value.length; index += 1) {
    hash ^= value.charCodeAt(index);
    hash = Math.imul(hash, 16777619);
  }
  return `risk_${(hash >>> 0).toString(16)}`;
}

async function setDashboardRiskAction(index, action) {
  if (userRole !== 'admin') return;
  const risk = dashboardSnapshot?.risks?.[index];
  if (!risk?._key) return;
  const snoozedUntil = action === 'snoozed' ? new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString() : null;
  try {
    const { error } = await sb.from('admin_risk_actions').upsert({
      risk_key: risk._key,
      action,
      snoozed_until: snoozedUntil,
      updated_by: currentUser.id,
      updated_at: new Date().toISOString()
    });
    if (error) throw error;
    showToast(action === 'snoozed' ? '该风险已暂停提醒 24 小时' : '该风险已标记处理');
    await loadDashboardData(++dashboardLoadToken);
  } catch (error) {
    console.error('[risk] action failed:', error);
    showToast('风险状态保存失败：' + error.message, 'error');
  }
}

function renderDashboardRisks(risks, failed) {
  const list = document.getElementById('dashboardRiskList');
  const tag = document.getElementById('dashboardRiskTag');
  if (!list || !tag) return;

  if (failed) {
    tag.textContent = '部分失败';
    list.innerHTML = '<div class="dashboard-empty">部分风险数据加载失败，请刷新重试</div>';
    return;
  }

  const actionable = risks.filter(risk => risk.level !== 'low');
  const information = risks.filter(risk => risk.level === 'low');
  tag.textContent = information.length ? `${actionable.length} 风险 · ${information.length} 提醒` : `${actionable.length} 项`;
  if (!risks.length) {
    list.innerHTML = '<div class="dashboard-empty">当前没有发现阻断风险</div>';
    return;
  }

  const visible = dashboardRiskExpanded ? actionable : actionable.slice(0, 5);
  const activeHtml = actionable.length
    ? `<div class="risk-group-title">待处理风险</div>${visible.map(risk => dashboardRiskItemHtml(risk, risks.indexOf(risk))).join('')}${actionable.length > 5 ? `<button class="risk-more" onclick="toggleDashboardRisks()">${dashboardRiskExpanded ? '收起风险' : `查看全部 ${actionable.length} 项风险`}</button>` : ''}`
    : '<div class="dashboard-empty">当前没有需要立即处理的风险</div>';
  const infoHtml = information.length
    ? `<details class="risk-info-group"><summary>提醒信息（${information.length}）</summary>${information.map(risk => dashboardRiskItemHtml(risk, risks.indexOf(risk))).join('')}</details>`
    : '';
  list.innerHTML = activeHtml + infoHtml;
}

async function resolveTaskBusinessUnit(taskId) {
  const dashboardTasks = [
    ...(dashboardSnapshot?.todayTasks || []),
    ...(dashboardSnapshot?.upcomingTasks || []),
  ];
  let task = taskRecordCache.get(taskId)
    || dashboardTasks.find(item => item.id === taskId)
    || null;
  if (!task) {
    const { data, error } = await sb.from('qa_tasks')
      .select('id,project_id,portfolio_plan_id')
      .eq('id', taskId)
      .maybeSingle();
    if (error) throw error;
    task = data;
  }
  if (!task) return '';

  let projectId = task.project_id || '';
  if (!projectId && task.portfolio_plan_id) {
    const { data, error } = await sb.from('project_monthly_plans')
      .select('project_id')
      .eq('id', task.portfolio_plan_id)
      .maybeSingle();
    if (error) throw error;
    projectId = data?.project_id || '';
  }
  if (!projectId) return 'unassigned';

  const { data, error } = await sb.from('qa_projects')
    .select('business_unit')
    .eq('id', projectId)
    .maybeSingle();
  if (error) throw error;
  return data?.business_unit || 'unassigned';
}

async function openTaskFromDashboard(taskId, mode = 'edit') {
  try {
    const taskBusinessUnit = await resolveTaskBusinessUnit(taskId);
    if (['xiaomi','consumer','other','unassigned'].includes(taskBusinessUnit)) {
      projectHubUnit = taskBusinessUnit;
      try { localStorage.setItem('hanntoQaProjectBusinessUnit', taskBusinessUnit); } catch {}
    }
  } catch (error) {
    console.error('[dashboard] resolve task business unit failed:', error);
  }
  const item = document.querySelector(`.sb-item[onclick*="'tasks'"]`);
  document.querySelectorAll('.sb-item').forEach(element => element.classList.remove('active'));
  item?.classList.add('active');
  expandSidebarGroupForItem(item);
  document.getElementById('pageTitle').textContent = pageTitles.tasks;
  currentPage = 'tasks';
  updateProjectBusinessTabs(currentPage);
  await refreshTaskRecords();
  if (!taskRecordCache.has(taskId)) {
    showToast('该工作事项当前不可见，请确认事项归属项目及负责人', 'error');
    return;
  }
  resetTeamTaskFiltersForFocus(taskId);
  if (mode === 'progress' || mode === 'status') openProgressModal(taskId);
  else {
    const task = taskRecordCache.get(taskId);
    const editorMode = !task ? 'readonly'
      : canCurrentUserEditTask(task) ? 'full'
      : canCurrentUserUpdateTaskStatus(task) ? 'status'
      : 'readonly';
    await openEditQaTask(taskId, editorMode);
  }
}

async function handleDashboardRiskAction(index) {
  const risk = dashboardSnapshot?.risks?.[index];
  if (!risk) return;
  if (risk.action === 'task') { await openTaskFromDashboard(risk.taskId, 'edit'); return; }
  if (risk.action === 'progress') { await openTaskFromDashboard(risk.taskId, 'progress'); return; }
  if (risk.action === 'resource') {
    document.getElementById('resourceCapacityCard')?.scrollIntoView({ behavior:'smooth', block:'start' });
    return;
  }
  if (risk.action === 'sync_health') {
    document.getElementById('testHubSyncHealth')?.scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  navTo(risk.action);
}

    sb.from('task_testhub_progress').select('task_id,plan_id,plan_ids,total_cases,executed_cases,progress_ratio,status_counts,sync_status,synced_at,scope_mode,scope_suite_ids,scope_suite_names'),
    userRole === 'admin'

      : Promise.resolve({ data:null, error:null }),
    sb.from('qa_task_assignees').select('task_id,member_id,allocated_effort'),
    sb.from('task_testhub_daily_execution').select('*'),
    sb.from('qa_task_allocation_history').select('task_id,revision,total_effort,allocation_start_date,allocation_end_date,assignments,changed_by,changed_at').order('changed_at', { ascending:false }),
    userRole === 'admin'
      ? sb.from('admin_risk_actions').select('risk_key,action,snoozed_until,updated_at')
      : Promise.resolve({ data:[], error:null }),
    userRole === 'admin'
      ? sb.from('quality_defects').select('id,title,executor_id,review_status,found_at,exposed_stage,severity').neq('review_status','completed').order('found_at',{ascending:true})
      : sb.from('quality_defects').select('id,title,executor_id,review_status,found_at,exposed_stage,severity').eq('executor_id',currentUser.id).neq('review_status','completed').order('found_at',{ascending:true})
  ]);

  if (token !== dashboardLoadToken || currentPage !== 'dashboard') return;

  const releaseResult = dashboardQueryResult(results[0], []);
  const tasksResult = dashboardQueryResult(results[1], []);
  const runsResult = dashboardQueryResult(results[2], []);
  const devicesResult = dashboardQueryResult(results[3], []);
  const consumablesResult = dashboardQueryResult(results[4], []);
  const checksResult = dashboardQueryResult(results[5], []);
  const resourceMembersResult = dashboardQueryResult(results[6], []);
  const resourceTasksResult = dashboardQueryResult(results[7], []);
  const workCalendarResult = dashboardQueryResult(results[8], []);
  const progressResult = dashboardQueryResult(results[9], []);
  const testHubProgressResult = dashboardQueryResult(results[10], []);
  const syncHealthResult = dashboardQueryResult(results[11], null);
  const taskAssigneesResult = dashboardQueryResult(results[12], []);
  const testHubDailyResult = dashboardQueryResult(results[13], []);
  const allocationHistoryResult = dashboardQueryResult(results[14], []);
  const riskActionsResult = dashboardQueryResult(results[15], []);
  const pendingDefectsResult = dashboardQueryResult(results[16], []);
  taskAssigneesByTask = new Map();
  taskAssigneesResult.data.forEach(item => {
    const list = taskAssigneesByTask.get(item.task_id) || [];
    list.push(item);
    taskAssigneesByTask.set(item.task_id, list);
  });
  taskTestHubDailyByTask = new Map();
  testHubDailyResult.data.forEach(item => {
    const list = taskTestHubDailyByTask.get(item.task_id) || [];
    list.push(item);
    taskTestHubDailyByTask.set(item.task_id, list);
  });
  taskAllocationHistoryByTask = new Map();
  allocationHistoryResult.data.forEach(item => {
    const list = taskAllocationHistoryByTask.get(item.task_id) || [];
    list.push(item);
    taskAllocationHistoryByTask.set(item.task_id, list);
  });
  const activeReleases = releaseResult.data || [];
  const activeRelease = activeReleases[0] || null;
  if (!workCalendarResult.failed) {
    dashboardWorkCalendar = new Map(workCalendarResult.data.map(day => [day.work_date, day]));
  }
  rebuildTaskSchedule(resourceMembersResult.data, resourceTasksResult.data, dashboardWorkCalendar);

  const myAssignedTasks = tasksResult.data.filter(task =>
    taskAssigneeList(task).some(assignment => assignment.member_id === currentUser.id)
  );
  const todayKey = dashboardTodayInputValue();
  const todayIsWorkday = isResourceWorkday(todayKey, dashboardWorkCalendar);

  const todayTasks = myAssignedTasks
    .filter(task => !dashboardCompletingTaskIds.has(task.id) && (
      (task.due_date && new Date(task.due_date) <= todayEnd)
      || (todayIsWorkday && task.allocation_start_date <= todayKey && task.allocation_end_date >= todayKey)
    ))
    .sort((a, b) => {
      const aOverdue = new Date(a.due_date) < todayStart ? 0 : 1;
      const bOverdue = new Date(b.due_date) < todayStart ? 0 : 1;
      if (aOverdue !== bOverdue) return aOverdue - bOverdue;
      const priorityOrder = { P0: 0, P1: 1, P2: 2 };
      if (priorityOrder[a.priority] !== priorityOrder[b.priority]) return priorityOrder[a.priority] - priorityOrder[b.priority];
      return new Date(a.due_date) - new Date(b.due_date);
    });

  const upcomingEnd = new Date(todayEnd);
  upcomingEnd.setDate(upcomingEnd.getDate() + 3);
  const upcomingTasks = myAssignedTasks
    .filter(task => !dashboardCompletingTaskIds.has(task.id)
      && !todayTasks.some(todayTask => todayTask.id === task.id)
      && ((task.allocation_start_date && new Date(`${task.allocation_start_date}T23:59:59`) <= upcomingEnd)
        || (task.due_date && new Date(task.due_date) <= upcomingEnd)))
    .sort((a, b) => new Date(a.allocation_start_date || a.due_date) - new Date(b.allocation_start_date || b.due_date));

  const automationFailures = runsResult.data.filter(run => run.status === 'failed');
  const staleBefore = now.getTime() - 2 * 60 * 60 * 1000;
  const staleRuns = runsResult.data.filter(run => run.status === 'running' && run.started_at && new Date(run.started_at).getTime() < staleBefore);
  const offlineDevices = devicesResult.data.filter(device => device.is_online === false);
  const lowStock = consumablesResult.data.filter(item => Number(item.quantity) <= Number(item.threshold));
  const activeReleaseIds = new Set(activeReleases.map(release => release.id));
  const releaseChecks = checksResult.data.filter(check => activeReleaseIds.has(check.release_id));
  const resource = userRole === 'admin'
    ? buildResourceCapacity(resourceMembersResult.data, resourceTasksResult.data, dashboardWorkCalendar)
    : { dates: [], rows: [], risks: [] };
  const scheduleTasks = (userRole === 'admin' ? resourceTasksResult.data : myAssignedTasks)
    .filter(task => ['todo', 'in_progress', 'blocked'].includes(task.status));
  const taskScheduleRisks = buildTaskScheduleRisks(scheduleTasks, resourceMembersResult.data, progressResult.data, testHubProgressResult.data, now, dashboardWorkCalendar);
  const testHubSnapshotMap = new Map(testHubProgressResult.data.map(snapshot => [snapshot.task_id, snapshot]));
  const memberPlannedToday = myAssignedTasks
    .filter(task => todayIsWorkday && task.allocation_start_date <= todayKey && task.allocation_end_date >= todayKey)
    .reduce((sum, task) => sum + taskMemberDailyPlanOnDate(task, currentUser.id, todayKey), 0);
  const memberActualToday = myAssignedTasks.reduce((sum, task) => {
    if (taskUsesTestHubProgress(task)) return sum + taskMemberTestHubPoints(task, currentUser.id, todayKey, testHubSnapshotMap.get(task.id));
    return sum + progressResult.data
      .filter(log => log.task_id === task.id && log.executor_id === currentUser.id && log.work_date === todayKey && log.source === 'manual')
      .reduce((subtotal, log) => subtotal + Number(log.progress_points || 0), 0);
  }, 0);
  const memberGapToday = Math.max(memberPlannedToday - memberActualToday, 0);
  const pendingDefects = pendingDefectsResult.data;

  const risks = [];
  if (pendingDefects.length) {
    const oldest = pendingDefects[0];
    risks.push({
      level: pendingDefects.some(item => item.exposed_stage === 'production' || ['P0','P1'].includes(item.severity)) ? 'high' : 'medium',
      title: userRole === 'admin' ? `全员有 ${pendingDefects.length} 个 BUG 待负责人复盘` : `我有 ${pendingDefects.length} 个 BUG 待复盘`,
      meta: `最早：${oldest.title} · ${oldest.found_at}`,
      action:'bugs', actionLabel:userRole === 'admin' ? '查看复盘进度' : '去填写'
    });
  }
  if (userRole === 'admin' && automationFailures.length) risks.push({ level:'high', title:`最近24小时有 ${automationFailures.length} 次自动化失败`, meta:'检查执行历史与失败原因', action:'automation', actionLabel:'查看结果' });
  if (userRole === 'admin' && staleRuns.length) risks.push({ level:'high', title:`${staleRuns.length} 个自动化任务运行超过2小时`, meta:'检查 Runner 和设备状态', action:'automation', actionLabel:'查看任务' });
  if (userRole === 'admin' && offlineDevices.length) risks.push({ level:'high', title:`${offlineDevices.length} 台自动化设备离线`, meta:offlineDevices.map(d => d.model_name || d.platform).slice(0,3).join('、'), action:'automation', actionLabel:'检查设备' });
  risks.push(...taskScheduleRisks);
  if (userRole === 'admin' && lowStock.length) risks.push({ level:'medium', title:`${lowStock.length} 项耗材库存不足`, meta:lowStock.map(item => item.name).slice(0,3).join('、'), action:'assets', actionLabel:'查看库存' });
  if (userRole === 'admin') releaseChecks.forEach(check => risks.push({
    level: check.severity === 'high' ? 'high' : check.severity === 'low' ? 'low' : 'medium',
    title: check.check_name,
    meta: check.status === 'failed' ? '版本检查未通过' : '版本检查数据暂不可用',
    action: 'prd', actionLabel: '查看版本'
  }));
  if (userRole === 'admin' && !activeReleases.length && !releaseResult.failed) risks.push({ level:'low', title:'当前活动版本未设置', meta:'可分别设置 APP、Pad、PC 当前版本', action:'prd', actionLabel:'去设置' });
  if (userRole === 'admin' && !syncHealthResult.failed) {
    const syncHealth = getTestHubSyncHealth(syncHealthResult.data, false, now);
    if (syncHealthResult.data?.status === 'failed') {
      risks.push({ level:'high', title:'TestHub 本地同步失败', meta:syncHealthResult.data.error_message || '请检查本地定时任务日志', action:'sync_health', actionLabel:'查看状态' });
    } else if (syncHealth.stale) {
      risks.push({ level:'medium', title:'TestHub 超过 1 小时未成功同步', meta:'请确认电脑未休眠且 Windows 定时任务正常运行', action:'sync_health', actionLabel:'查看状态' });
    }
    if (Number(syncHealthResult.data?.unmapped_executor_count || 0) > 0) {
      const names = [...new Set(testHubDailyResult.data.filter(row => !row.member_id).map(row => row.executor_name).filter(Boolean))];
      risks.push({
        level:'medium',
        title:`TestHub 有 ${syncHealthResult.data.unmapped_executor_count} 位执行人尚未映射`,
        meta:names.length ? names.slice(0, 4).join('、') : '请在成员管理中绑定 PingCode 用户 ID',
        action:'members', actionLabel:'去映射'
      });
    }
  }
  if (userRole === 'admin' && !resourceMembersResult.failed && !resourceTasksResult.failed) {
    risks.push(...resource.risks);
  }
  const riskActionMap = new Map(riskActionsResult.data.map(item => [item.risk_key, item]));
  const deduplicatedRisks = [];
  const seenRiskKeys = new Set();
  risks.forEach(risk => {
    risk._key = dashboardRiskKey(risk);
    if (seenRiskKeys.has(risk._key)) return;
    seenRiskKeys.add(risk._key);
    const savedAction = riskActionMap.get(risk._key);
    const isHidden = savedAction?.action === 'acknowledged'
      || (savedAction?.action === 'snoozed' && new Date(savedAction.snoozed_until) > now);
    if (!isHidden) deduplicatedRisks.push(risk);
  });
  if (userRole === 'admin') {
    const resolvedKeys = riskActionsResult.data.map(item => item.risk_key).filter(key => !seenRiskKeys.has(key));
    if (resolvedKeys.length) {
      sb.from('admin_risk_actions').delete().in('risk_key', resolvedKeys)
        .then(({ error }) => { if (error) console.warn('[risk] resolved action cleanup failed:', error); });
    }
  }
  risks.length = 0;
  risks.push(...deduplicatedRisks);
  const riskOrder = { high: 0, medium: 1, low: 2 };
  risks.sort((a, b) => riskOrder[a.level] - riskOrder[b.level]);

  const resourceDataFailed = userRole === 'admin' && (resourceMembersResult.failed || resourceTasksResult.failed || workCalendarResult.failed);
  const systemRiskDataFailed = userRole === 'admin' && (riskActionsResult.failed || runsResult.failed || devicesResult.failed || consumablesResult.failed || checksResult.failed || releaseResult.failed || resourceDataFailed || syncHealthResult.failed);
  const riskDataFailed = tasksResult.failed || progressResult.failed || testHubProgressResult.failed || allocationHistoryResult.failed || pendingDefectsResult.failed || systemRiskDataFailed;
  if (userRole === 'admin') {
    setDashboardMetric('sc-tasks', todayTasks.length, tasksResult.failed);
    setDashboardMetric('sc-auto-failed', automationFailures.length, runsResult.failed);
    setDashboardMetric('sc-offline', offlineDevices.length, devicesResult.failed);
    setDashboardMetric('sc-low-stock', lowStock.length, consumablesResult.failed);
  } else {
    setDashboardMetric('sc-plan', memberPlannedToday.toFixed(2), tasksResult.failed || progressResult.failed);
    setDashboardMetric('sc-actual', memberActualToday.toFixed(2), tasksResult.failed || progressResult.failed || testHubProgressResult.failed);
    setDashboardMetric('sc-gap', memberGapToday.toFixed(2), tasksResult.failed || progressResult.failed || testHubProgressResult.failed);
    setDashboardMetric('sc-my-risks', risks.filter(risk => risk.level !== 'low').length, riskDataFailed);
  }
  renderDashboardTasks(todayTasks, upcomingTasks, tasksResult.failed, todayStart, todayEnd);
  renderResourceCapacity(resource, resourceDataFailed);
  renderTestHubSyncHealth(syncHealthResult.data, syncHealthResult.failed);
  renderDashboardRisks(risks, riskDataFailed);

  const releaseText = document.getElementById('dashboardReleaseText');
  const statusBadge = document.getElementById('dashboardStatusBadge');
  const versionTag = document.getElementById('versionTag');
  const activeReleaseText = activeReleases.map(release => `${releasePlatformText(release.platform)} ${release.name || release.version}`).join(' · ');
  if (releaseText) {
    releaseText.textContent = activeReleases.length
      ? `当前版本：${activeReleaseText}`
      : releaseResult.failed ? '当前版本加载失败' : '当前版本：暂未设置';
  }
  if (versionTag) versionTag.textContent = releaseResult.failed ? '加载失败' : activeReleases.length > 1 ? `${activeReleases.length} 个当前版本` : activeRelease?.version || '暂未设置';
  if (statusBadge) {
    const actionableRiskCount = risks.filter(risk => risk.level !== 'low').length;
    statusBadge.textContent = riskDataFailed ? '部分数据加载失败' : actionableRiskCount ? `${actionableRiskCount} 项风险待处理` : risks.length ? `${risks.length} 项提醒` : '今日状态良好';
  }

  resourceSourceMembers = resourceMembersResult.data || [];
  resourceSourceTasks = resourceTasksResult.data || [];
  dashboardSnapshot = { activeRelease, activeReleases, todayTasks, upcomingTasks, risks, resource, loadedAt: now };
}

function taskMemberManualProgressTotal(task, memberId, excludedIds = []) {
  const excluded = new Set(excludedIds);
  return (taskProgressByTask.get(task.id) || [])
    .filter(log => log.source === 'manual' && log.executor_id === memberId && !excluded.has(log.id))
    .reduce((sum, log) => sum + Number(log.progress_points || 0), 0);
}

function renderProgressBatchInputs(task, names) {
  const container = document.getElementById('progressBatchMembers');
  if (!container) return;
  container.innerHTML = taskAssigneeList(task).map(item => {
    const memberId = item.member_id;
    const allocated = Number(item.allocated_effort || 0);
    return `<div style="display:grid;grid-template-columns:minmax(100px,1fr) 100px 36px minmax(150px,1.4fr);gap:7px;align-items:start;padding:9px;border:1px solid var(--line);border-radius:11px;background:#fffdfb;">
      <div><strong>${escapeDashboardHtml(names.get(memberId) || '未命名成员')}</strong><div class="release-meta">分配 ${allocated.toFixed(2)} 人天</div></div>
      <input class="dashboard-input" id="batchProgressPercent-${memberId}" type="number" min="0" max="100" step="1" placeholder="完成度" oninput="markBatchProgressTouched('${memberId}')">
      <span style="padding-top:9px;font-weight:700;color:var(--purple);">%</span>
      <div><input class="dashboard-input" id="batchProgressNote-${memberId}" maxlength="1000" placeholder="工作说明（选填）" oninput="markBatchProgressTouched('${memberId}')"><div class="assignee-allocation-note" id="batchProgressHint-${memberId}"></div></div>
    </div>`;
  }).join('');
}

function batchProgressState(task, memberId) {
  const dateKey = document.getElementById('progressWorkDate')?.value || dashboardTodayInputValue();
  const allocation = taskAssigneeList(task).find(item => item.member_id === memberId);
  const allocated = Number(allocation?.allocated_effort || 0);
  const logs = (taskProgressByTask.get(task.id) || []).filter(log => log.source === 'manual' && log.executor_id === memberId && log.work_date === dateKey);
  const otherPoints = taskMemberManualProgressTotal(task, memberId, logs.map(log => log.id));
  const percentInput = document.getElementById(`batchProgressPercent-${memberId}`);
  const percent = Number(percentInput?.value || 0);
  const targetPoints = allocated * percent / 100;
  const currentPoints = logs.reduce((sum, log) => sum + Number(log.progress_points || 0), 0);
  const currentTotal = otherPoints + currentPoints;
  return {
    memberId, dateKey, allocated, logs, otherPoints, percent,
    points:targetPoints - otherPoints,
    currentPoints,
    currentPercent:allocated > 0 ? currentTotal / allocated * 100 : 0
  };
}

function updateBatchProgressHint(memberId) {
  const task = taskRecordCache.get(progressQaTaskId);
  const hint = document.getElementById(`batchProgressHint-${memberId}`);
  if (!task || !hint) return;
  const state = batchProgressState(task, memberId);
  const planned = taskMemberDailyPlanOnDate(task, memberId, state.dateKey);
  hint.textContent = state.points < -0.001
    ? `目标低于其他日期已完成 ${state.otherPoints.toFixed(2)} 点`
    : `本日换算 ${Math.max(0, state.points).toFixed(2)} 点 · 当天计划 ${planned.toFixed(2)} 点`;
}

function markBatchProgressTouched(memberId) {
  progressBatchTouchedMembers.add(memberId);
  updateBatchProgressHint(memberId);
}

function loadProgressBatchEntries() {
  const task = taskRecordCache.get(progressQaTaskId);
  if (!task) return;
  progressBatchTouchedMembers = new Set();
  taskAssigneeList(task).forEach(item => {
    const memberId = item.member_id;
    const allocated = Number(item.allocated_effort || 0);
    const percentInput = document.getElementById(`batchProgressPercent-${memberId}`);
    const noteInput = document.getElementById(`batchProgressNote-${memberId}`);
    const state = batchProgressState(task, memberId);
    const currentTotal = taskMemberManualProgressTotal(task, memberId);
    if (percentInput) percentInput.value = allocated > 0 ? Math.min(100, currentTotal / allocated * 100).toFixed(1).replace(/\.0$/, '') : '';
    if (noteInput) {
      const latest = [...state.logs].sort((a,b) => new Date(b.created_at) - new Date(a.created_at))[0];
      noteInput.value = latest?.note || '';
    }
    updateBatchProgressHint(memberId);
  });
}

function loadProgressEntriesForDate() {
  if (progressBatchMode) loadProgressBatchEntries();
  else loadProgressEntryForSelection();
}

function syncProgressPercentToPoints() {
  const task = taskRecordCache.get(progressQaTaskId);
  const percentInput = document.getElementById('progressPercent');
  const pointsInput = document.getElementById('progressPoints');
  const hint = document.getElementById('progressEntryHint');
  if (!task || !percentInput || !pointsInput) return;
  const raw = percentInput.value.trim();
  if (!raw) { pointsInput.value = ''; return; }
  const percent = Number(raw);
  const executorId = document.getElementById('progressExecutor')?.value;
  const effort = Number(taskAssigneeList(task).find(item => item.member_id === executorId)?.allocated_effort || task.effort_person_days || 0);
  const selectedLogs = progressLogsForSelection();
  const otherPoints = taskMemberManualProgressTotal(task, executorId, selectedLogs.map(log => log.id));
  const targetPoints = effort * percent / 100;
  const replacementPoints = targetPoints - otherPoints;
  pointsInput.value = Number.isFinite(replacementPoints) ? replacementPoints.toFixed(4) : '';
  const planned = taskMemberDailyPlanOnDate(task, document.getElementById('progressExecutor')?.value, document.getElementById('progressWorkDate')?.value || dashboardTodayInputValue());
  if (hint) hint.textContent = replacementPoints < -0.001
    ? `目标累计 ${percent.toFixed(1)}%（${targetPoints.toFixed(2)} 点）低于其他日期已填 ${otherPoints.toFixed(2)} 点，请先修正历史记录。`
    : `个人分配 ${effort.toFixed(2)} 人天；目标累计 ${percent.toFixed(1)}% = ${targetPoints.toFixed(2)} 点，本次日期换算 ${Math.max(0, replacementPoints).toFixed(2)} 点，当天计划 ${planned.toFixed(2)} 点。`;
}

function markProgressPercentTouched() {
  progressPercentTouched = true;
  syncProgressPercentToPoints();
}

function setProgressPercent(value) {
  const input = document.getElementById('progressPercent');
  if (!input) return;
  input.value = String(value);
  markProgressPercentTouched();
}

function progressLogsForSelection() {
  const task = taskRecordCache.get(progressQaTaskId);
  const executorId = document.getElementById('progressExecutor')?.value;
  const dateKey = document.getElementById('progressWorkDate')?.value || dashboardTodayInputValue();
  if (!task || !executorId) return [];
  return (taskProgressByTask.get(task.id) || []).filter(log => log.source === 'manual' && log.executor_id === executorId && log.work_date === dateKey);
}

function renderProgressHistoryList(task) {
  const container = document.getElementById('progressHistoryList');
  if (!container) return;
  const names = new Map(dashboardMembers.map(member => [member.id, member.name || '未命名成员']));
  const visibleLogs = (taskProgressByTask.get(task.id) || [])
    .filter(log => log.source === 'manual' && (userRole === 'admin' || log.executor_id === currentUser.id));
  const groups = new Map();
  visibleLogs.forEach(log => {
    const key = `${log.work_date}|${log.executor_id}`;
    const group = groups.get(key) || { work_date:log.work_date, executor_id:log.executor_id, points:0, count:0 };
    group.points += Number(log.progress_points || 0);
    group.count += 1;
    groups.set(key, group);
  });
  const entries = [...groups.values()].sort((a, b) => String(b.work_date).localeCompare(String(a.work_date))).slice(0, 8);
  container.innerHTML = entries.length
    ? `<div class="form-label">最近填报（点击即可修改）</div><div style="display:flex;gap:6px;flex-wrap:wrap;">${entries.map(item => `<button class="btn-secondary" type="button" onclick="selectProgressEntry('${escapeDashboardHtml(item.work_date)}','${escapeDashboardHtml(item.executor_id)}')">${escapeDashboardHtml(item.work_date.slice(5).replace('-', '/'))} · ${escapeDashboardHtml(names.get(item.executor_id) || '未命名成员')} · ${item.points.toFixed(2)} 点${item.count > 1 ? `（${item.count} 条）` : ''}</button>`).join('')}</div>`
    : '<div class="assignee-allocation-note">暂无历史手工填报</div>';
}

function selectProgressEntry(workDate, executorId) {
  const dateInput = document.getElementById('progressWorkDate');
  const executorSelect = document.getElementById('progressExecutor');
  if (dateInput) dateInput.value = workDate;
  if (progressBatchMode) {
    loadProgressBatchEntries();
    document.getElementById(`batchProgressPercent-${executorId}`)?.focus();
    return;
  }
  if (executorSelect && [...executorSelect.options].some(option => option.value === executorId)) executorSelect.value = executorId;
  loadProgressEntryForSelection();
}

function loadProgressEntryForSelection() {
  const task = taskRecordCache.get(progressQaTaskId);
  const executorId = document.getElementById('progressExecutor')?.value;
  const dateKey = document.getElementById('progressWorkDate')?.value || dashboardTodayInputValue();
  const pointsInput = document.getElementById('progressPoints');
  const percentInput = document.getElementById('progressPercent');
  const noteInput = document.getElementById('progressNote');
  const hint = document.getElementById('progressEntryHint');
  const deleteButton = document.getElementById('deleteProgressBtn');
  if (!task || !executorId || !pointsInput || !percentInput || !noteInput) return;
  const logs = progressLogsForSelection();
  const planned = taskMemberDailyPlanOnDate(task, executorId, dateKey);
  const totalEffort = Number(taskAssigneeList(task).find(item => item.member_id === executorId)?.allocated_effort || task.effort_person_days || 0);
  const currentTotal = taskMemberManualProgressTotal(task, executorId);
  percentInput.value = totalEffort > 0 ? Math.min(100, currentTotal / totalEffort * 100).toFixed(1).replace(/\.0$/, '') : '';
  progressPercentTouched = false;
  if (logs.length) {
    pointsInput.value = logs.reduce((sum, log) => sum + Number(log.progress_points || 0), 0).toFixed(2);
    const latest = [...logs].sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
    noteInput.value = latest?.note || '';
    if (hint) hint.textContent = `已有 ${logs.length} 条填报；保存后合并覆盖为一个正确值。当天计划 ${planned.toFixed(2)} 点。`;
    if (deleteButton) deleteButton.style.display = '';
  } else {
    pointsInput.value = '';
    pointsInput.placeholder = `当天计划 ${planned.toFixed(2)} 点`;
    noteInput.value = '';
    if (hint) hint.textContent = `尚未填报；当天计划 ${planned.toFixed(2)} 点。留空可仅修改状态。`;
    if (deleteButton) deleteButton.style.display = 'none';
  }
  syncProgressPercentToPoints();
}

}

function progressSavePreview(task, states, status, options = {}) {
  const names = new Map(dashboardMembers.map(member => [member.id, member.name || '未命名成员']));
  const body = document.getElementById('progressSavePreviewBody');
  const modal = document.getElementById('progressSavePreviewModal');
  if (!body || !modal) return Promise.resolve(false);
  const items = states.map(state => {
    const newDailyPoints = Math.max(0, Number(state.points || 0));
    const dailyDelta = newDailyPoints - Number(state.currentPoints || 0);
    return `<div class="progress-preview-item"><div><strong>${escapeDashboardHtml(names.get(state.memberId) || '未命名成员')}</strong><div class="release-meta">累计完成度 ${Number(state.currentPercent || 0).toFixed(1)}% → ${Number(state.percent || 0).toFixed(1)}%</div></div><span class="progress-preview-delta">本日 ${dailyDelta >= 0 ? '+' : ''}${dailyDelta.toFixed(2)} 点</span></div>`;
  }).join('');
  const completionOption = options.suggestDone
    ? `<label class="progress-preview-item" style="cursor:pointer;"><div><strong>全员进度已达到 100%</strong><div class="release-meta">建议同时结束任务，取消勾选则保留当前状态</div></div><input id="progressPreviewMarkDone" type="checkbox" checked style="accent-color:var(--pink);"></label>`
    : '';
  const incompleteWarning = options.incompleteDone
    ? '<div class="task-data-warning danger" style="margin-top:10px;padding:9px;">仍有负责人不足 100%，确认保存后任务仍会标记为“已完成”。</div>'
    : '';
  body.innerHTML = `<div class="task-detail-section" style="margin-top:0;"><div class="task-detail-section-title">任务状态</div><strong>${escapeDashboardHtml(taskStatusText(task.status))} → ${escapeDashboardHtml(taskStatusText(status))}</strong>${completionOption}${incompleteWarning}</div>${states.length ? `<div class="progress-preview-list">${items}</div>` : '<div class="assignee-allocation-note">本次仅修改任务状态，不修改成员进度。</div>'}`;
  modal.classList.add('open');
  return new Promise(resolve => { progressPreviewResolver = resolve; });
}

function resolveProgressSavePreview(confirmed) {
  document.getElementById('progressSavePreviewModal')?.classList.remove('open');
  const resolver = progressPreviewResolver;
  const markDone = Boolean(document.getElementById('progressPreviewMarkDone')?.checked);
  progressPreviewResolver = null;
  if (resolver) resolver({ confirmed:Boolean(confirmed), markDone });
}

function progressCompletionSnapshot(task, changedStates) {
  const changed = new Map(changedStates.map(state => [state.memberId, Number(state.percent || 0)]));
  return taskAssigneeList(task).map(item => {
    const allocated = Number(item.allocated_effort || 0);
    const currentPercent = allocated > 0
      ? taskMemberManualProgressTotal(task, item.member_id) / allocated * 100
      : 0;
    return { memberId:item.member_id, percent:changed.has(item.member_id) ? changed.get(item.member_id) : currentPercent };
  });
}

async function saveTaskProgress() {
  const task = taskRecordCache.get(progressQaTaskId);

  const rawPoints = document.getElementById('progressPoints')?.value.trim() || '';
