  document.getElementById('portfolioPlanStartMonth').value = (record?.plan_month || portfolioSelectedMonth).slice(0, 7);
  document.getElementById('portfolioPlanEndMonth').value = (record?.end_month || record?.plan_month || portfolioSelectedMonth).slice(0, 7);
  document.getElementById('portfolioProjectName').value = record?.project_name || '';
  document.getElementById('portfolioProjectType').value = record?.project_type || 'app';
  document.getElementById('portfolioOwnerName').value = record?.owner_name || '';
  document.getElementById('portfolioPlanStatus').value = record?.status || 'planned';
  document.getElementById('portfolioPlanNotes').value = record?.notes || '';
  document.getElementById('portfolioPlanModal').classList.add('open');
  await loadPortfolioQaProjectOptions(record?.project_id || '');
  const allocations = record?.monthly_allocations && Object.keys(record.monthly_allocations).length
    ? record.monthly_allocations
    : (record ? { [record.plan_month]:Number(record.required_person_months || 0) } : {});
  renderPortfolioAllocationInputs(allocations);
  setTimeout(() => document.getElementById('portfolioProjectName')?.focus(), 50);
}

function closePortfolioPlanEditor() {
  document.getElementById('portfolioPlanModal')?.classList.remove('open');
  editingPortfolioPlanId = null;
}

async function savePortfolioPlan() {
  if (userRole !== 'admin') return;
  const startMonth = document.getElementById('portfolioPlanStartMonth')?.value || '';
  const endMonth = document.getElementById('portfolioPlanEndMonth')?.value || '';
  const projectName = document.getElementById('portfolioProjectName')?.value.trim() || '';
  const projectId = document.getElementById('portfolioQaProject')?.value || '';
  const allocations = collectPortfolioAllocationInputs();
  const required = Object.values(allocations).reduce((sum, value) => sum + value, 0);
  if (!startMonth || !endMonth || !projectName || !projectId || !(required > 0)) {
    showToast('请选择项目，并完整填写起止月份、项目名称和至少一个月的投入人月', 'error');
    return;
  }
  if (endMonth < startMonth) {
    showToast('结束月份不能早于开始月份', 'error');
    return;
  }
  const payload = {
    plan_month:`${startMonth}-01`,
    end_month:`${endMonth}-01`,
    project_name:projectName,
    project_id:projectId,
    project_type:document.getElementById('portfolioProjectType').value,
    required_person_months:required,
    monthly_allocations:allocations,
    owner_name:document.getElementById('portfolioOwnerName').value.trim(),
    status:document.getElementById('portfolioPlanStatus').value,
    notes:document.getElementById('portfolioPlanNotes').value.trim()
  };
  const button = document.getElementById('savePortfolioPlanBtn');
  button.disabled = true;
  const wasEditing = Boolean(editingPortfolioPlanId);
  try {
    const result = editingPortfolioPlanId
      ? await sb.from('project_monthly_plans').update(payload).eq('id', editingPortfolioPlanId)
      : await sb.from('project_monthly_plans').insert({ ...payload, created_by:currentUser.id });
    if (result.error) throw result.error;
    portfolioSelectedMonth = payload.plan_month;
    closePortfolioPlanEditor();
    showToast(wasEditing ? '项目排期已更新' : '项目排期已添加');
    await renderPortfolioPlanning();
  } catch (error) {
    console.error('[portfolio] save failed:', error);
    showToast('项目排期保存失败：' + error.message, 'error');
  } finally {
    button.disabled = false;
  }
}

async function deletePortfolioPlan(id) {
  if (userRole !== 'admin') return;
  const record = portfolioPlanCache.get(id);
  if (!record || !window.confirm(`确认删除“${record.project_name}”的排期吗？`)) return;
  const { error } = await sb.from('project_monthly_plans').delete().eq('id', id);
  if (error) { showToast('删除失败：' + error.message, 'error'); return; }
  showToast('项目排期已删除');
  await renderPortfolioPlanning();
}

async function changePortfolioMonth(value) {
  portfolioSelectedMonth = value ? `${value.slice(0, 7)}-01` : portfolioMonthKey();
  await renderPortfolioPlanning();
}

async function shiftPortfolioMonth(offset) {
  portfolioSelectedMonth = portfolioShiftedMonth(portfolioSelectedMonth || portfolioMonthKey(), offset);
  await renderPortfolioPlanning();
}

async function renderPortfolioPlanning() {
  const content = document.getElementById('content');
  content.style.padding = '24px';
  if (!canManageQa()) {
    content.innerHTML = '<div class="history-card"><div class="dashboard-empty">项目总排期仅供系统管理员和 QA 负责人查看</div></div>';
    return;
  }
  portfolioSelectedMonth ||= portfolioMonthKey();
  content.innerHTML = '<div class="history-card"><div class="dashboard-loading">正在汇总项目排期与团队容量…</div></div>';
  const firstMonth = portfolioSelectedMonth;
  const months = Array.from({ length:6 }, (_, index) => portfolioShiftedMonth(firstMonth, index));
  const calendarFrom = months[0];
  const calendarTo = portfolioShiftedMonth(months.at(-1), 1);
  try {
    const [plansResult, membersResult, calendarResult, tasksResult, assigneesResult, activityResult, serverTimeResult, projectsResult] = await Promise.all([
      sb.from('project_monthly_plans').select('*').lt('plan_month', calendarTo).gte('end_month', calendarFrom).order('plan_month').order('project_name'),
      sb.from('profiles').select('id,name,daily_capacity,resource_participant').eq('resource_participant', true).order('name'),
      sb.from('work_calendar').select('work_date,is_workday,name'),
      sb.from('qa_tasks').select('id,title,assignee_id,portfolio_plan_id,status,created_at,completed_at,effort_person_days,allocation_start_date,allocation_end_date,allocation_start_period,allocation_end_period').not('portfolio_plan_id','is',null).neq('status','cancelled'),
      sb.from('qa_task_assignees').select('task_id,member_id'),
      sb.from('qa_task_activity').select('task_id,new_values,created_at').order('created_at', { ascending:true }).limit(10000),
      sb.rpc('qa_server_now'),
      sb.from('qa_projects').select('id,name,business_unit,status')
    ]);
    for (const result of [plansResult, membersResult, calendarResult, tasksResult, assigneesResult, activityResult, projectsResult]) if (result.error) throw result.error;
    const projectMap = new Map((projectsResult.data || []).map(project => [project.id, project]));
    const plans = (plansResult.data || []).filter(plan => {
      const project = projectMap.get(plan.project_id);
      return projectHubUnit === 'unassigned'
        ? !plan.project_id
        : project?.status !== 'archived' && project?.business_unit === projectHubUnit;
    });
    const unassignedPlanCount = (plansResult.data || []).filter(plan => !plan.project_id && plan.status !== 'cancelled').length;
    const members = membersResult.data || [];
    const calendar = new Map((calendarResult.data || []).map(item => [item.work_date, item]));
    const activityByTask = new Map();
    (activityResult.data || []).forEach(activity => {
      const activities = activityByTask.get(activity.task_id) || [];
      activities.push(activity);
      activityByTask.set(activity.task_id, activities);
    });
    const memberNameById = new Map(members.map(member => [member.id, member.name || '未命名成员']));
    const assigneeIdsByTask = new Map();
    (assigneesResult.data || []).forEach(item => {
      const ids = assigneeIdsByTask.get(item.task_id) || [];
      if (!ids.includes(item.member_id)) ids.push(item.member_id);
      assigneeIdsByTask.set(item.task_id, ids);
    });
    const actualByPlan = new Map();
    const serverTimeFallback = Boolean(serverTimeResult.error || !serverTimeResult.data);
    if (serverTimeFallback) console.warn('[portfolio] qa_server_now unavailable, temporarily using browser time:', serverTimeResult.error);
    const serverNow = serverTimeFallback ? new Date() : new Date(serverTimeResult.data);
    (tasksResult.data || []).forEach(task => {
      const summary = actualByPlan.get(task.portfolio_plan_id) || { points:0, taskCount:0, tasks:[] };
      const actualPoints = portfolioTaskServerActualPoints(task, activityByTask.get(task.id) || [], calendar, serverNow);
      const assigneeIds = assigneeIdsByTask.get(task.id) || (task.assignee_id ? [task.assignee_id] : []);
      const assigneeNames = assigneeIds.map(id => memberNameById.get(id)).filter(Boolean);
      summary.points += actualPoints;
      summary.taskCount += 1;
      summary.tasks.push({
        id:task.id,
        title:task.title || '未命名事项',
        status:task.status,
        actualPoints,
        assigneeNames
      });
      actualByPlan.set(task.portfolio_plan_id, summary);
    });
    portfolioPlanCache = new Map(plans.map(item => [item.id, item]));
    const capacityPersonMonths = members.reduce((sum, member) => sum + (Number(member.daily_capacity) || 1), 0);
    const monthSummaries = months.map(month => {
      const monthPlans = plans.filter(item => portfolioPlanCoversMonth(item, month));
      const demand = monthPlans.reduce((sum, item) => sum + portfolioPlanMonthlyDemand(item, month), 0);
      const workdays = portfolioMonthWorkdays(month, calendar);
      const utilization = capacityPersonMonths > 0 ? demand / capacityPersonMonths * 100 : 0;
      return { month, monthPlans, demand, workdays, utilization, gap:capacityPersonMonths - demand };
    });
    const selected = monthSummaries[0];
    const selectedActualPoints = selected.monthPlans.reduce((sum, plan) => sum + Number(actualByPlan.get(plan.id)?.points || 0), 0);
    const cards = monthSummaries.map(item => `<article class="portfolio-month-card ${item.gap < -0.001 ? 'over' : ''} ${item.month === portfolioMonthKey() ? 'current' : ''}">
      <div class="portfolio-month-title"><span>${portfolioMonthLabel(item.month)}</span><span>${item.gap < -0.001 ? `超 ${Math.abs(item.gap).toFixed(1)}` : `余 ${item.gap.toFixed(1)}`}</span></div>
      <div class="portfolio-month-numbers"><strong>${item.demand.toFixed(1)}</strong> / ${capacityPersonMonths.toFixed(1)} 人月<br>${item.workdays} 个工作日 · ${item.monthPlans.length} 个项目</div>
      <div class="portfolio-progress"><i style="width:${Math.min(100, item.utilization).toFixed(1)}%"></i></div>
    </article>`).join('');
    const ganttRows = plans.filter(item => item.status !== 'cancelled').map(item => {
      const endMonth = item.end_month || item.plan_month;
      const slots = months.map(month => portfolioPlanCoversMonth(item, month)
        ? `<div class="portfolio-gantt-cell portfolio-gantt-slot"><div class="portfolio-gantt-bar ${item.project_type}">${portfolioPlanMonthlyDemand(item, month).toFixed(1)} 人月</div></div>`
        : '<div class="portfolio-gantt-cell portfolio-gantt-slot"><div class="portfolio-gantt-empty">—</div></div>'
      ).join('');
      const actual = actualByPlan.get(item.id) || { points:0, taskCount:0, tasks:[] };
      const linkedTasks = actual.tasks.map(task => `<div class="portfolio-linked-task"><strong title="${escapeDashboardHtml(task.title)}">${escapeDashboardHtml(task.title)}</strong><span>${escapeDashboardHtml(task.assigneeNames.join('、') || '未指定负责人')} · ${escapeDashboardHtml(taskStatusText(task.status))} · 实际 ${task.actualPoints.toFixed(1)} 点</span></div>`).join('');
      return `<div class="portfolio-gantt-cell portfolio-gantt-project"><button class="risk-action" style="font-size:12px;font-weight:700;padding:0;" onclick="openQaProjectFromPortfolio('${item.id}')" title="打开项目逐日甘特图">${escapeDashboardHtml(item.project_name)} <i class="ti ti-external-link"></i></button><small>${portfolioTypeText(item.project_type)} · 共 ${Number(item.required_person_months).toFixed(1)} 人月<br>${portfolioMonthLabel(item.plan_month)}—${portfolioMonthLabel(endMonth)}<br>实际投入 ${actual.points.toFixed(1)} 点 · ${actual.taskCount} 个事项</small>${actual.taskCount ? `<details class="portfolio-linked-tasks"><summary>查看关联事项（${actual.taskCount}）</summary><div class="portfolio-linked-task-list">${linkedTasks}</div></details>` : '<div class="release-meta" style="margin-top:5px;">暂无关联事项</div>'}${userRole === 'admin' ? `<button class="portfolio-gantt-edit" onclick="openPortfolioPlanEditor('${item.id}')"><i class="ti ti-edit"></i> 编辑月度人力</button>` : ''}</div>${slots}`;
    }).join('');
    const ganttHeader = `<div class="portfolio-gantt-cell portfolio-gantt-header">项目 / 总投入</div>${months.map(month => `<div class="portfolio-gantt-cell portfolio-gantt-header">${portfolioMonthLabel(month)}</div>`).join('')}`;
    const rows = selected.monthPlans.map(item => `<div class="portfolio-demand">
      <div><strong>${escapeDashboardHtml(item.project_name)}</strong><br><span class="release-meta">${portfolioTypeText(item.project_type)}${item.owner_name ? ` · ${escapeDashboardHtml(item.owner_name)}` : ''}<br>${portfolioMonthLabel(item.plan_month)}—${portfolioMonthLabel(item.end_month || item.plan_month)}${item.notes ? `<br>${escapeDashboardHtml(item.notes)}` : ''}</span></div>
      <strong>${portfolioPlanMonthlyDemand(item, selected.month).toFixed(1)}<br><span class="release-meta">总 ${Number(item.required_person_months).toFixed(1)}</span></strong>
      <span>${portfolioStatusText(item.status)}</span>
      <span>${(portfolioPlanMonthlyDemand(item, selected.month) * selected.workdays).toFixed(1)} 点</span>
      <strong>${Number(actualByPlan.get(item.id)?.points || 0).toFixed(1)} 点<br><span class="release-meta">${Number(actualByPlan.get(item.id)?.taskCount || 0)} 个关联事项</span></strong>
      <div>${userRole === 'admin' ? `<button class="btn-secondary" onclick="openPortfolioPlanEditor('${item.id}')">编辑</button> <button class="btn-secondary" onclick="deletePortfolioPlan('${item.id}')">删除</button>` : '-'}</div>
    </div>`).join('');
    const gapTone = selected.gap < -0.001 ? '#d9414b' : '#0F6E56';
    content.innerHTML = `<div class="history-card">
      <div class="card-hd"><div><span class="card-title">🗓️ 项目总排期</span><div class="release-meta">当前展示“${projectUnitText(projectHubUnit)}”项目；按月汇总所需人月并对比 ${members.length} 位资源成员。</div></div>${userRole === 'admin' ? '<button class="btn-primary" onclick="openPortfolioPlanEditor()"><i class="ti ti-plus"></i> 新增项目需求</button>' : ''}</div>
      ${unassignedPlanCount ? `<div class="feature-change-alert project-data-warning"><strong>${unassignedPlanCount} 条排期尚未归属项目</strong><div>未纳入任何 BU，请编辑月度人力完成项目归属。</div></div>` : ''}
      <div style="display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:14px 0;"><button class="btn-secondary" onclick="shiftPortfolioMonth(-1)">上个月</button><input class="dashboard-filter" type="month" value="${firstMonth.slice(0,7)}" onchange="changePortfolioMonth(this.value)"><button class="btn-secondary" onclick="changePortfolioMonth(portfolioMonthKey().slice(0,7))">本月</button><button class="btn-secondary" onclick="shiftPortfolioMonth(1)">下个月</button><span class="release-meta">向后展示 6 个月</span></div>
      <div class="quality-metrics">
        ${qualityMetricHtml('可用人力',`${capacityPersonMonths.toFixed(1)} 人月`,`${members.length} 位资源成员`,null)}
        ${qualityMetricHtml('项目需求',`${selected.demand.toFixed(1)} 人月`,`${selected.monthPlans.length} 个项目`,null)}
        ${qualityMetricHtml('人力余量',`${selected.gap.toFixed(1)} 人月`,selected.gap < 0 ? '当前项目需求超过现有人力' : '当前人力可以覆盖',null,gapTone)}
        ${qualityMetricHtml('利用率',`${selected.utilization.toFixed(0)}%`,`${selected.workdays} 个工作日 · ${(capacityPersonMonths * selected.workdays).toFixed(1)} 可用点`,Math.min(100,selected.utilization),selected.gap < 0 ? '#d9414b' : 'var(--teal)')}
        ${qualityMetricHtml('实际投入',`${selectedActualPoints.toFixed(1)} 点`,'按服务器状态时间自动计算',null,'var(--purple)')}
      </div>
      ${serverTimeFallback ? '<div class="feature-change-alert" style="margin:12px 0;"><strong>服务器时间函数尚未安装</strong><div style="margin-top:4px;">页面已临时使用浏览器时间展示；执行最新项目排期 SQL 后会自动恢复服务器时间计算。</div></div>' : ''}
      ${selected.gap < -0.001 ? `<div class="feature-change-alert" style="margin:12px 0;"><strong>人力超载 ${Math.abs(selected.gap).toFixed(1)} 人月</strong><div style="margin-top:4px;">建议调整项目月份、减少范围，或补充临时资源。</div></div>` : ''}
      <div class="portfolio-month-grid">${cards}</div>
      <div class="portfolio-gantt">
        <div class="portfolio-gantt-grid">${ganttHeader}${ganttRows || `<div class="portfolio-gantt-cell portfolio-gantt-project">暂无项目</div>${months.map(() => '<div class="portfolio-gantt-cell portfolio-gantt-slot"><div class="portfolio-gantt-empty">—</div></div>').join('')}`}</div>
      </div>
    </div>
    <div class="history-card" style="margin-top:14px;">
      <div class="card-hd"><div><span class="card-title">${portfolioMonthLabel(selected.month)} 项目明细</span><div class="release-meta">本月分摊人月 × 当月工作日 = 预计投入点数</div></div><span class="card-tag">${selected.demand.toFixed(1)} / ${capacityPersonMonths.toFixed(1)} 人月</span></div>
      <div class="portfolio-demand portfolio-demand-head"><span>项目 / 排期</span><span>本月人月</span><span>状态</span><span>预计点数</span><span>实际投入</span><span>操作</span></div>
      ${rows || '<div class="dashboard-empty">该月份暂无项目需求</div>'}
    </div>${portfolioPlanModalHtml()}`;
  } catch (error) {
    console.error('[portfolio] load failed:', error);
    content.innerHTML = `<div class="history-card"><div class="dashboard-empty">项目总排期加载失败：${escapeDashboardHtml(error.message)}<br><span class="release-meta">请先执行项目总排期数据库迁移</span></div></div>`;
  }
}

function releasePlatformText(platform) {
  return ({ android:'APP', ios:'APP', both:'APP', app:'APP', pad:'Pad', pc:'PC', mobile_all:'APP + Pad', app_pad:'APP + Pad' })[platform] || platform;
}

function releasePlatformMatches(releasePlatform, selectedPlatform) {
  if (selectedPlatform === 'all') return true;
  if (releasePlatform === selectedPlatform) return true;
  if (selectedPlatform === 'app') return ['android','ios','both','app','mobile_all','app_pad'].includes(releasePlatform);
  if (selectedPlatform === 'pad') return ['pad','mobile_all','app_pad'].includes(releasePlatform);
  if (selectedPlatform === 'pc') return releasePlatform === 'pc';
  return false;
}

function releaseModalHtml() {
  return `<div class="dashboard-modal" id="releaseEditorModal"><div class="dashboard-modal-panel" style="width:min(620px,100%);"><div class="dashboard-modal-hd"><div class="dashboard-modal-title" id="releaseEditorTitle">新建版本</div><button class="dashboard-modal-close" onclick="closeReleaseEditor()"><i class="ti ti-x"></i></button></div><div class="dashboard-form-grid"><div class="form-group"><label class="form-label">所属项目 *</label><select class="form-select" id="releaseProject" required><option value="">请选择所属项目</option></select></div><div class="form-group"><label class="form-label">版本号</label><input class="dashboard-input" id="releaseVersion" maxlength="80" placeholder="例如 2.5.705"></div><div class="form-group"><label class="form-label">版本名称</label><input class="dashboard-input" id="releaseName" maxlength="160" placeholder="例如 证件照功能重构"></div><div class="form-group"><label class="form-label">产品端</label><select class="form-select" id="releasePlatform"><option value="app">APP</option><option value="pad">Pad</option><option value="pc">PC</option><option value="app_pad">APP + Pad</option></select><div class="assignee-allocation-note">APP、Pad、PC 可分别设置一个当前版本。</div></div><div class="form-group"><label class="form-label">计划发布日期</label><input class="dashboard-input" id="releaseDate" type="date"></div></div><div class="form-group" style="margin-top:12px;"><label class="form-label">备注</label><textarea class="dashboard-input" id="releaseNotes" rows="3" maxlength="1000" placeholder="填写版本范围、主要改动或发布说明"></textarea></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px;"><button class="btn-secondary" onclick="closeReleaseEditor()">取消</button><button class="btn-primary" id="saveReleaseBtn" onclick="saveRelease()">保存版本</button></div></div></div>`;
}

async function openReleaseEditor(id = '') {
  const release = id ? releaseRecordCache.get(id) : null;
  document.getElementById('releaseEditorTitle').textContent = release ? '编辑版本' : '新建版本';
  document.getElementById('releaseVersion').value = release?.version || '';
  document.getElementById('releaseName').value = release?.name || '';
  const editablePlatform = ['android','ios','both'].includes(release?.platform) ? 'app' : (release?.platform === 'mobile_all' ? 'app_pad' : release?.platform);
  document.getElementById('releasePlatform').value = editablePlatform || 'app';
  document.getElementById('releaseDate').value = release?.planned_release_date || '';
  document.getElementById('releaseNotes').value = release?.notes || '';
  document.getElementById('releaseEditorModal').dataset.releaseId = id;
  document.getElementById('releaseEditorModal').classList.add('open');
  const projectSelect = document.getElementById('releaseProject');
  const { data: projects, error } = await sb.from('qa_projects').select('id,name,business_unit,status').order('name');
  if (error) {
    projectSelect.innerHTML = '<option value="">项目加载失败</option>';
  } else {
    const visible = (projects || []).filter(project => project.status !== 'archived' || project.id === release?.project_id);
    const groups = [
      ['xiaomi', '小米'],
      ['consumer', '消费'],
      ['other', 'Other'],
    ].map(([unit, label]) => {
      const options = visible
        .filter(project => project.business_unit === unit)
        .map(project => `<option value="${project.id}" data-business-unit="${unit}">${escapeDashboardHtml(project.name)}${project.status === 'archived' ? '（已归档）' : ''}</option>`)
        .join('');
      return options ? `<optgroup label="${label}">${options}</optgroup>` : '';
    }).join('');
    projectSelect.innerHTML = `<option value="">请选择所属项目</option>${groups}`;
    projectSelect.value = release?.project_id || '';
  }
  setTimeout(() => document.getElementById('releaseVersion')?.focus(), 0);
}

function closeReleaseEditor() {
  document.getElementById('releaseEditorModal')?.classList.remove('open');
}

async function saveRelease() {
  const modal = document.getElementById('releaseEditorModal');
  const id = modal?.dataset.releaseId || '';
  const version = document.getElementById('releaseVersion')?.value.trim();
  const name = document.getElementById('releaseName')?.value.trim() || null;
  const platform = document.getElementById('releasePlatform')?.value || 'app';
  const plannedReleaseDate = document.getElementById('releaseDate')?.value || null;
  const notes = document.getElementById('releaseNotes')?.value.trim() || null;
  const projectId = document.getElementById('releaseProject')?.value || '';
  const projectBusinessUnit = document.getElementById('releaseProject')?.selectedOptions?.[0]?.dataset.businessUnit || '';
  if (!version) { showToast('请填写版本号', 'error'); return; }
  if (!projectId) { showToast('请选择所属项目', 'error'); return; }
  const button = document.getElementById('saveReleaseBtn');
  button.disabled = true;
  try {
    const payload = { version, name, platform, planned_release_date:plannedReleaseDate, notes, project_id:projectId, owner_id:currentUser.id };
    const result = id
      ? await sb.from('releases').update(payload).eq('id', id).select('id').maybeSingle()
      : await sb.from('releases').insert({ ...payload, created_by:currentUser.id }).select('id').single();
    if (result.error) throw result.error;
    if (['xiaomi','consumer','other'].includes(projectBusinessUnit)) {
      projectHubUnit = projectBusinessUnit;
      try { localStorage.setItem('hanntoQaProjectBusinessUnit', projectBusinessUnit); } catch {}
      updateProjectBusinessTabs('releases');
    }
    closeReleaseEditor();
    showToast(id ? '版本已更新' : '版本已创建');
    await renderReleaseManagement();
  } catch (error) {
    console.error('[release] save failed:', error);
    showToast('保存版本失败：' + error.message, 'error');
  } finally {
    button.disabled = false;
  }
}

async function transitionRelease(id, status) {
  const release = releaseRecordCache.get(id);
  if (!release || userRole !== 'admin') return;
  if (status === 'released') {
    const tasks = releaseTaskCache.get(id) || [];
    const checks = releaseCheckCache.get(id) || [];
    const blockingTask = tasks.some(task => ['todo','in_progress','blocked'].includes(task.status));
    const blockingCheck = checks.some(check => ['pending','failed','unavailable'].includes(check.status) && check.severity === 'high');
    if (blockingTask || blockingCheck) { showToast('仍有未完成事项或高风险检查项，暂不能标记已发布', 'error'); return; }
  }
  try {
    const { error } = await sb.rpc('transition_release_status', { target_release_id:id, target_status:status });
    if (error) throw error;
    showToast(`版本已更新为${releaseStatusText(status)}`);
    await renderReleaseManagement();
  } catch (error) {
    console.error('[release] transition failed:', error);
    showToast('版本状态更新失败：' + error.message, 'error');
  }
}

async function addReleaseCheck(releaseId) {
  const name = document.getElementById(`releaseCheckName-${releaseId}`)?.value.trim();
  const severity = document.getElementById(`releaseCheckSeverity-${releaseId}`)?.value || 'medium';
  if (!name) { showToast('请填写检查项名称', 'error'); return; }
  try {
    const { error } = await sb.from('release_checks').insert({ release_id:releaseId, check_key:`manual_${Date.now()}`, check_name:name, category:'manual', severity, status:'pending', source_type:'manual' });
    if (error) throw error;
    showToast('发布检查项已添加');
    await renderReleaseManagement();
  } catch (error) {
    console.error('[release] check create failed:', error);
    showToast('添加检查项失败：' + error.message, 'error');
  }
}

async function updateReleaseCheck(id, status) {
  try {
    const { error } = await sb.from('release_checks').update({ status, last_evaluated_at:new Date().toISOString() }).eq('id', id);
    if (error) throw error;
    await renderReleaseManagement();
  } catch (error) {
    showToast('更新检查项失败：' + error.message, 'error');
  }
}

let releaseRecordCache = new Map();
let releaseTaskCache = new Map();
let releaseCheckCache = new Map();

async function renderReleaseManagement() {
  const content = document.getElementById('content');
  content.style.padding = '24px';
  content.innerHTML = '<div class="history-card"><div class="dashboard-loading">正在加载版本发布信息…</div></div>';
  try {
    const [releaseResult, taskResult, checkResult, projectsResult] = await Promise.all([
      sb.from('releases').select('id,version,name,platform,products,status,project_id,owner_id,planned_release_date,notes,created_by,created_at,updated_at').order('created_at', { ascending:false }),
      sb.from('qa_tasks').select('id,release_id,title,status,due_date,blocked_reason').not('release_id', 'is', null),
      sb.from('release_checks').select('id,release_id,check_name,category,severity,status,source_type,last_evaluated_at').order('created_at', { ascending:true }),
      sb.from('qa_projects').select('id,name,business_unit,status')
    ]);
    if (releaseResult.error) throw releaseResult.error;
    if (taskResult.error) throw taskResult.error;
    if (checkResult.error) throw checkResult.error;
    if (projectsResult.error) throw projectsResult.error;
    const projects = projectsResult.data || [];
    const projectMap = new Map(projects.map(project => [project.id, project]));
    const releases = (releaseResult.data || []).filter(release => {
      const project = projectMap.get(release.project_id);
      return projectHubUnit === 'unassigned'
        ? !release.project_id
        : project?.status !== 'archived' && project?.business_unit === projectHubUnit;
    });
    const unassignedReleaseCount = canManageQa()
      ? (releaseResult.data || []).filter(release => !release.project_id && release.status !== 'archived').length
      : 0;
    releaseRecordCache = new Map(releases.map(release => [release.id, release]));
    releaseTaskCache = new Map();
    (taskResult.data || []).forEach(task => { const items = releaseTaskCache.get(task.release_id) || []; items.push(task); releaseTaskCache.set(task.release_id, items); });
    releaseCheckCache = new Map();
    (checkResult.data || []).forEach(check => { const items = releaseCheckCache.get(check.release_id) || []; items.push(check); releaseCheckCache.set(check.release_id, items); });
    const cards = releases.map(release => {
      const tasks = releaseTaskCache.get(release.id) || [];
      const checks = releaseCheckCache.get(release.id) || [];
      const done = tasks.filter(task => task.status === 'done').length;
      const blocked = tasks.filter(task => task.status === 'blocked').length;
      const failed = checks.filter(check => ['failed','unavailable'].includes(check.status)).length;
      const passed = checks.filter(check => ['passed','waived'].includes(check.status)).length;
      const ready = tasks.length > 0 && done === tasks.length && checks.length > 0 && failed === 0 && passed === checks.length;
      const danger = blocked > 0 || checks.some(check => check.severity === 'high' && ['failed','unavailable'].includes(check.status));
      const readinessClass = ready ? 'release-ready' : danger ? 'release-danger' : 'release-warning';
      const readinessText = release.status === 'released' ? '已发布' : ready ? '可发布' : danger ? '存在阻塞' : '准备中';
      const taskList = tasks.length ? tasks.map(task => `<div class="release-check-row"><span>${escapeDashboardHtml(task.title)}</span><span>${escapeDashboardHtml(taskStatusText(task.status))}</span><span>${task.due_date ? escapeDashboardHtml(task.due_date.slice(0,10)) : '-'}</span><button class="risk-action" onclick="openTaskFromDashboard('${task.id}','edit')">查看</button></div>`).join('') : '<div class="dashboard-empty">暂无关联工作事项</div>';
      const checkList = checks.length ? checks.map(check => `<div class="release-check-row"><span>${escapeDashboardHtml(check.check_name)}</span><span>${check.severity === 'high' ? '高' : check.severity === 'medium' ? '中' : '低'}风险</span><select class="dashboard-filter" style="min-width:88px;padding:5px;" onchange="updateReleaseCheck('${check.id}',this.value)" ${userRole === 'admin' ? '' : 'disabled'}><option value="pending" ${check.status === 'pending' ? 'selected' : ''}>待检查</option><option value="passed" ${check.status === 'passed' ? 'selected' : ''}>通过</option><option value="failed" ${check.status === 'failed' ? 'selected' : ''}>失败</option><option value="waived" ${check.status === 'waived' ? 'selected' : ''}>豁免</option><option value="unavailable" ${check.status === 'unavailable' ? 'selected' : ''}>不可用</option></select><span>${check.source_type === 'manual' ? '手工' : escapeDashboardHtml(check.source_type)}</span></div>`).join('') : '<div class="dashboard-empty">尚未添加发布检查项</div>';
      return `<div class="release-card ${release.status === 'active' ? 'active' : ''}"><div class="release-card-hd"><div><h3>${escapeDashboardHtml(release.name || release.version)}</h3><div class="release-meta">${escapeDashboardHtml(projectMap.get(release.project_id)?.name || '未归属项目')} · ${escapeDashboardHtml(release.version)} · ${releasePlatformText(release.platform)} · ${releaseStatusText(release.status)}${release.planned_release_date ? ` · ${release.planned_release_date}` : ''}</div></div><span class="release-readiness ${readinessClass}">${readinessText}</span></div><div class="release-stats"><div class="release-stat"><strong>${tasks.length}</strong><span>关联事项</span></div><div class="release-stat"><strong>${done}</strong><span>已完成</span></div><div class="release-stat"><strong>${blocked}</strong><span>已阻塞</span></div><div class="release-stat"><strong>${failed}</strong><span>检查失败</span></div></div>${release.notes ? `<div class="release-meta">${escapeDashboardHtml(release.notes)}</div>` : ''}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;">${userRole === 'admin' ? `<button class="btn-secondary" onclick="openReleaseEditor('${release.id}')">编辑</button>${release.status === 'planned' ? `<button class="btn-primary" onclick="transitionRelease('${release.id}','active')">设为当前版本</button>` : ''}${release.status === 'active' ? `<button class="btn-primary" onclick="transitionRelease('${release.id}','released')">标记已发布</button>` : ''}${!['released','archived'].includes(release.status) ? `<button class="btn-secondary" onclick="transitionRelease('${release.id}','archived')">归档</button>` : ''}` : ''}</div><details class="member-daily-details"><summary>关联事项（${tasks.length}）</summary>${taskList}</details><details class="member-daily-details"><summary>发布检查（${checks.length}）</summary>${checkList}${userRole === 'admin' ? `<div class="release-check-form"><input class="dashboard-input" id="releaseCheckName-${release.id}" placeholder="新增检查项，例如：P0 用例全部通过"><select class="dashboard-filter" id="releaseCheckSeverity-${release.id}"><option value="high">高风险</option><option value="medium" selected>中风险</option><option value="low">低风险</option></select><button class="btn-secondary" onclick="addReleaseCheck('${release.id}')">添加</button></div>` : ''}</details></div>`;
    }).join('');
    content.innerHTML = `<div class="history-card"><div class="card-hd"><div><span class="card-title">🚀 版本发布管理</span><div class="release-meta">当前仅展示“${projectUnitText(projectHubUnit)}”项目的版本、事项与发布检查</div></div>${userRole === 'admin' ? '<button class="btn-primary" onclick="openReleaseEditor()"><i class="ti ti-plus"></i> 新建版本</button>' : ''}</div>${unassignedReleaseCount ? `<div class="feature-change-alert project-data-warning"><strong>${unassignedReleaseCount} 个活动版本尚未归属项目</strong><div>未纳入任何 BU，请编辑版本完成项目归属。</div></div>` : ''}<div class="release-grid">${cards || '<div class="dashboard-empty">当前 BU 暂无版本</div>'}</div></div>${releaseModalHtml()}`;
  } catch (error) {
    console.error('[release] load failed:', error);
    content.innerHTML = `<div class="history-card"><div class="dashboard-empty">版本发布数据加载失败：${escapeDashboardHtml(error.message)}</div></div>`;
  }
}

function refreshDefectRequirementOptions(selectedId = '') {
  const prdId = document.getElementById('defectPrd')?.value || '';
  const prd = defectPrdCache.find(item => item.id === prdId);
  const releaseSelect = document.getElementById('defectRelease');
  if (prd?.release_id && releaseSelect && !releaseSelect.value) releaseSelect.value = prd.release_id;
  const requirements = defectRequirementCache.filter(item => !prdId || item.prd_id === prdId);
  const select = document.getElementById('defectRequirement');
  if (!select) return;
  select.innerHTML = `<option value="">不关联验收范围</option>${requirements.map(item => `<option value="${item.id}">${escapeDashboardHtml(item.title)}</option>`).join('')}`;
  select.value = requirements.some(item => item.id === selectedId) ? selectedId : '';
}

function refreshDefectTaskOptions(selectedId = '') {
  const prdId = document.getElementById('defectPrd')?.value || '';
  const tasks = defectTaskCache.filter(item => !prdId || item.prd_id === prdId);
  const select = document.getElementById('defectTask');
  if (!select) return;
  select.innerHTML = `<option value="">不关联测试轮次</option>${tasks.map(item => `<option value="${item.id}">第 ${Number(item.test_round || 1)} 轮 · ${escapeDashboardHtml(item.title)}</option>`).join('')}`;
  select.value = tasks.some(item => item.id === selectedId) ? selectedId : '';
}

  document.getElementById('defectExecutor').value = defect?.executor_id || currentUser.id;

  document.getElementById('saveDefectBtn').textContent = !defect ? '创建并交给负责人' : canEditReview ? '保存复盘' : '保存基本信息';

  document.getElementById('defectEditorModal').classList.add('open');

function closeDefectEditor() { document.getElementById('defectEditorModal')?.classList.remove('open'); }

async function saveQualityDefect() {
  const id = document.getElementById('defectEditorModal')?.dataset.defectId || '';
  const existing = id ? defectRecordCache.get(id) : null;
  const title = document.getElementById('defectTitle')?.value.trim();
  const reviewStatus = document.getElementById('defectReviewStatus')?.value || 'pending';
  const rootCause = document.getElementById('defectRootCause')?.value || null;
  const escapeReason = document.getElementById('defectEscapeReason')?.value.trim() || '';
  const preventionAction = document.getElementById('defectPreventionAction')?.value.trim() || '';
  const externalUrlRaw = document.getElementById('defectExternalUrl')?.value.trim() || '';
  const reopenCount = Number(document.getElementById('defectReopenCount')?.value || 0);
  if (!title) { showToast('请填写 BUG 标题', 'error'); return; }
  if (reviewStatus === 'completed' && (!rootCause || !escapeReason || !preventionAction)) { showToast('完成复盘前必须填写根因、漏出原因和预防措施', 'error'); return; }
  if (externalUrlRaw && !safeDefectExternalUrl(externalUrlRaw)) { showToast('PingCode 链接格式不正确', 'error'); return; }
  if (!Number.isInteger(reopenCount) || reopenCount < 0) { showToast('重开次数必须是大于等于 0 的整数', 'error'); return; }
  const status = document.getElementById('defectStatus')?.value || 'open';
  const payload = {
    title,
    pingcode_id:document.getElementById('defectPingCodeId')?.value.trim() || null,
    external_url:externalUrlRaw || null,
    source:document.getElementById('defectPingCodeId')?.value.trim() ? 'pingcode' : (existing?.source || 'manual'),
    release_id:document.getElementById('defectRelease')?.value || null,
    prd_id:document.getElementById('defectPrd')?.value || null,
    qa_task_id:document.getElementById('defectTask')?.value || null,
    requirement_id:document.getElementById('defectRequirement')?.value || null,
    exposed_stage:document.getElementById('defectStage')?.value || 'integration',
    severity:document.getElementById('defectSeverity')?.value || 'P1',
    status,
    executor_id:document.getElementById('defectExecutor')?.value || currentUser.id,
    found_at:document.getElementById('defectFoundAt')?.value || dashboardTodayInputValue(),
    closed_at:status === 'closed' ? (existing?.closed_at || dashboardTodayInputValue()) : null,
    root_cause_category:rootCause,
    reopen_count:reopenCount,
    is_change_induced:document.getElementById('defectChangeInduced')?.value === 'true',
    is_missed_test:document.getElementById('defectMissedTest')?.value === 'true',
    impact:document.getElementById('defectImpact')?.value.trim() || '',
    escape_reason:escapeReason,
    corrective_action:document.getElementById('defectCorrectiveAction')?.value.trim() || '',
    prevention_action:preventionAction,
    review_status:reviewStatus
  };
  const button = document.getElementById('saveDefectBtn'); button.disabled = true;
  try {
    const result = id ? await sb.from('quality_defects').update(payload).eq('id',id).select('id').maybeSingle() : await sb.from('quality_defects').insert({ ...payload, created_by:currentUser.id }).select('id').single();
    if (result.error) throw result.error;
    closeDefectEditor(); showToast(id ? 'BUG 信息已更新' : 'BUG 已登记，等待负责人填写复盘'); await renderBugManagement();
  } catch (error) { console.error('[defect] save failed:',error); showToast('保存失败：'+error.message,'error'); }
  finally { button.disabled = false; }
}

function filterDefectRows() {

  const review=document.getElementById('defectReviewFilter')?.value||'all';

}

function qualityPercent(value, total) {
  return total > 0 ? Math.round(value / total * 100) : 0;
}

function qualityMetricHtml(label, value, note, percent = null, tone = 'var(--teal)') {
  return `<div class="quality-metric"><span>${escapeDashboardHtml(label)}</span><strong>${escapeDashboardHtml(String(value))}</strong><small>${escapeDashboardHtml(note || '')}</small>${percent === null ? '' : `<div class="quality-progress"><i style="width:${Math.max(0,Math.min(100,percent))}%;background:${tone};"></i></div>`}</div>`;
}

function qualityTaskMatches(task) {
  const releaseId = document.getElementById('qualityReleaseFilter')?.value || 'all';
  const platform = document.getElementById('qualityPlatformFilter')?.value || 'all';
  const memberId = document.getElementById('qualityMemberFilter')?.value || 'all';
  const from = document.getElementById('qualityFromFilter')?.value || '';
  const to = document.getElementById('qualityToFilter')?.value || '';
  const release = qualityReportRaw.releaseMap.get(task.release_id);
  const assignments = qualityReportRaw.assigneeMap.get(task.id) || [];
  const taskStart = task.allocation_start_date || task.created_at?.slice(0,10) || '';
  const taskEnd = task.allocation_end_date || task.due_date?.slice(0,10) || taskStart;
  return (releaseId === 'all' || task.release_id === releaseId)
    && releasePlatformMatches(release?.platform, platform)
    && (memberId === 'all' || assignments.some(item => item.member_id === memberId))
    && (!from || !taskEnd || taskEnd >= from)
    && (!to || !taskStart || taskStart <= to);
}

function qualityDefectMatches(defect) {
  const releaseId = document.getElementById('qualityReleaseFilter')?.value || 'all';
  const platform = document.getElementById('qualityPlatformFilter')?.value || 'all';
  const memberId = document.getElementById('qualityMemberFilter')?.value || 'all';
  const from = document.getElementById('qualityFromFilter')?.value || '';
  const to = document.getElementById('qualityToFilter')?.value || '';
  const release = qualityReportRaw.releaseMap.get(defect.release_id);
  return (releaseId === 'all' || defect.release_id === releaseId)
    && releasePlatformMatches(release?.platform, platform)
    && (memberId === 'all' || defect.executor_id === memberId)
    && (!from || defect.found_at >= from)
    && (!to || defect.found_at <= to);
}

function renderQualityReportResults() {
  if (!qualityReportRaw) return;
  const tasks = qualityReportRaw.tasks.filter(qualityTaskMatches);
  qualityReportFilteredTasks = tasks;
  const nowKey = dashboardTodayInputValue();
  const done = tasks.filter(task => task.status === 'done').length;
  const blocked = tasks.filter(task => task.status === 'blocked').length;
  const overdue = tasks.filter(task => ['todo','in_progress','blocked'].includes(task.status) && task.due_date && task.due_date.slice(0,10) < nowKey).length;
  const effort = tasks.reduce((sum, task) => sum + Number(task.effort_person_days || 0), 0);
  const actual = tasks.reduce((sum, task) => {
    const snapshot = qualityReportRaw.snapshotMap.get(task.id);
    return sum + taskActualProgressPoints(task, qualityReportRaw.progressMap.get(task.id) || [], snapshot).totalActual;
  }, 0);
  const snapshots = tasks.map(task => qualityReportRaw.snapshotMap.get(task.id)).filter(Boolean);
  const totalCases = snapshots.reduce((sum, item) => sum + Number(item.total_cases || 0), 0);
  const executedCases = snapshots.reduce((sum, item) => sum + Number(item.executed_cases || 0), 0);
  const releaseIds = new Set(tasks.map(task => task.release_id).filter(Boolean));
  const checks = qualityReportRaw.checks.filter(check => releaseIds.has(check.release_id));
  const passedChecks = checks.filter(check => ['passed','waived'].includes(check.status)).length;
  const taskRate = qualityPercent(done, tasks.length);
  const caseRate = qualityPercent(executedCases, totalCases);
  const checkRate = qualityPercent(passedChecks, checks.length);
  const defects = qualityReportRaw.defects.filter(qualityDefectMatches);
  const productionDefects = defects.filter(defect => defect.exposed_stage === 'production').length;
  const integrationDefects = defects.filter(defect => defect.exposed_stage === 'integration').length;
  const reviewedDefects = defects.filter(defect => defect.review_status === 'completed').length;
  const reviewRate = qualityPercent(reviewedDefects, defects.length);
  const metrics = document.getElementById('qualityMetrics');
  metrics.innerHTML = [
    qualityMetricHtml('事项完成率', `${taskRate}%`, `${done}/${tasks.length} 项`, taskRate),
    qualityMetricHtml('TestHub 执行率', `${caseRate}%`, `${executedCases}/${totalCases} 条`, caseRate, 'var(--purple)'),
    qualityMetricHtml('计划/实际人天', `${actual.toFixed(1)}/${effort.toFixed(1)}`, '实际累计 / 计划', qualityPercent(actual, effort), 'var(--pink)'),
    qualityMetricHtml('延期事项', overdue, tasks.length ? `占 ${qualityPercent(overdue,tasks.length)}%` : '暂无事项', null),
    qualityMetricHtml('阻塞事项', blocked, blocked ? '需要优先处理' : '当前无阻塞', null),
    qualityMetricHtml('发布检查通过率', `${checkRate}%`, `${passedChecks}/${checks.length} 项`, checkRate, 'var(--yellow)'),
    qualityMetricHtml('集成暴露 BUG', integrationDefects, '集成阶段发现', null),
    qualityMetricHtml('已上线暴露 BUG', productionDefects, '需要重点复盘', null),
    qualityMetricHtml('BUG 复盘完成率', `${reviewRate}%`, `${reviewedDefects}/${defects.length} 项`, reviewRate, 'var(--purple)')
  ].join('');

  const names = qualityReportRaw.memberMap;
  const memberStats = new Map();
  tasks.forEach(task => {
    const snapshot = qualityReportRaw.snapshotMap.get(task.id);
    const taskActual = taskActualProgressPoints(task, qualityReportRaw.progressMap.get(task.id) || [], snapshot).totalActual;
    const assignments = qualityReportRaw.assigneeMap.get(task.id) || [];
    const totalAllocated = assignments.reduce((sum,item) => sum + Number(item.allocated_effort || 0), 0) || Number(task.effort_person_days || 0) || 1;
    assignments.forEach(item => {
      const stat = memberStats.get(item.member_id) || { tasks:0, done:0, blocked:0, plan:0, actual:0 };
      const allocated = Number(item.allocated_effort || 0);
      stat.tasks += 1;
      stat.done += task.status === 'done' ? 1 : 0;
      stat.blocked += task.status === 'blocked' ? 1 : 0;
      stat.plan += allocated;
      stat.actual += taskActual * allocated / totalAllocated;
      memberStats.set(item.member_id, stat);
    });
  });
  const memberRows = [...memberStats.entries()].sort((a,b) => (names.get(a[0]) || '').localeCompare(names.get(b[0]) || '', 'zh-CN')).map(([id,stat]) => `<div class="quality-member-row"><strong>${escapeDashboardHtml(names.get(id) || '未命名成员')}</strong><span>${stat.tasks} 项</span><span>${stat.done} 完成</span><span>${stat.plan.toFixed(1)} 计划</span><span>${stat.actual.toFixed(1)} 实际</span></div>`).join('');
  document.getElementById('qualityMemberStats').innerHTML = memberRows || '<div class="dashboard-empty">当前筛选条件下暂无成员数据</div>';
  renderQualityWeeklyBrief(tasks);

  const taskRows = tasks.map(task => {
    const assignments = qualityReportRaw.assigneeMap.get(task.id) || [];
    const snapshot = qualityReportRaw.snapshotMap.get(task.id);
    const taskActual = taskActualProgressPoints(task, qualityReportRaw.progressMap.get(task.id) || [], snapshot).totalActual;

function renderQualityWeeklyBrief(tasks) {
  const wrap = document.getElementById('qualityWeeklyBrief');
  if (!wrap || !qualityReportRaw) return;
  const names = qualityReportRaw.memberMap;
  const from = document.getElementById('qualityFromFilter')?.value || '';
  const to = document.getElementById('qualityToFilter')?.value || '';
  const today = dashboardTodayInputValue();
  const memberBriefs = new Map();
  tasks.forEach(task => {
    const assignments = qualityReportRaw.assigneeMap.get(task.id) || [];
    const end = task.allocation_end_date || task.due_date?.slice(0, 10) || '';
    const completedDate = task.completed_at?.slice(0, 10) || task.updated_at?.slice(0, 10) || '';
    const completedInRange = task.status === 'done'
      && (!from || !completedDate || completedDate >= from)
      && (!to || !completedDate || completedDate <= to);
    const delayed = Boolean(end) && (
      (task.status === 'done' && completedDate && completedDate > end)
      || (!['done','cancelled'].includes(task.status) && end < today)
    );
    assignments.forEach(item => {
      const brief = memberBriefs.get(item.member_id) || { completed:[], delayed:[], active:[] };
      if (completedInRange) brief.completed.push(task);
      if (delayed) brief.delayed.push(task);
      if (!['done','cancelled'].includes(task.status)) brief.active.push(task);
      memberBriefs.set(item.member_id, brief);
    });
  });
  const selectedMember = document.getElementById('qualityMemberFilter')?.value || 'all';
  const entries = [...memberBriefs.entries()]
    .filter(([id]) => selectedMember === 'all' || id === selectedMember)
    .sort((a,b) => (names.get(a[0]) || '').localeCompare(names.get(b[0]) || '', 'zh-CN'));
  wrap.innerHTML = entries.length ? entries.map(([id, brief]) => {
    const completionLines = brief.completed.length
      ? brief.completed.map(task => `<li><strong>${escapeDashboardHtml(task.title)}</strong>：${escapeDashboardHtml(task.completion_note || '已完成，但未填写完成说明')}</li>`).join('')
      : '<li>本周期暂无完成事项</li>';
    const delayLines = brief.delayed.length
      ? brief.delayed.map(task => `<li>${escapeDashboardHtml(task.title)} · 截止 ${escapeDashboardHtml(task.allocation_end_date || task.due_date?.slice(0,10) || '-')} · ${escapeDashboardHtml(taskStatusText(task.status))}</li>`).join('')
      : '<li>无延期事项</li>';
    return `<div style="border:1px solid #eee4dc;border-radius:14px;padding:13px;background:#fffdfb;"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;"><strong>${escapeDashboardHtml(names.get(id) || '未命名成员')}</strong><div style="display:flex;gap:6px;align-items:center;"><span class="card-tag" style="background:${brief.delayed.length ? '#FFE5E5;color:#A62929' : '#CCF5EE;color:#0F6E56'};">完成 ${brief.completed.length} · 延期 ${brief.delayed.length} · 进行 ${brief.active.length}</span><button class="btn-secondary" type="button" onclick="copyMemberWeeklyBrief('${id}')">复制个人周报</button></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;font-size:11px;"><div><b>本周完成与填报总结</b><ul style="margin:7px 0 0;padding-left:18px;line-height:1.8;">${completionLines}</ul></div><div><b>延期 / 待推进</b><ul style="margin:7px 0 0;padding-left:18px;line-height:1.8;">${delayLines}</ul></div></div></div>`;
  }).join('') : '<div class="dashboard-empty">当前周期暂无成员周简报</div>';
}

async function copyMemberWeeklyBrief(memberId) {
  if (!qualityReportRaw) return;
  const name = qualityReportRaw.memberMap.get(memberId) || '未命名成员';
  const tasks = qualityReportFilteredTasks.filter(task => (qualityReportRaw.assigneeMap.get(task.id) || []).some(item => item.member_id === memberId));
  const today = dashboardTodayInputValue();
  const from = document.getElementById('qualityFromFilter')?.value || '';
  const to = document.getElementById('qualityToFilter')?.value || '';
  const completed = tasks.filter(task => {
    const completedDate = task.completed_at?.slice(0,10) || task.updated_at?.slice(0,10) || '';
    return task.status === 'done' && (!from || !completedDate || completedDate >= from) && (!to || !completedDate || completedDate <= to);
  });
  const delayed = tasks.filter(task => {
    const end = task.allocation_end_date || task.due_date?.slice(0,10) || '';
    const completedDate = task.completed_at?.slice(0,10) || task.updated_at?.slice(0,10) || '';
    return end && ((task.status === 'done' && completedDate && completedDate > end) || (!['done','cancelled'].includes(task.status) && end < today));
  });
  const active = tasks.filter(task => !['done','cancelled'].includes(task.status));
  const text = [
    `${name} QA 周报（${from || '-'} 至 ${to || '-'}）`,
    `完成 ${completed.length} 项 · 进行中 ${active.length} 项 · 延期 ${delayed.length} 项`,
    '', '本周完成：',
    ...(completed.length ? completed.map(task => `- ${task.title}：${task.completion_note || '已完成，未填写完成说明'}`) : ['- 无']),
    '', '延期 / 待推进：',
    ...(delayed.length ? delayed.map(task => `- ${task.title}（截止 ${task.allocation_end_date || task.due_date?.slice(0,10) || '-'}，${taskStatusText(task.status)}）`) : ['- 无']),
    '', '下周继续：',
    ...(active.length ? active.map(task => `- ${task.title}（${taskStatusText(task.status)}）`) : ['- 无'])
  ].join('\n');
  try { await navigator.clipboard.writeText(text); showToast(`已复制 ${name} 的个人周报`); }
  catch { showToast('复制失败，请检查浏览器剪贴板权限', 'error'); }
}

function currentQualityWeekRange() {

function qualityReportSummaryText() {
  const tasks = qualityReportFilteredTasks;
  const done = tasks.filter(task => task.status === 'done').length;

  const overdue = tasks.filter(task => ['todo','in_progress','blocked'].includes(task.status) && task.due_date && task.due_date.slice(0,10) < dashboardTodayInputValue()).length;
  const snapshots = tasks.map(task => qualityReportRaw.snapshotMap.get(task.id)).filter(Boolean);
  const total = snapshots.reduce((sum,item) => sum + Number(item.total_cases || 0), 0);
  const executed = snapshots.reduce((sum,item) => sum + Number(item.executed_cases || 0), 0);
  const defects = qualityReportRaw.defects.filter(qualityDefectMatches);
  const production = defects.filter(item => item.exposed_stage === 'production').length;

}

function renderRetrospectiveReport(defects) {
  const rootWrap = document.getElementById('qualityRootCauseStats');
  const ownerWrap = document.getElementById('qualityDefectOwnerStats');
  const actionWrap = document.getElementById('qualityRetrospectiveActions');
  if (!rootWrap || !ownerWrap || !actionWrap) return;
  const rootCounts = new Map();
  defects.forEach(defect => { const key=defect.root_cause_category || 'pending'; rootCounts.set(key,(rootCounts.get(key)||0)+1); });
  const maxRoot = Math.max(1,...rootCounts.values());
  rootWrap.innerHTML = [...rootCounts.entries()].sort((a,b)=>b[1]-a[1]).map(([key,count]) => `<div class="retro-bar-row"><span>${escapeDashboardHtml(key === 'pending' ? '待分析' : defectRootCauseText(key))}</span><div class="retro-bar"><i style="width:${count/maxRoot*100}%"></i></div><strong>${count}</strong></div>`).join('') || '<div class="dashboard-empty">暂无根因数据</div>';
  const ownerCounts = new Map();
  defects.forEach(defect => { const stat=ownerCounts.get(defect.executor_id)||{total:0,integration:0,production:0,reviewed:0};stat.total+=1;stat[defect.exposed_stage]+=1;stat.reviewed+=defect.review_status==='completed'?1:0;ownerCounts.set(defect.executor_id,stat); });
  ownerWrap.innerHTML = [...ownerCounts.entries()].sort((a,b)=>b[1].total-a[1].total).map(([id,stat]) => `<div class="retro-action-item"><strong>${escapeDashboardHtml(qualityReportRaw.memberMap.get(id)||'未命名成员')} · ${stat.total} 项</strong><span>集成 ${stat.integration} · 上线 ${stat.production} · 已复盘 ${stat.reviewed}</span></div>`).join('') || '<div class="dashboard-empty">暂无负责人数据</div>';
  const pending = defects.filter(defect => defect.review_status !== 'completed' || !defect.prevention_action);
  actionWrap.innerHTML = pending.slice(0,20).map(defect => `<div class="retro-action-item"><strong>${escapeDashboardHtml(defect.title)}</strong><span>${escapeDashboardHtml(qualityReportRaw.memberMap.get(defect.executor_id)||'未命名成员')} · ${defect.review_status !== 'completed' ? defectReviewStatusText(defect.review_status) : '缺少预防措施'} · ${defect.found_at}</span></div>`).join('') || '<div class="dashboard-empty">当前筛选范围内复盘与预防措施均已闭环</div>';
}

function externalQualityRoundStats(defects) {
  const stats = new Map();
  defects.forEach(defect => {
    const task = qualityReportRaw.qaTaskMap.get(defect.qa_task_id);
    const key = task ? Number(task.test_round || 1) : 'unlinked';
    const stat = stats.get(key) || { total:0, reopenedBugs:0, reopenTimes:0, changeInduced:0, missedTest:0, closed:0 };
    stat.total += 1;
    const reopenCount = Number(defect.reopen_count || 0);
    stat.reopenedBugs += reopenCount > 0 ? 1 : 0;
    stat.reopenTimes += reopenCount;
    stat.changeInduced += defect.is_change_induced ? 1 : 0;
    stat.missedTest += defect.is_missed_test ? 1 : 0;
    stat.closed += ['verified','closed'].includes(defect.status) ? 1 : 0;
    stats.set(key, stat);
  });
  return [...stats.entries()].sort((a,b) => a[0] === 'unlinked' ? 1 : b[0] === 'unlinked' ? -1 : Number(a[0]) - Number(b[0]));
}

function refreshVersionAssetPrdOptions(selectedId = '') {

function openVersionAssetEditor(prdId = '') {
  if (!versionTestMapRaw?.releases.length) { showToast('请先创建版本', 'error'); return; }

  document.getElementById('versionAssetRelease').innerHTML = versionTestMapRaw.releases.map(item => `<option value="${item.id}">${escapeDashboardHtml(item.name || item.version)} · ${releasePlatformText(item.platform)}</option>`).join('');

function closeVersionAssetEditor() { document.getElementById('versionAssetModal')?.classList.remove('open'); }

async function saveVersionTestAsset() {
  const releaseId = document.getElementById('versionAssetRelease')?.value || '';
  const prdId = document.getElementById('versionAssetPrd')?.value || null;
  const assetType = document.getElementById('versionAssetType')?.value || 'xmind';
  const name = document.getElementById('versionAssetName')?.value.trim() || '';
  const externalUrl = document.getElementById('versionAssetUrl')?.value.trim() || '';
  const file = document.getElementById('versionAssetFile')?.files?.[0] || null;
  if (!releaseId || !name) { showToast('请选择版本并填写资产名称', 'error'); return; }
  if (!file && !externalUrl) { showToast('请上传文件或填写外部链接', 'error'); return; }
  if (externalUrl && !safeDefectExternalUrl(externalUrl)) { showToast('外部链接格式不正确', 'error'); return; }
  if (file && file.size > 20 * 1024 * 1024) { showToast('文件不能超过 20MB', 'error'); return; }
  if (file && assetType === 'xmind' && !file.name.toLowerCase().endsWith('.xmind')) { showToast('XMind 资产请选择 .xmind 文件', 'error'); return; }
  const button = document.getElementById('saveVersionAssetBtn');
  button.disabled = true;
  let storagePath = null;
  try {
    if (file) {
      const safeFileName = file.name.replace(/[^a-zA-Z0-9._-]+/g, '_');
      storagePath = `${currentUser.id}/${crypto.randomUUID()}-${safeFileName}`;
      const upload = await sb.storage.from('qa-test-assets').upload(storagePath, file, { upsert:false, contentType:file.type || 'application/octet-stream' });
      if (upload.error) throw upload.error;
    }
    const result = await sb.from('version_test_assets').insert({ release_id:releaseId, prd_id:prdId, asset_type:assetType, name, storage_path:storagePath, external_url:externalUrl || null, file_name:file?.name || null, file_size:file?.size || null, notes:document.getElementById('versionAssetNotes')?.value.trim() || '', created_by:currentUser.id }).select('id').single();
    if (result.error) throw result.error;
    closeVersionAssetEditor();
    showToast('测试资产已添加');
    await renderVersionTestMap();
  } catch (error) {
    if (storagePath) await sb.storage.from('qa-test-assets').remove([storagePath]);
    console.error('[test-map] save asset failed:', error);
    showToast('保存测试资产失败：' + error.message, 'error');
  } finally { button.disabled = false; }
}

async function openVersionTestAsset(assetId) {
  const asset = versionTestMapRaw?.assets.find(item => item.id === assetId);
  if (!asset) return;
  try {
    let url = safeDefectExternalUrl(asset.external_url || '');
    if (asset.storage_path) {
      const result = await sb.storage.from('qa-test-assets').createSignedUrl(asset.storage_path, 120);
      if (result.error) throw result.error;
      url = result.data.signedUrl;
    }
    if (!url) throw new Error('资产地址不存在');
    const link = document.createElement('a'); link.href = url; link.target = '_blank'; link.rel = 'noopener'; link.click();
  } catch (error) { showToast('打开测试资产失败：' + error.message, 'error'); }
}

async function deleteVersionTestAsset(assetId) {
  const asset = versionTestMapRaw?.assets.find(item => item.id === assetId);
  if (!asset || !window.confirm(`确认删除测试资产“${asset.name}”吗？`)) return;
  try {
    const result = await sb.from('version_test_assets').delete().eq('id', assetId);
    if (result.error) throw result.error;
    if (asset.storage_path) {
      const remove = await sb.storage.from('qa-test-assets').remove([asset.storage_path]);
      if (remove.error) console.warn('[test-map] orphaned file:', remove.error);
    }
    showToast('测试资产已删除');
    await renderVersionTestMap();
  } catch (error) { showToast('删除测试资产失败：' + error.message, 'error'); }
}

function versionTestMapChangeRelease() {
  versionTestMapSelectedReleaseId = document.getElementById('versionTestMapRelease')?.value || '';
  renderVersionTestMapRows();
}

function renderVersionTestMapRows() {
  if (!versionTestMapRaw) return;
  const release = versionTestMapRaw.releases.find(item => item.id === versionTestMapSelectedReleaseId);
  const keyword = (document.getElementById('versionTestMapKeyword')?.value || '').trim().toLowerCase();
  const prds = versionTestMapRaw.prds.filter(item => (item.release_id === release?.id || (!item.release_id && release && item.version === release.version)) && (!keyword || `${item.title} ${item.product || ''} ${item.author || ''}`.toLowerCase().includes(keyword)));
  const releaseAssets = versionTestMapRaw.assets.filter(item => item.release_id === release?.id);
  const releaseTasks = versionTestMapRaw.tasks.filter(item => item.release_id === release?.id || prds.some(prd => prd.id === item.prd_id));
  const releaseTaskIds = new Set(releaseTasks.map(item => item.id));
  const releaseDefects = versionTestMapRaw.defects.filter(item => prds.some(prd => prd.id === item.prd_id) || releaseTaskIds.has(item.qa_task_id));
  const totalPlans = new Set(releaseTasks.flatMap(versionTaskPlanIds)).size;
  const snapshots = releaseTasks.map(item => versionTestMapRaw.snapshotMap.get(item.id)).filter(Boolean);
  const totalCases = snapshots.reduce((sum,item) => sum + Number(item.total_cases || 0), 0);
  const executedCases = snapshots.reduce((sum,item) => sum + Number(item.executed_cases || 0), 0);
  const metrics = document.getElementById('versionTestMapMetrics');
  if (metrics) metrics.innerHTML = [qualityMetricHtml('版本功能', prds.length, release ? `${release.version} · ${releasePlatformText(release.platform)}` : '暂无版本', null),qualityMetricHtml('XMind', releaseAssets.filter(item => item.asset_type === 'xmind').length, '已收录设计文件', null),qualityMetricHtml('TestHub 计划', totalPlans, '由工作事项自动汇总', null),qualityMetricHtml('用例执行率', `${qualityPercent(executedCases,totalCases)}%`, `${executedCases}/${totalCases} 条`, qualityPercent(executedCases,totalCases), 'var(--purple)'),qualityMetricHtml('关联 BUG', releaseDefects.length, '当前版本', null)].join('');
  const shared = releaseAssets.filter(item => !item.prd_id);
  const sharedWrap = document.getElementById('versionSharedAssets');
  if (sharedWrap) sharedWrap.innerHTML = shared.length ? `<strong>版本公共资产：</strong>${shared.map(item => `<button class="btn-secondary" style="padding:5px 9px;" onclick="openVersionTestAsset('${item.id}')">${versionAssetTypeText(item.asset_type)} · ${escapeDashboardHtml(item.name)}</button>`).join('')}` : '<span class="release-meta">暂无版本公共测试资产</span>';
  const rows = prds.map(prd => {
    const assets = releaseAssets.filter(item => item.prd_id === prd.id);
    const xmindAssets = assets.filter(item => item.asset_type === 'xmind');
    const tasks = releaseTasks.filter(item => item.prd_id === prd.id);
    const taskIds = new Set(tasks.map(item => item.id));
    const plans = new Set(tasks.flatMap(versionTaskPlanIds));
    const taskSnapshots = tasks.map(item => versionTestMapRaw.snapshotMap.get(item.id)).filter(Boolean);
    const total = taskSnapshots.reduce((sum,item) => sum + Number(item.total_cases || 0), 0);
    const executed = taskSnapshots.reduce((sum,item) => sum + Number(item.executed_cases || 0), 0);
    const rounds = [...new Set(tasks.map(item => Number(item.test_round || 1)))].sort((a,b)=>a-b);
    const defects = versionTestMapRaw.defects.filter(item => item.prd_id === prd.id || taskIds.has(item.qa_task_id));
    const gaps = [];
    if (!xmindAssets.length) gaps.push('缺 XMind');
    if (!plans.size) gaps.push('缺 TestHub 计划');
    if (total && executed < total) gaps.push('执行中');
    const status = gaps.length ? gaps.join(' · ') : tasks.length ? '资产已关联' : '待安排测试';
    const assetHtml = assets.length ? assets.map(item => { const canDelete=userRole==='admin'||item.created_by===currentUser.id;return `<div style="display:flex;gap:5px;align-items:center;margin:3px 0;"><button class="risk-action" onclick="openVersionTestAsset('${item.id}')">${versionAssetTypeText(item.asset_type)} · ${escapeDashboardHtml(item.name)}</button>${canDelete?`<button class="dashboard-modal-close" style="width:24px;height:24px;" onclick="deleteVersionTestAsset('${item.id}')" title="删除"><i class="ti ti-trash"></i></button>`:''}</div>`; }).join('') : '<span class="release-meta">尚未添加</span>';
    return `<tr><td><strong>${escapeDashboardHtml(prd.title)}</strong><br><span class="release-meta">${escapeDashboardHtml(prd.product || '未设置产品线')} · ${escapeDashboardHtml(prd.author || '未设置负责人')}</span></td><td>${assetHtml}</td><td><strong>${plans.size} 个计划</strong><br><span class="release-meta">执行 ${executed}/${total} · ${qualityPercent(executed,total)}%</span></td><td>${rounds.length ? rounds.map(item=>`第 ${item} 轮`).join('、') : '-'}</td><td><strong>${defects.length}</strong><br><span class="release-meta">未关闭 ${defects.filter(item=>!['verified','closed'].includes(item.status)).length}</span></td><td><span class="card-tag" style="background:${gaps.length?'#FFF3CC':'#DDF7EE'};color:${gaps.length?'#7a5a00':'#0F6E56'};">${escapeDashboardHtml(status)}</span></td><td><button class="btn-primary" style="padding:6px 10px;" onclick="openVersionAssetEditor('${prd.id}')">添加资产</button></td></tr>`;
  }).join('');
  const body = document.getElementById('versionTestMapRows');
  if (body) body.innerHTML = rows || '<tr><td colspan="7" class="dashboard-empty">当前版本暂无匹配的 PRD 功能</td></tr>';
  const count = document.getElementById('versionTestMapCount'); if (count) count.textContent = `${prds.length} 个功能`;
}

async function renderVersionTestMap() {
  const content = document.getElementById('content');
  content.style.padding = '24px';
  content.innerHTML = '<div class="history-card"><div class="dashboard-loading">正在加载版本测试地图…</div></div>';
  try {
    const [releasesResult,prdsResult,tasksResult,snapshotsResult,defectsResult,assetsResult] = await Promise.all([
      sb.from('releases').select('id,version,name,platform,status,planned_release_date').order('created_at',{ascending:false}),
      sb.from('prds').select('id,title,release_id,version,product,author,status').order('created_at',{ascending:false}),
      sb.from('qa_tasks').select('id,title,prd_id,release_id,test_round,status,testhub_plan_id,testhub_plan_ids').neq('status','cancelled'),
      sb.from('task_testhub_progress').select('task_id,plan_id,plan_ids,total_cases,executed_cases,progress_ratio,status_counts,sync_status,synced_at,scope_mode,scope_suite_ids,scope_suite_names'),
      sb.from('quality_defects').select('id,prd_id,qa_task_id,status,severity'),

  const platformSelect=document.getElementById('featurePlatform');platformSelect.innerHTML='<option value="app_pad">APP + Pad</option><option value="app">APP</option><option value="pad">Pad</option><option value="web">Web</option><option value="pc">PC</option>';

async function saveProductFeature(){

}

async function openPrdFeatureTriage(){
  if(userRole!=='admin'){showToast('仅管理员可以整理 PRD 归属','error');return;}ensurePrdFeatureTriageModal();document.getElementById('featureTriageModal').classList.add('open');document.getElementById('featureTriageBody').innerHTML='<div class="dashboard-loading">正在加载 PRD 归属…</div>';
  try{const result=await sb.from('prd_feature_triage').select('*');if(result.error)throw result.error;const triageMap=new Map((result.data||[]).map(item=>[item.prd_id,item]));const changesByPrd=new Map();featureTestMapRaw.changes.filter(item=>item.prd_id).forEach(item=>{const list=changesByPrd.get(item.prd_id)||[];list.push(item);changesByPrd.set(item.prd_id,list);});featureTriageRows=featureTestMapRaw.prds.map(prd=>{const triage=triageMap.get(prd.id);const changes=changesByPrd.get(prd.id)||[];const status=triage?.status==='ignored'?'ignored':(changes.length?'mapped':triage?.status||'pending');return {...prd,triage_status:status,triage_note:triage?.note||'',feature_changes:changes};});renderPrdFeatureTriageList();}catch(error){document.getElementById('featureTriageBody').innerHTML=`<div class="dashboard-empty">PRD 归属加载失败：${escapeDashboardHtml(error.message)}<br><span class="release-meta">请先执行 PRD 功能归类数据库迁移</span></div>`;}
}

function renderPrdFeatureTriageList(){
  const body=document.getElementById('featureTriageBody');if(!body)return;const status=document.getElementById('featureTriageStatus')?.value||'pending';const keyword=(document.getElementById('featureTriageKeyword')?.value||'').trim().toLowerCase();const featureMap=new Map(featureTestMapRaw.features.map(item=>[item.id,item]));const releaseMap=new Map(featureTestMapRaw.releases.map(item=>[item.id,item]));const rows=featureTriageRows.filter(item=>(status==='all'||item.triage_status===status)&&(!keyword||`${item.title} ${item.version||''} ${item.product||''}`.toLowerCase().includes(keyword)));
  const editorPrd=featureTriageRows.find(item=>item.id===featureTriageEditingPrdId);const linkedIds=new Set(editorPrd?.feature_changes.map(item=>item.feature_id)||[]);const editorHtml=editorPrd?`<div class="feature-module-section" style="margin-bottom:12px;border-color:#c9b5ff;"><div class="card-hd"><div><strong>关联功能：${escapeDashboardHtml(editorPrd.title)}</strong><div class="release-meta">可同时选择多个受影响的长期功能；已关联项不可在此删除历史记录</div></div><button class="dashboard-modal-close" onclick="featureTriageEditingPrdId=null;renderPrdFeatureTriageList()"><i class="ti ti-x"></i></button></div><input class="dashboard-input" id="featureMappingKeyword" placeholder="搜索已有功能" oninput="filterFeatureMappingChoices()" style="margin:10px 0;"><div id="featureMappingChoices" class="feature-card-grid">${featureTestMapRaw.features.filter(item=>item.status==='active').map(item=>`<label class="feature-mini-stat feature-mapping-choice" data-search="${escapeDashboardHtml(`${item.product_line} ${item.module_name} ${item.name}`.toLowerCase())}" style="text-align:left;display:flex;gap:8px;align-items:flex-start;cursor:pointer;"><input type="checkbox" name="featureMappingChoice" value="${item.id}" ${linkedIds.has(item.id)?'checked disabled':''}><span><strong style="font-size:12px;">${escapeDashboardHtml(item.name)}</strong><small style="display:block;">${escapeDashboardHtml(item.module_name)} · ${featurePlatformText(item.platform_scope)}${linkedIds.has(item.id)?' · 已关联':''}</small></span></label>`).join('')}</div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;"><button class="btn-secondary" onclick="featureTriageEditingPrdId=null;renderPrdFeatureTriageList()">取消</button><button class="btn-primary" onclick="savePrdFeatureMapping('${editorPrd.id}')">保存新增关联</button></div></div>`:'';
  const listHtml=rows.map(prd=>{const release=releaseMap.get(prd.release_id);const names=prd.feature_changes.map(change=>featureMap.get(change.feature_id)?.name).filter(Boolean);const badge=prd.triage_status==='mapped'?'<span class="feature-state-chip">已关联</span>':prd.triage_status==='ignored'?'<span class="feature-state-chip missing">已忽略</span>':'<span class="feature-state-chip pending">待归类</span>';const actions=prd.triage_status==='pending'?`<button class="btn-primary" onclick="editPrdFeatureMapping('${prd.id}')">关联已有功能</button><button class="btn-secondary" onclick="createFeatureFromPrd('${prd.id}')">确认为新功能</button><button class="btn-secondary" onclick="setPrdFeatureTriage('${prd.id}','ignored')">无需纳入</button>`:prd.triage_status==='mapped'?`<button class="btn-secondary" onclick="editPrdFeatureMapping('${prd.id}')">继续关联功能</button>`:`<button class="btn-secondary" onclick="setPrdFeatureTriage('${prd.id}','pending')">恢复待归类</button>`;return `<div class="release-check-row" style="grid-template-columns:minmax(260px,2fr) minmax(130px,1fr) minmax(220px,1.5fr) auto;align-items:center;"><div><strong>${escapeDashboardHtml(prd.title)}</strong><div class="release-meta">${escapeDashboardHtml(prd.product||'Liene Photo')} · ${escapeDashboardHtml(release?.version||prd.version||'未关联版本')}</div></div><div>${badge}</div><div class="release-meta">${names.length?`已关联：${escapeDashboardHtml(names.join('、'))}`:'尚未进入全功能目录'}</div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">${actions}</div></div>`;}).join('');
  body.innerHTML=editorHtml+(listHtml||'<div class="dashboard-empty">当前条件下没有 PRD</div>');
}

function resolvePrdFeatureRelease(prd){return prd.release_id||featureTestMapRaw.releases.find(item=>item.version===prd.version)?.id||null;}

async function linkPrdToFeatures(prd,featureIds,changeType='changed'){

function renderFeatureTestMapRows(){
  if(!featureTestMapRaw)return;
  const triageButton=document.querySelector('button[onclick="importExistingPrdsAsFeatures()"]');if(triageButton)triageButton.textContent='整理 PRD 归属';
  const validFeatureIds=new Set(featureTestMapRaw.features.filter(item=>item.status==='active').map(item=>item.id));for(const id of selectedFeatureIds)if(!validFeatureIds.has(id))selectedFeatureIds.delete(id);

  const product=document.getElementById('featureMapProduct')?.value||'all';
  const moduleName=document.getElementById('featureMapModule')?.value||'all';
  const state=document.getElementById('featureMapState')?.value||'all';
  const releaseMap=new Map(featureTestMapRaw.releases.map(item=>[item.id,item]));
  const memberMap=new Map(featureTestMapRaw.members.map(item=>[item.id,item.name||'未命名成员']));
  const featureDetails=new Map();
  featureTestMapRaw.features.filter(feature=>feature.status==='active').forEach(feature=>{
    const assets=featureTestMapRaw.assets.filter(item=>item.feature_id===feature.id);
    const changes=featureTestMapRaw.changes.filter(item=>item.feature_id===feature.id);
    const pending=changes.filter(item=>item.asset_update_status==='pending');
    const prdIds=new Set(changes.map(item=>item.prd_id).filter(Boolean));
    const tasks=featureTestMapRaw.tasks.filter(item=>prdIds.has(item.prd_id));
    const taskIds=new Set(tasks.map(item=>item.id));
    const plans=new Set(tasks.flatMap(versionTaskPlanIds));
    const snapshots=tasks.map(item=>featureTestMapRaw.snapshotMap.get(item.id)).filter(Boolean);
    const total=snapshots.reduce((sum,item)=>sum+Number(item.total_cases||0),0);
    const executed=snapshots.reduce((sum,item)=>sum+Number(item.executed_cases||0),0);
    const rounds=[...new Set(tasks.map(item=>Number(item.test_round||1)))].sort((a,b)=>a-b);
    const defects=featureTestMapRaw.defects.filter(item=>prdIds.has(item.prd_id)||taskIds.has(item.qa_task_id));
    const hasXmind=assets.some(item=>item.asset_type==='xmind');

  });
  let features=featureTestMapRaw.features.filter(feature=>{

    if(keyword&&!`${feature.name} ${feature.product_line} ${feature.module_name}`.toLowerCase().includes(keyword))return false;
    const detail=featureDetails.get(feature.id);
    const complete=detail.hasXmind&&!detail.pending.length&&feature.owner_id&&detail.prdIds.size&&detail.tasks.length&&detail.plans.size;
    return state==='all'||(state==='pending'&&detail.pending.length)||(state==='missing'&&!detail.hasXmind)||(state==='no_owner'&&!feature.owner_id)||(state==='unlinked'&&!detail.prdIds.size)||(state==='no_task'&&!detail.tasks.length)||(state==='no_plan'&&!detail.plans.size)||(state==='complete'&&complete);
  });
  visibleFeatureIds=features.map(item=>item.id);
