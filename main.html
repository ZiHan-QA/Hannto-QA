  const executorId = document.getElementById('progressExecutor')?.value || currentUser.id;
  const note = document.getElementById('progressNote')?.value.trim() || '';
  let status = document.getElementById('progressTaskStatus')?.value || task?.status || 'todo';
  const blockedReason = document.getElementById('progressBlockedReason')?.value.trim() || '';
  const blockedUntil = document.getElementById('progressBlockedUntil')?.value || null;
  const completionNote = document.getElementById('progressCompletionNote')?.value.trim() || '';
  const button = document.getElementById('saveProgressBtn');
  if (!task) { showToast('未找到工作事项', 'error'); return; }
  const automatic = taskUsesTestHubProgress(task);
  const wasBatchMode = progressBatchMode;
  const batchStates = progressBatchMode
    ? [...progressBatchTouchedMembers].map(memberId => batchProgressState(task, memberId))
    : [];
  if (!automatic && (!workDate || workDate > dashboardTodayInputValue())) { showToast('进度日期不能晚于今天', 'error'); return; }
  if (!automatic && !progressBatchMode && progressPercentTouched && (!Number.isFinite(percent) || percent < 0 || percent > 100)) { showToast('累计完成度必须在 0% 到 100% 之间', 'error'); return; }
  if (!automatic && !progressBatchMode && progressPercentTouched && (!Number.isFinite(points) || points < -0.001)) { showToast('该百分比低于其他日期已有进度，请先修正历史填报', 'error'); return; }
  if (!automatic && !progressBatchMode && !taskAssigneeList(task).some(item => item.member_id === executorId)) { showToast('执行人必须是该事项负责人', 'error'); return; }
  if (batchStates.some(state => !Number.isFinite(state.percent) || state.percent < 0 || state.percent > 100)) { showToast('每位负责人的累计完成度必须在 0% 到 100% 之间', 'error'); return; }
  if (batchStates.some(state => !Number.isFinite(state.points) || state.points < -0.001)) { showToast('有负责人的完成度低于其他日期已有进度，请先修正历史填报', 'error'); return; }
  if (status === 'blocked' && !blockedReason) { showToast('请填写阻塞原因', 'error'); return; }
  if (!automatic && ((progressBatchMode && batchStates.some(state => state.percent > 0)) || (!progressBatchMode && progressPercentTouched && percent > 0)) && status === 'todo') status = 'in_progress';
  const shouldSaveProgress = !automatic && (progressBatchMode ? batchStates.length > 0 : progressPercentTouched);
  const existingLogs = shouldSaveProgress && !progressBatchMode ? progressLogsForSelection() : [];
  const editableLogs = userRole === 'admin' ? existingLogs : existingLogs.filter(log => log.reported_by === currentUser.id);
  if (editableLogs.length !== existingLogs.length) { showToast('该日期包含他人代填记录，请联系管理员修正', 'error'); return; }
  const singleAllocation = taskAssigneeList(task).find(item => item.member_id === executorId);
  const singleEffort = Number(singleAllocation?.allocated_effort || task.effort_person_days || 0);
  const singleState = shouldSaveProgress && !progressBatchMode ? [{
    memberId:executorId,
    dateKey:workDate,
    allocated:singleEffort,
    logs:existingLogs,
    otherPoints:taskMemberManualProgressTotal(task, executorId, existingLogs.map(log => log.id)),
    percent,
    points,
    currentPoints:existingLogs.reduce((sum, log) => sum + Number(log.progress_points || 0), 0),
    currentPercent:singleEffort > 0 ? taskMemberManualProgressTotal(task, executorId) / singleEffort * 100 : 0
  }] : [];
  const changedStates = progressBatchMode ? batchStates : singleState;
  let allComplete = false;
  if (!automatic && shouldSaveProgress) {
    const completion = progressCompletionSnapshot(task, changedStates);
    allComplete = completion.length > 0 && completion.every(item => item.percent >= 99.95);
  }
  const previewResult = await progressSavePreview(task, changedStates, status, {
    suggestDone:!automatic && shouldSaveProgress && allComplete && status !== 'done',
    incompleteDone:!automatic && shouldSaveProgress && !allComplete && status === 'done'
  });
  if (!previewResult.confirmed) return;
  if (previewResult.markDone) {
    status = 'done';
    document.getElementById('progressTaskStatus').value = status;
    toggleProgressWorkflowFields();
    if (!document.getElementById('progressCompletionNote').value.trim()) {
      document.getElementById('progressCompletionNote').value = '所有负责人累计完成度已达到 100%';
    }
  }
  const finalCompletionNote = document.getElementById('progressCompletionNote')?.value.trim() || '';
  if (status === 'done' && !finalCompletionNote) { showToast('请填写完成说明后再次保存', 'error'); return; }

  button.disabled = true;
  try {
    const progressEntries = changedStates.map(state => ({
      executor_id:state.memberId,
      progress_points:Math.max(0, Number(state.points || 0)),
      note:progressBatchMode
        ? (document.getElementById(`batchProgressNote-${state.memberId}`)?.value.trim() || '')
        : note
    }));
    const { data, error: saveError } = await sb.rpc('save_qa_task_progress', {
      target_task_id: task.id,
      target_work_date: workDate || dashboardTodayInputValue(),
      status_payload: {
        status,
        blocked_reason: status === 'blocked' ? blockedReason : null,
        blocked_owner_id: status === 'blocked' ? task.blocked_owner_id : null,
        blocked_until: status === 'blocked' ? blockedUntil : null,
        completion_note: status === 'done' ? finalCompletionNote : null
      },
      progress_payload: progressEntries
    });
    if (saveError) throw saveError;
    if (!data) throw new Error('未找到可更新的工作事项');
    closeProgressModal();
    showToast(automatic
      ? '任务状态已更新'
      : wasBatchMode && shouldSaveProgress
        ? `状态与 ${batchStates.length} 位负责人的进度已保存`
        : shouldSaveProgress ? `状态与累计进度 ${percent.toFixed(1)}% 已保存` : '任务状态已更新');
    await refreshTaskRecords();
  } catch (error) {
    console.error('[progress] save failed:', error);
    showToast('状态/进度保存失败：' + error.message, 'error');
  } finally {
    if (button?.isConnected) button.disabled = false;
  }
}

async function deleteTaskProgressForSelection() {
  const task = taskRecordCache.get(progressQaTaskId);
  const logs = progressLogsForSelection();

  const editableLogs = userRole === 'admin' ? logs : logs.filter(log => log.reported_by === currentUser.id);

function getSelectedTestHubPlanIds() {
  return [...document.querySelectorAll('#testHubPlanOptions input[type="checkbox"]:checked')]
    .map(input => input.value.trim())
    .filter(Boolean);
}

function testHubPlanPlatform(name) {
  const text = String(name || '');
  if (/android/i.test(text)) return 'Android';
  if (/\bios\b/i.test(text)) return 'iOS';
  return '通用';
}

function testHubPlanVersion(name) {
  return String(name || '').match(/\b\d+\.\d+\.\d+\b/)?.[0] || '';
}

function testHubPlanDisplayName(name) {
  const original = String(name || '未命名计划').trim();
  const version = testHubPlanVersion(original);
  const simplified = original
    .replace(/^Liene Photo App Release\s*-\s*/i, '')
    .replace(/\b(?:Android|iOS)\b/gi, '')
    .replace(version, '')
    .replace(/^\s*[-·]\s*/, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
  return simplified || original;
}

function testHubPlanDate(value) {
  if (!value) return '';
  const numeric = Number(value);
  const date = Number.isFinite(numeric)
    ? new Date(numeric < 1e12 ? numeric * 1000 : numeric)
    : new Date(value);
  return Number.isNaN(date.getTime()) ? '' : date.toLocaleDateString('zh-CN');
}

function updateTestHubPlanSummary() {
  const summary = document.getElementById('testHubPlanSummary');
  if (!summary) return;
  const count = getSelectedTestHubPlanIds().length;

function updateTestHubSuiteSummary() {

function renderTestHubSuiteChoices(suites, selectedIds = []) {
  const container = document.getElementById('testHubSuiteOptions');

  for (const suite of suites || []) {

  }

    }).join('') || '<span class="testhub-plan-empty">尚无模块缓存；保存任务并运行一次本地 TestHub 同步后再选择</span>';

}

async function loadTestHubSuitesForSelection(selectedIds = null, notify = true) {
  const libraryId = document.getElementById('newTaskTestHubLibrary')?.value || '';
  const planIds = getSelectedTestHubPlanIds();
  const preserved = selectedIds === null ? getSelectedTestHubSuiteIds() : selectedIds;
  if (!libraryId || !planIds.length) {
    testHubSuiteChoiceCache = new Map();
    renderTestHubSuiteChoices([], preserved || []);
    if (notify) showToast('请先选择 TestHub 用例库和计划', 'error');
    return;
  }
  try {
    const { data, error } = await sb.from('testhub_plan_suite_cache')
      .select('suite_id,suite_name,case_count,plan_id,synced_at')
      .eq('library_id', libraryId)
      .in('plan_id', planIds)
      .order('suite_name');
    if (error) throw error;
    const merged = new Map();
    for (const suite of data || []) {
      const id = String(suite.suite_id || '');
      if (!id) continue;
      const current = merged.get(id) || { ...suite, case_count:0 };
      current.case_count += Number(suite.case_count || 0);
      merged.set(id, current);
    }
    testHubSuiteChoiceCache = new Map();
    renderTestHubSuiteChoices([...merged.values()], preserved || []);
    if (notify) showToast(merged.size ? `已读取 ${merged.size} 个 TestHub 模块` : '尚无模块缓存，请先运行本地同步', merged.size ? 'success' : 'error');
  } catch (error) {
    console.error('[testhub] suite cache load failed:', error);
    renderTestHubSuiteChoices([], preserved || []);
    if (notify) showToast('模块缓存读取失败，请先执行新迁移', 'error');
  }
}

function renderTestHubPlanChoices(plans, selectedIds = []) {

    }
  }

async function getEdgeFunctionErrorMessage(error) {
  try {
    const response = error?.context;
    if (response && typeof response.clone === 'function') {
      const payload = await response.clone().json();
      if (payload?.error) return String(payload.error);
    }
  } catch (parseError) {
    console.warn('[edge-function] error payload parse failed:', parseError);
  }
  return error?.message || '未知错误';
}

async function loadTestHubPlans(button) {
  if (userRole !== 'admin') { showToast('仅管理员可以拉取 TestHub 计划', 'error'); return; }
  const libraryId = document.getElementById('newTaskTestHubLibrary')?.value || '';
  const searchInput = document.getElementById('newTaskTestHubSearch');
  const hint = document.getElementById('testHubPlanHint');
  const selectedPlanIds = getSelectedTestHubPlanIds();
  const keyword = searchInput?.value.trim() || '';
  if (!libraryId) { showToast('请先选择 TestHub 用例库', 'error'); return; }

  if (button) button.disabled = true;
  if (hint) hint.textContent = `正在查询${keyword ? `“${keyword}”相关` : '最近'}计划缓存…`;
  try {
    let query = sb.from('testhub_plan_cache')
      .select('plan_id,name,short_id,status,state_name,assignee_name,start_at,end_at,html_url,synced_at')
      .eq('library_id', libraryId)
      .order('end_at', { ascending:false, nullsFirst:false })
      .limit(keyword ? 200 : 50);
    if (keyword) query = query.ilike('name', `%${keyword}%`);
    const { data, error } = await query;
    if (error) throw error;
    const plans = (data || []).map(plan => ({
      id: plan.plan_id,
      name: plan.name,
      short_id: plan.short_id,
      status: plan.status,
      state: { name:plan.state_name },
      assignee: { display_name:plan.assignee_name },
      start_at: plan.start_at,
      end_at: plan.end_at,
      html_url: plan.html_url,
      synced_at: plan.synced_at
    }));
    const nextSelected = selectedPlanIds.length ? selectedPlanIds : (plans.length === 1 ? [String(plans[0].id || '')] : []);
    testHubPlanChoiceCache = new Map();
    renderTestHubPlanChoices(plans, nextSelected);
    const syncedText = plans[0]?.synced_at ? `，缓存于 ${new Date(plans[0].synced_at).toLocaleString('zh-CN')}` : '';
    if (hint) hint.textContent = plans.length
      ? `缓存中找到 ${plans.length} 个计划${syncedText}，可同时勾选 Android / iOS`
      : `缓存中没有${keyword ? `包含“${keyword}”的` : ''}计划，请先运行本地同步工具或手动添加计划 ID`;
    showToast(plans.length ? `已读取 ${plans.length} 个 TestHub 缓存计划` : '缓存中没有匹配计划', plans.length ? 'success' : 'error');
  } catch (error) {
    console.error('[testhub] plan cache load failed:', error);
    if (hint) hint.textContent = '计划缓存读取失败，请先执行本地缓存表迁移和本地同步工具';
    showToast('TestHub 缓存读取失败：' + error.message, 'error');
  } finally {
    if (button?.isConnected) button.disabled = false;
  }
}

async function syncTestHubProgress(taskId, button) {
  if (userRole !== 'admin') { showToast('仅管理员可以同步 TestHub', 'error'); return; }
  if (button) {
    button.disabled = true;
    button.dataset.syncOriginalHtml = button.innerHTML;
    button.innerHTML = '<i class="ti ti-loader-2"></i> 同步中…';
    pendingTestHubSyncButton = button;
  }
  pendingTestHubFocusTaskId = taskId || null;
  try {
    const { data: before } = await sb.from('testhub_sync_status')
      .select('updated_at,last_started_at,last_success_at')
      .eq('sync_name','testhub_local')
      .maybeSingle();
    const triggeredAt = Date.now();
    const link = document.createElement('a');
    link.href = 'lieneqa-sync://run';
    link.style.display = 'none';
    document.body.appendChild(link);
    link.click();
    link.remove();
    showToast('已请求本机启动 TestHub 同步，完成后页面会自动刷新');
    void monitorLocalTestHubSync(triggeredAt, before?.updated_at || null);
  } catch (error) {
    console.error('[testhub] sync failed:', error);
    showToast('TestHub 同步失败：' + error.message, 'error');
    resetPendingTestHubSyncButton();
  } finally {
  }
}

function resetPendingTestHubSyncButton() {
  const button = pendingTestHubSyncButton;
  if (button?.isConnected) {
    button.disabled = false;
    button.innerHTML = button.dataset.syncOriginalHtml || '刷新进度';
  }
  pendingTestHubSyncButton = null;
}

async function monitorLocalTestHubSync(triggeredAt, previousUpdatedAt) {
  const token = ++localTestHubSyncMonitorToken;
  let started = false;
  for (let attempt = 0; attempt < 120; attempt += 1) {
    await new Promise(resolve => setTimeout(resolve, 3000));
    if (token !== localTestHubSyncMonitorToken) return;
    try {
      const { data, error } = await sb.from('testhub_sync_status')
        .select('status,last_started_at,last_success_at,last_failure_at,error_message,updated_at')
        .eq('sync_name','testhub_local')
        .maybeSingle();
      if (error) throw error;
      const changed = data?.updated_at && data.updated_at !== previousUpdatedAt;
      const startedAt = data?.last_started_at ? new Date(data.last_started_at).getTime() : 0;
      if (!changed || startedAt < triggeredAt - 10000) continue;
      if (data.status === 'running') {
        if (!started) showToast('TestHub 正在后台同步，可以继续使用页面');
        started = true;
        continue;
      }
      if (data.status === 'success') {
        showToast('TestHub 同步完成，进度已更新');
        resetPendingTestHubSyncButton();
        if (currentPage === 'tasks') {
          await refreshTaskRecords();
          focusTeamTaskAfterRefresh(pendingTestHubFocusTaskId);
        }
        else if (currentPage === 'dashboard') await loadDashboardData(++dashboardLoadToken);
        pendingTestHubFocusTaskId = null;
        return;
      }
      if (data.status === 'failed') {
        showToast('TestHub 同步失败：' + (data.error_message || '请检查本地同步日志'), 'error');
        resetPendingTestHubSyncButton();
        return;
      }
    } catch (error) {
      console.warn('[testhub] sync monitor failed:', error);
    }
  }
  showToast(started ? 'TestHub 仍在后台同步，请稍后刷新查看' : '未检测到本机同步，请先双击 scripts/配置TestHub一键同步.cmd', started ? 'success' : 'error');
  resetPendingTestHubSyncButton();
}

function focusTeamTaskAfterRefresh(taskId) {

}

async function copyLocalSyncAuthorization(button) {
  if (userRole !== 'admin') { showToast('仅管理员可以生成本地同步授权', 'error'); return; }
  if (button) button.disabled = true;
  try {
    let { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;
    const expiresSoon = !session?.expires_at || session.expires_at * 1000 < Date.now() + 5 * 60 * 1000;
    if (expiresSoon) {
      const refreshed = await sb.auth.refreshSession();
      if (refreshed.error) throw refreshed.error;
      session = refreshed.data.session;
    }
    if (!session?.access_token) throw new Error('当前登录会话不存在，请重新登录');
    await navigator.clipboard.writeText(session.access_token);
    showToast('本地同步授权已复制；请立即粘贴到同步工具，授权不会保存到项目');
  } catch (error) {
    console.error('[testhub] copy local sync authorization failed:', error);
    showToast('复制本地同步授权失败：' + error.message, 'error');
  } finally {
    if (button?.isConnected) button.disabled = false;
  }
}

function getSelectedAssigneeIds() {
  const select = document.getElementById('newTaskAssignee');
  return select ? [...select.selectedOptions].map(option => option.value).filter(Boolean) : [];
}

function toggleAssigneeOption(event) {
  if (event.target?.tagName !== 'OPTION' || event.currentTarget.disabled) return;
  event.preventDefault();
  event.target.selected = !event.target.selected;
  event.currentTarget.focus();
  event.currentTarget.dispatchEvent(new Event('change', { bubbles:true }));
}

function currentAssigneeAllocationValues() {
  const values = new Map();
  document.querySelectorAll('#assigneeAllocationPreview .assignee-effort-input').forEach(input => {
    values.set(input.dataset.memberId, Number(input.value) || 0);
  });
  return values;
}

function renderAssigneeAllocationInputs(values = null) {
  const preview = document.getElementById('assigneeAllocationPreview');
  const select = document.getElementById('newTaskAssignee');
  if (!preview || !select) return;
  const selected = [...select.selectedOptions];
  if (!selected.length) {
    preview.innerHTML = '<div class="assignee-allocation-note">请至少选择 1 位负责人</div>';
    return;
  }
  const saved = values instanceof Map ? values : currentAssigneeAllocationValues();
  const total = Number(document.getElementById('newTaskEffort')?.value) || 0;
  const even = selected.length ? total / selected.length : 0;
  preview.innerHTML = `<div class="assignee-allocation-note">总人天只计算一次，可按成员调整；各成员之和必须等于 ${total.toFixed(2)} 人天。<button class="btn-secondary" type="button" onclick="distributeAssigneeEffortEvenly()">平均分配</button></div><div class="assignee-allocation-grid">${selected.map((option, index) => {
    const fallback = index === selected.length - 1 ? total - even * (selected.length - 1) : even;
    const value = saved.has(option.value) ? saved.get(option.value) : fallback;
    return `<label class="assignee-allocation-item"><span>${escapeDashboardHtml(option.textContent)}</span><input class="dashboard-input assignee-effort-input" data-member-id="${escapeDashboardHtml(option.value)}" type="number" min="0.01" max="365" step="0.01" value="${Math.max(value, 0).toFixed(2)}"><small>人天</small></label>`;
  }).join('')}</div>`;
}

function distributeAssigneeEffortEvenly() {
  const select = document.getElementById('newTaskAssignee');
  const selected = select ? [...select.selectedOptions] : [];
  const total = Number(document.getElementById('newTaskEffort')?.value) || 0;
  const values = new Map();
  if (selected.length) {
    const cents = Math.round(total * 100);
    const base = Math.floor(cents / selected.length);
    selected.forEach((option, index) => values.set(option.value, (base + (index < cents % selected.length ? 1 : 0)) / 100));
  }
  renderAssigneeAllocationInputs(values);
}

function getAssigneeAllocations() {
  return [...document.querySelectorAll('#assigneeAllocationPreview .assignee-effort-input')].map(input => ({
    member_id: input.dataset.memberId,
    allocated_effort: Number(input.value)
  }));
}

async function loadTaskAssignees(selectedIds = null, allocations = null) {
  const select = document.getElementById('newTaskAssignee');
  if (!select) return;
  const selected = new Set(selectedIds || getSelectedAssigneeIds());
  if (!selected.size) selected.add(currentUser.id);
  try {
    let data = dashboardMembers;
    if (userRole === 'admin' || !data.length) {
      const result = userRole === 'admin'
        ? await sb.from('profiles').select('id,name,role,resource_participant').eq('resource_participant', true).order('name')
        : { data:[{ id:currentUser.id, name:document.getElementById('userName')?.textContent || '我', role:userRole }], error:null };
      if (result.error) throw result.error;
      data = (result.data || []).filter(isResourceParticipant);
      dashboardMembers = data;
    }
    select.innerHTML = dashboardMembers.map(member =>
      `<option value="${escapeDashboardHtml(member.id)}" ${selected.has(member.id) ? 'selected' : ''}>${escapeDashboardHtml(member.name || '未命名成员')}${member.id === currentUser.id ? '（我）' : ''}</option>`
    ).join('');
    if (!dashboardMembers.some(member => member.id === currentUser.id)) {
      select.insertAdjacentHTML('afterbegin', `<option value="${currentUser.id}">分配给我</option>`);
    }
    const blockedOwner = document.getElementById('newTaskBlockedOwner');
    if (blockedOwner) {
      const previousOwner = blockedOwner.value;
      blockedOwner.innerHTML = `<option value="">暂未指定</option>${dashboardMembers.map(member => `<option value="${escapeDashboardHtml(member.id)}">${escapeDashboardHtml(member.name || '未命名成员')}</option>`).join('')}`;
      blockedOwner.value = previousOwner;
    }
    if (allocations) renderAssigneeAllocationInputs(new Map(allocations.map(item => [item.member_id, Number(item.allocated_effort)])));
    else renderAssigneeAllocationInputs();
  } catch (error) {
    console.error('[dashboard] load assignees failed:', error);
    select.innerHTML = `<option value="${currentUser.id}">分配给我（成员加载失败）</option>`;
  }
}

function parsePingCodeReference(value) {
  const raw = value.trim();
  if (!raw) return null;
  const url = new URL(raw);
  if (!['http:', 'https:'].includes(url.protocol)) throw new Error('PingCode 链接格式不正确');
  const segments = url.pathname.split('/').filter(Boolean);
  const externalId = url.searchParams.get('id') || segments.at(-1);
  if (!externalId) throw new Error('无法从链接中识别 PingCode 工作项 ID');
  return { externalUrl: url.toString(), externalId };
}

function closeNewTaskModal() {
  document.getElementById('newTaskModal')?.classList.remove('open');
}

async function saveQaTask() {
  if (taskEditorReadOnly) { showToast('该事项为只读，请联系管理员或主负责人修改', 'error'); return; }
  const existingTask = editingQaTaskId ? taskRecordCache.get(editingQaTaskId) : null;
  const title = document.getElementById('newTaskTitle')?.value.trim();
  const description = document.getElementById('newTaskDescription')?.value.trim() || '';
  const priority = existingTask?.priority || 'P1';
  const taskType = document.getElementById('newTaskType')?.value;
  const status = document.getElementById('newTaskStatus')?.value || 'todo';
  const testRound = Number(document.getElementById('newTaskRound')?.value || 1);
  const releaseId = document.getElementById('newTaskRelease')?.value || null;
  syncTaskProjectLink();
  const portfolioPlanId = document.getElementById('newTaskPortfolioPlan')?.value || null;
  const blockedReason = document.getElementById('newTaskBlockedReason')?.value.trim() || '';
  const blockedOwnerId = document.getElementById('newTaskBlockedOwner')?.value || null;
  const blockedUntil = document.getElementById('newTaskBlockedUntil')?.value || null;
  const completionNote = document.getElementById('newTaskCompletionNote')?.value.trim() || '';
  const assigneeIds = getSelectedAssigneeIds();
  const effort = Number(document.getElementById('newTaskEffort')?.value);
  const allocationStart = document.getElementById('newTaskAllocationStart')?.value;
  const allocationEnd = document.getElementById('newTaskAllocationEnd')?.value;
  const allocationStartPeriod = document.getElementById('newTaskAllocationStartPeriod')?.value || 'am';
  const allocationEndPeriod = document.getElementById('newTaskAllocationEndPeriod')?.value || 'pm';
  const dueDate = allocationEnd;
  const testHubLibraryId = document.getElementById('newTaskTestHubLibrary')?.value.trim() || '';
  const testHubPlanIds = getSelectedTestHubPlanIds();
  const testHubScopeMode = document.getElementById('newTaskTestHubScopeMode')?.value || 'all';
  const testHubScopeSuiteIds = testHubScopeMode === 'suite' ? getSelectedTestHubSuiteIds() : [];
  const testHubEffort = testHubPlanIds.length ? effort : null;
  const button = document.getElementById('saveTaskBtn');
  if (taskEditorStatusOnly) {
    if (status === 'blocked' && !blockedReason) { showToast('请填写阻塞原因', 'error'); return; }
    if (status === 'done' && !completionNote) { showToast('请填写完成说明', 'error'); return; }
    button.disabled = true;
    try {
      const { data, error } = await sb.rpc('update_qa_task_status', {
        target_task_id: editingQaTaskId,
        status_payload: {
          status,
          blocked_reason: status === 'blocked' ? blockedReason : null,
          blocked_owner_id: status === 'blocked' ? blockedOwnerId : null,
          blocked_until: status === 'blocked' ? blockedUntil : null,
          completion_note: status === 'done' ? completionNote : null
        }
      });
      if (error) throw error;
      if (!data) throw new Error('未找到可更新的工作事项');
      editingQaTaskId = null;
      closeNewTaskModal();
      showToast(existingTask && getTaskTestHubPlanIds(existingTask).length ? '状态已保存；下次 TestHub 同步会按执行进度自动校准' : '任务状态已更新');
      if (currentPage === 'tasks') await refreshTaskRecords();
      else await loadDashboardData(++dashboardLoadToken);
    } catch (error) {
      console.error('[dashboard] save task status failed:', error);
      showToast('状态保存失败：' + error.message, 'error');
    } finally {
      button.disabled = false;
    }
    return;
  }
  if (!title) { showToast('请填写任务标题', 'error'); return; }
  if (!releaseId) { showToast('请选择所属版本', 'error'); return; }
  const releaseProjectId = taskReleaseLinkCache.get(releaseId)?.project_id || '';
  const planProjectId = taskPortfolioLinkCache.get(portfolioPlanId)?.project_id || '';
  if (!releaseProjectId || (portfolioPlanId && planProjectId !== releaseProjectId)) {
    syncTaskProjectLink();
    showToast(!releaseProjectId ? '所选版本尚未归属项目，请先在项目中心完善版本归属' : '自动匹配到的月度人力规划与版本项目不一致，请刷新后重试', 'error'); return;
  }
  if (!Number.isInteger(testRound) || testRound < 1 || testRound > 99) { showToast('测试轮次必须是 1 到 99 的整数', 'error'); return; }
  if (!Number.isFinite(effort) || effort <= 0) { showToast('预估人天必须大于 0', 'error'); return; }
  if (!assigneeIds.length) { showToast('请至少选择 1 位负责人', 'error'); return; }
  if (status === 'blocked' && !blockedReason) { showToast('请填写阻塞原因', 'error'); return; }
  if (status === 'done' && !completionNote) { showToast('请填写完成说明', 'error'); return; }
  const allocations = getAssigneeAllocations();
  if (allocations.length !== assigneeIds.length || allocations.some(item => !Number.isFinite(item.allocated_effort) || item.allocated_effort <= 0)) {
    showToast('请为每位负责人填写大于 0 的分配人天', 'error'); return;
  }
  const allocationTotal = allocations.reduce((sum, item) => sum + item.allocated_effort, 0);
  if (Math.abs(allocationTotal - effort) > 0.011) {
    showToast(`成员分配合计 ${allocationTotal.toFixed(2)} 人天，必须等于事件总人天 ${effort.toFixed(2)}`, 'error'); return;
  }
  if (!allocationStart || !allocationEnd || allocationEnd < allocationStart) {
    showToast('截止日期不能早于资源开始日', 'error'); return;
  }
  if (!resourceWorkDates(allocationStart, allocationEnd).length) {
    showToast('所选资源区间没有可用工作日', 'error'); return;
  }
  if (!resourceWorkSlots(allocationStart, allocationEnd, allocationStartPeriod, allocationEndPeriod).length) {
    showToast('开始和截止时段顺序不正确', 'error'); return;
  }
  if ((testHubLibraryId || testHubPlanIds.length) && (!testHubLibraryId || !testHubPlanIds.length)) {
    showToast('关联 TestHub 时需要同时选择用例库和至少一个计划', 'error'); return;
  }
  if (testHubPlanIds.length && testHubScopeMode === 'suite' && !testHubScopeSuiteIds.length) {
    showToast('按模块计算时请至少选择一个 TestHub 模块', 'error'); return;
  }

  button.disabled = true;
  try {
    const due = new Date(`${dueDate}T${allocationEndPeriod === 'am' ? '12:00:00' : '18:00:00'}`);
    const payload = {
      title,
      description,
      priority,
      task_type: taskType,
      status,
      test_round: testRound,
      release_id: releaseId,
      project_id: releaseProjectId,
      portfolio_plan_id: portfolioPlanId,
      prd_id: editingQaTaskPrdId,
      requirement_id: editingQaTaskRequirementId,
      blocked_reason: status === 'blocked' ? blockedReason : null,
      blocked_owner_id: status === 'blocked' ? blockedOwnerId : null,
      blocked_until: status === 'blocked' ? blockedUntil : null,
      completion_note: status === 'done' ? completionNote : null,
      completed_at: status === 'done' ? (existingTask?.completed_at || new Date().toISOString()) : null,
      assignee_id: assigneeIds[0],
      due_date: due.toISOString(),
      source: existingTask?.source || 'manual',
      related_type: existingTask?.related_type || null,
      related_id: existingTask?.related_id || null,
      external_id: existingTask?.external_id || null,
      external_url: existingTask?.external_url || null,
      effort_person_days: effort,
      allocation_start_date: allocationStart,
      allocation_end_date: allocationEnd,
      allocation_start_period: allocationStartPeriod,
      allocation_end_period: allocationEndPeriod,
      testhub_library_id: testHubLibraryId || null,
      testhub_plan_id: testHubPlanIds[0] || null,
      testhub_plan_ids: testHubPlanIds,
      testhub_effort_person_days: testHubEffort,
      testhub_scope_mode: testHubPlanIds.length ? testHubScopeMode : 'all',
      testhub_scope_suite_ids: testHubPlanIds.length ? testHubScopeSuiteIds : []
    };
    const { data, error } = await sb.rpc('save_qa_task_workflow', {
      task_payload: { ...payload, id:editingQaTaskId || null },
      assignee_payload: allocations
    });
    if (error) throw error;
    if (!data) throw new Error('未找到可保存的工作事项');
    const wasEditing = Boolean(editingQaTaskId);
    editingQaTaskId = null;
    closeNewTaskModal();
    showToast(wasEditing ? '工作事项已更新' : '待办已创建');
    if (currentPage === 'tasks') await refreshTaskRecords();
    else await loadDashboardData(++dashboardLoadToken);
  } catch (error) {
    console.error('[dashboard] save task failed:', error);
    showToast('保存失败：' + error.message, 'error');
  } finally {
    button.disabled = false;
  }
}

const dashboardCompletingTaskIds = new Set();

async function completeQaTask(id, button) {
  if (dashboardCompletingTaskIds.has(id)) return;
  dashboardCompletingTaskIds.add(id);
  if (button) button.disabled = true;
  try {
    await openTaskFromDashboard(id, 'edit');
    const status = document.getElementById('newTaskStatus');
    if (status && !taskEditorReadOnly) {
      status.value = 'done';
      toggleTaskWorkflowFields();
      setTimeout(() => document.getElementById('newTaskCompletionNote')?.focus(), 0);
      showToast('请填写完成说明后保存');
    }
  } catch (error) {
    console.error('[dashboard] complete task failed:', error);
    showToast('打开任务失败：' + error.message, 'error');
  } finally {
    dashboardCompletingTaskIds.delete(id);
    if (button?.isConnected) button.disabled = false;
  }
}

async function copyTodaySummary() {
  if (!dashboardSnapshot) { showToast('数据仍在加载，请稍后重试', 'error'); return; }
  const { activeRelease, activeReleases = activeRelease ? [activeRelease] : [], todayTasks, risks } = dashboardSnapshot;
  const lines = [
    `Hannto QA 今日摘要 · ${new Date().toLocaleDateString('zh-CN')}`,
    `当前版本：${activeReleases.length ? activeReleases.map(release => `${releasePlatformText(release.platform)} ${release.name || release.version}`).join(' · ') : '暂未设置'}`,
    `今日待办：${todayTasks.length} 项`,
    ...todayTasks.slice(0, 5).map(task => `- [${task.priority}] ${task.title}`),
    `风险提醒：${risks.length} 项`,
    ...risks.slice(0, 5).map(risk => `- [${risk.level === 'high' ? '高' : risk.level === 'medium' ? '中' : '低'}] ${risk.title}`)
  ];
  const summary = lines.join('\n');
  try {
    await navigator.clipboard.writeText(summary);
    showToast('今日摘要已复制');
  } catch (error) {
    console.error('[dashboard] clipboard failed:', error);
    showToast('复制失败，请检查浏览器剪贴板权限', 'error');
  }
}

async function openRequirementTask(requirement) {
  if (!requirement?.id) return;
  const item = document.querySelector(`.sb-item[onclick*="'tasks'"]`);
  if (!item) { showToast('未找到工作事项入口', 'error'); return; }
  nav(item, 'tasks');
  for (let attempt = 0; attempt < 60 && !document.getElementById('newTaskModal'); attempt += 1) {
    await new Promise(resolve => setTimeout(resolve, 100));
  }
  if (!document.getElementById('newTaskModal')) { showToast('工作事项页面加载失败，请重试', 'error'); return; }
  await openNewTaskModal();
  editingQaTaskPrdId = requirement.prd_id || null;
  editingQaTaskRequirementId = requirement.id;
  const nextRound = Number(requirement.next_round || 1);
  document.getElementById('taskModalTitle').textContent = '从验收范围创建工作事项';
  document.getElementById('saveTaskBtnText').textContent = '创建关联事项';
  document.getElementById('newTaskTitle').value = `[验收][第${nextRound}轮] ${requirement.title || requirement.prd_title || ''}`;
  document.getElementById('newTaskRound').value = String(nextRound);
  document.getElementById('newTaskDescription').value = [requirement.prd_title ? `所属 PRD：${requirement.prd_title}` : '', requirement.description || ''].filter(Boolean).join('\n');
  document.getElementById('newTaskType').value = 'test_execution';
  if (requirement.release_id) await loadTaskReleases(requirement.release_id);
  if (requirement.release_date) {
    const today = dashboardTodayInputValue();
    const deadline = requirement.release_date < today ? today : requirement.release_date;
    document.getElementById('newTaskAllocationEnd').value = deadline;
  }
  syncTaskProjectLink();
  const context = document.getElementById('requirementTaskContext');
  if (context) {
    context.style.display = '';
    context.textContent = `已关联验收范围：${requirement.title || '未命名验收范围'}。事项状态会自动汇总到 PRD 交付进度。`;
  }
  distributeAssigneeEffortEvenly();
}

async function openPrdTask(prd) {
  if (!prd?.id) return;
  const item = document.querySelector(`.sb-item[onclick*="'tasks'"]`);
  if (!item) { showToast('未找到工作事项入口', 'error'); return; }
  nav(item, 'tasks');
  for (let attempt = 0; attempt < 60 && !document.getElementById('newTaskModal'); attempt += 1) {
    await new Promise(resolve => setTimeout(resolve, 100));
  }
  if (!document.getElementById('newTaskModal')) { showToast('工作事项页面加载失败，请重试', 'error'); return; }
  await openNewTaskModal();
  editingQaTaskPrdId = prd.id;
  editingQaTaskRequirementId = null;
  const nextRound = Number(prd.next_round || 1);
  document.getElementById('taskModalTitle').textContent = '从 PRD 创建工作事项';
  document.getElementById('saveTaskBtnText').textContent = '创建关联事项';
  document.getElementById('newTaskTitle').value = `[PRD][第${nextRound}轮] ${prd.title || ''}`;
  document.getElementById('newTaskRound').value = String(nextRound);
  document.getElementById('newTaskDescription').value = prd.notes || '';
  document.getElementById('newTaskType').value = 'test_execution';
  if (prd.release_id) await loadTaskReleases(prd.release_id);
  if (prd.release_date) {
    const today = dashboardTodayInputValue();
    document.getElementById('newTaskAllocationEnd').value = prd.release_date < today ? today : prd.release_date;
  }
  syncTaskProjectLink();
  const context = document.getElementById('requirementTaskContext');
  if (context) {
    context.style.display = '';
    context.textContent = `已直接关联 PRD：${prd.title || '未命名 PRD'}。无需额外拆分验收范围。`;
  }
  distributeAssigneeEffortEvenly();
}

window.addEventListener('message', event => {
  if (event.origin !== window.location.origin) return;
  const action = event.data?.type === 'open-requirement-task'
    ? openRequirementTask(event.data.requirement)
    : event.data?.type === 'open-prd-task'
      ? openPrdTask(event.data.prd)
      : null;
  if (!action) return;
  action.catch(error => {
    console.error('[requirement] open task failed:', error);
    showToast('创建关联工作事项失败：' + error.message, 'error');
  });
});

function navTo(page) {
  const item = document.querySelector(`.sb-item[onclick*="'${page}'"]`);
  if (item) nav(item, page);
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}
