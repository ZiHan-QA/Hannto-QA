<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRD 管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<style>
:root {
  --pink:#FF6B9D; --yellow:#FFDA79; --teal:#00D2D3;
  --purple:#5F27CD; --mint:#1DD1A1; --cream:#FFF9F0;
  --dark:#1A1035; --text:#3d1a00; --sub:#9a6a40;
  --border:rgba(255,182,193,0.25);
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Noto Sans SC',sans-serif; background:var(--cream); color:var(--text); padding:20px; }

/* 统计卡 */
.stat-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
.sc { border-radius:12px; padding:13px 14px; }
.sc.p{background:#FFE8F2;} .sc.y{background:#FFF3CC;} .sc.t{background:#CCF5EE;} .sc.pu{background:#EDE8FF;}
.sc-icon { width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; margin-bottom:7px; }
.sc-icon.p{background:var(--pink);} .sc-icon.y{background:#e0a000;} .sc-icon.t{background:var(--teal);} .sc-icon.pu{background:var(--purple);}
.sc-icon i { font-size:13px; color:#fff; }
.sc-val { font-size:20px; font-weight:600; color:var(--text); line-height:1; margin-bottom:2px; }
.sc-label { font-size:10px; color:var(--sub); }

/* 工具栏 */
.toolbar { display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.search-box { display:flex; align-items:center; gap:8px; background:#fff; border:0.5px solid var(--border); border-radius:10px; padding:7px 12px; flex:1; max-width:280px; }
.search-box i { color:var(--sub); font-size:14px; flex-shrink:0; }
.search-box input { border:none; outline:none; font-size:13px; color:var(--text); background:none; width:100%; font-family:'Noto Sans SC',sans-serif; }
.search-box input::placeholder { color:rgba(157,106,64,0.4); }
.filter-select { border:0.5px solid var(--border); border-radius:10px; padding:7px 12px; font-size:12px; color:var(--sub); background:#fff; outline:none; cursor:pointer; font-family:'Noto Sans SC',sans-serif; }
.btn { padding:7px 14px; border-radius:10px; border:none; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:5px; transition:all 0.15s; font-family:'Noto Sans SC',sans-serif; white-space:nowrap; }
.btn-primary { background:var(--pink); color:#fff; box-shadow:0 4px 12px rgba(255,107,157,0.25); }
.btn-primary:hover { transform:translateY(-1px); }
.btn-outline { background:#fff; color:var(--sub); border:0.5px solid var(--border); }
.btn-outline:hover { border-color:var(--pink); color:var(--pink); }
.btn-purple { background:#EDE8FF; color:var(--purple); }
.btn-purple:hover { background:var(--purple); color:#fff; }
.ml-auto { margin-left:auto; }

/* PRD 卡片列表 */
.prd-grid { display:flex; flex-direction:column; gap:10px; }
.version-section { background:#fff; border:0.5px solid var(--border); border-radius:14px; overflow:hidden; }
.version-section.current { border-color:rgba(95,39,205,0.35); box-shadow:0 5px 18px rgba(95,39,205,0.08); }
.version-head { display:flex; align-items:center; gap:12px; padding:14px 16px; background:linear-gradient(90deg,#fff,#fffaf4); cursor:pointer; }
.version-section.current .version-head { background:linear-gradient(90deg,#f7f3ff,#fff); }
.version-name { font-size:14px; font-weight:600; color:var(--text); display:flex; align-items:center; gap:7px; }
.version-current { font-size:10px; color:#fff; background:var(--purple); padding:2px 7px; border-radius:8px; }
.version-meta { display:flex; gap:12px; flex-wrap:wrap; color:var(--sub); font-size:10px; }
.version-meta .risk { color:#c0265a; }
.version-progress { margin-left:auto; min-width:150px; }
.version-progress-text { display:flex; justify-content:space-between; font-size:10px; color:var(--sub); margin-bottom:4px; }
.version-progress-bar { height:5px; border-radius:5px; background:#F1EFE8; overflow:hidden; }
.version-progress-bar span { display:block; height:100%; border-radius:5px; background:linear-gradient(90deg,var(--purple),var(--pink)); }
.version-chevron { color:var(--sub); font-size:16px; }
.version-body { border-top:0.5px solid var(--border); }
.version-section.collapsed .version-body { display:none; }
.prd-table-head,.prd-row { display:grid; grid-template-columns:minmax(260px,2fr) 90px 105px 120px 95px 130px; align-items:center; gap:10px; }
.prd-table-head { padding:8px 16px; color:var(--sub); font-size:10px; background:#fffdfa; border-bottom:0.5px solid var(--border); }
.prd-card { border-bottom:0.5px solid var(--border); }
.prd-card:last-child { border-bottom:0; }
.prd-row { padding:11px 16px; cursor:pointer; transition:background 0.15s; }
.prd-row:hover { background:#fffaf6; }
.prd-card.expanded .prd-row { background:#fff8fb; }
.prd-main { min-width:0; }
.prd-main-title { font-size:12px; font-weight:500; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.prd-main-meta { margin-top:3px; color:var(--sub); font-size:10px; display:flex; gap:9px; flex-wrap:wrap; }
.prd-cell { font-size:11px; color:var(--text); }
.prd-cell small { display:block; color:var(--sub); font-size:9px; margin-top:2px; }
.delivery-cell { color:var(--purple); }
.risk-cell { color:#0F6E56; }
.risk-cell.has-risk { color:#c0265a; font-weight:500; }
.risk-cell.has-warning { color:#7a5a00; font-weight:500; }
.prd-task-button { border:0; border-radius:7px; padding:5px 8px; background:#EDE8FF; color:var(--purple); cursor:pointer; font:inherit; font-size:10px; display:flex; align-items:center; gap:3px; white-space:nowrap; }
.prd-task-button:hover { background:var(--purple); color:#fff; }
.prd-card {
  background:#fff;
}
.prd-card:hover { background:#fffaf6; }
.prd-card-head { display:flex; align-items:flex-start; gap:12px; }
.prd-icon { width:38px; height:38px; border-radius:10px; background:#EDE8FF; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.prd-icon i { font-size:18px; color:var(--purple); }
.prd-info { flex:1; min-width:0; }
.prd-title { font-size:14px; font-weight:500; color:var(--text); margin-bottom:4px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.prd-meta { font-size:11px; color:var(--sub); display:flex; gap:12px; flex-wrap:wrap; }
.prd-meta span { display:flex; align-items:center; gap:4px; }
.prd-actions { display:flex; gap:6px; flex-shrink:0; }
.prd-body { padding:14px 16px 16px; border-top:0.5px solid var(--border); display:none; background:#fff; }
.prd-card.expanded .prd-body { display:block; }

.tag { font-size:10px; padding:2px 8px; border-radius:10px; font-weight:500; white-space:nowrap; }
.tag-进行中 { background:#CCF5EE; color:#0F6E56; }
.tag-已完成 { background:#EDE8FF; color:var(--purple); }
.tag-暂停   { background:#FFF3CC; color:#7a5a00; }
.tag-已归档 { background:#F1EFE8; color:#5F5E5A; }

/* 需求点 */
.req-head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.req-title { font-size:12px; font-weight:500; color:var(--text); }
.req-list { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
.req-item {
  display:flex; align-items:flex-start; gap:10px;
  background:var(--cream); border-radius:9px; padding:10px 12px;
  border:0.5px solid transparent; transition:all 0.15s;
}
.req-item:hover { border-color:var(--border); }
.req-num { width:20px; height:20px; border-radius:6px; background:#EDE8FF; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:500; color:var(--purple); flex-shrink:0; margin-top:1px; }
.req-content { flex:1; min-width:0; }
.req-item-title { font-size:12px; font-weight:500; color:var(--text); margin-bottom:3px; }
.req-item-desc  { font-size:11px; color:var(--sub); line-height:1.5; }
.req-item-meta  { display:flex; gap:8px; margin-top:5px; flex-wrap:wrap; }
.req-case { font-size:10px; background:#E6F1FB; color:#185FA5; padding:2px 7px; border-radius:6px; display:flex; align-items:center; gap:4px; }
.req-priority { font-size:10px; padding:2px 7px; border-radius:6px; }
.req-priority-高 { background:#FAECE7; color:#993C1D; }
.req-priority-中 { background:#FFF3CC; color:#7a5a00; }
.req-priority-低 { background:#CCF5EE; color:#0F6E56; }
.req-status { font-size:10px; padding:2px 7px; border-radius:6px; }
.req-status-待测试   { background:#FFE8F2; color:#c0265a; }
.req-status-测试中   { background:#FFF3CC; color:#7a5a00; }
.req-status-已完成   { background:#CCF5EE; color:#0F6E56; }
.req-status-已跳过   { background:#F1EFE8; color:#5F5E5A; }
.req-delivery { margin-top:7px; padding:8px 10px; border-radius:8px; background:#fff; border:0.5px solid var(--border); display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:10px; color:var(--sub); }
.req-delivery strong { color:var(--text); font-weight:500; }
.req-delivery .risk { color:#c0265a; }
.req-delivery .ok { color:#0F6E56; }
.req-create-task { margin-left:auto; border:0; border-radius:7px; padding:5px 9px; background:#EDE8FF; color:var(--purple); cursor:pointer; font:inherit; font-weight:500; }
.req-create-task:hover { background:var(--purple); color:#fff; }
.req-del { background:none; border:none; cursor:pointer; color:rgba(157,106,64,0.4); font-size:13px; padding:2px; border-radius:5px; transition:all 0.15s; flex-shrink:0; margin-top:1px; }
.req-del:hover { color:#E24B4A; background:rgba(226,75,74,0.08); }

/* AI 拆解区 */
.ai-box { background:linear-gradient(135deg,#1A1035,#2d1a5e); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
.ai-box-title { font-size:12px; color:rgba(255,255,255,0.6); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
.ai-box-title i { color:var(--pink); }
.ai-textarea { width:100%; background:rgba(255,255,255,0.07); border:0.5px solid rgba(255,255,255,0.12); border-radius:9px; padding:10px 12px; font-size:12px; color:#fff; outline:none; resize:vertical; min-height:80px; font-family:'Noto Sans SC',sans-serif; line-height:1.6; }
.ai-textarea::placeholder { color:rgba(255,255,255,0.25); }
.ai-btn { margin-top:8px; padding:7px 16px; border-radius:9px; border:none; background:var(--pink); color:#fff; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:6px; font-family:'Noto Sans SC',sans-serif; transition:all 0.15s; }
.ai-btn:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(255,107,157,0.3); }
.ai-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
.spinner-sm { width:12px; height:12px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.6s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }

/* 变更记录 */
.change-list { display:flex; flex-direction:column; gap:6px; }
.change-item { display:flex; gap:10px; font-size:11px; }
.change-dot { width:6px; height:6px; border-radius:50%; background:var(--pink); flex-shrink:0; margin-top:4px; }
.change-text { color:var(--text); flex:1; }
.change-time { color:var(--sub); white-space:nowrap; }

.empty { padding:50px 20px; text-align:center; color:var(--sub); }
.empty i { font-size:32px; opacity:0.3; display:block; margin-bottom:8px; }

/* 抽屉 */
.drawer-overlay { position:fixed; inset:0; background:rgba(26,16,53,0.4); z-index:200; opacity:0; pointer-events:none; transition:opacity 0.25s; }
.drawer-overlay.show { opacity:1; pointer-events:all; }
.drawer { position:fixed; right:-500px; top:0; bottom:0; width:500px; background:#fff; z-index:201; box-shadow:-8px 0 32px rgba(0,0,0,0.12); transition:right 0.3s cubic-bezier(0.16,1,0.3,1); display:flex; flex-direction:column; }
.drawer.open { right:0; }
.drawer-head { padding:18px 22px; border-bottom:0.5px solid var(--border); display:flex; align-items:center; gap:10px; flex-shrink:0; }
.drawer-title { font-size:14px; font-weight:500; color:var(--text); }
.drawer-close { margin-left:auto; background:none; border:none; cursor:pointer; color:var(--sub); font-size:18px; border-radius:8px; padding:4px; transition:all 0.15s; }
.drawer-close:hover { color:var(--pink); }
.drawer-body { flex:1; overflow-y:auto; padding:18px 22px; }
.drawer-foot { padding:14px 22px; border-top:0.5px solid var(--border); display:flex; gap:10px; flex-shrink:0; }
.form-group { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
.form-group label { font-size:11px; color:var(--sub); font-weight:500; }
.form-group input,.form-group select,.form-group textarea { border:0.5px solid var(--border); border-radius:9px; padding:8px 11px; font-size:13px; color:var(--text); outline:none; transition:all 0.15s; background:#fff; font-family:'Noto Sans SC',sans-serif; }
.form-group input:focus,.form-group select:focus,.form-group textarea:focus { border-color:var(--pink); box-shadow:0 0 0 3px rgba(255,107,157,0.1); }
.form-group textarea { resize:vertical; min-height:60px; }
.form-row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-section { font-size:11px; color:var(--sub); letter-spacing:0.5px; margin:14px 0 8px; padding-bottom:5px; border-bottom:0.5px solid var(--border); }
.dingtalk-link { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--teal); margin-top:4px; cursor:pointer; text-decoration:none; }
.dingtalk-link:hover { color:var(--purple); }

/* 需求点编辑 */
.req-edit-item { display:flex; flex-direction:column; gap:6px; background:var(--cream); border-radius:9px; padding:10px 12px; margin-bottom:8px; position:relative; }
.req-edit-item input,.req-edit-item select,.req-edit-item textarea { border:0.5px solid var(--border); border-radius:7px; padding:6px 10px; font-size:12px; color:var(--text); outline:none; background:#fff; font-family:'Noto Sans SC',sans-serif; }
.req-edit-item textarea { resize:vertical; min-height:48px; }
.req-edit-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; }
.req-edit-del { position:absolute; top:8px; right:8px; background:none; border:none; cursor:pointer; color:rgba(157,106,64,0.4); font-size:14px; border-radius:5px; padding:2px; transition:all 0.15s; }
.req-edit-del:hover { color:#E24B4A; }
.add-req-btn { width:100%; padding:8px; border-radius:9px; border:1px dashed var(--border); background:none; color:var(--sub); font-size:12px; cursor:pointer; transition:all 0.15s; font-family:'Noto Sans SC',sans-serif; display:flex; align-items:center; justify-content:center; gap:6px; }
.add-req-btn:hover { border-color:var(--pink); color:var(--pink); }

.action-btn { background:none; border:none; cursor:pointer; color:var(--sub); font-size:14px; padding:3px; border-radius:6px; transition:all 0.15s; }
.action-btn:hover { background:rgba(255,107,157,0.1); color:var(--pink); }
.action-btn.del:hover { background:rgba(226,75,74,0.1); color:#E24B4A; }
@media (max-width:900px) {
  body { padding:12px; }
  .stat-row { grid-template-columns:repeat(2,1fr); }
  .prd-table-head { display:none; }
  .prd-row { grid-template-columns:1fr auto; gap:8px; }
  .prd-cell { display:flex; gap:5px; align-items:center; }
  .prd-cell::before { content:attr(data-label); color:var(--sub); font-size:9px; }
  .prd-row .prd-cell:nth-of-type(n+2) { grid-column:1; }
  .prd-actions { grid-column:2; grid-row:1; }
  .version-progress { display:none; }
  .version-head { align-items:flex-start; }
  .version-meta { gap:6px 10px; }
}
</style>
</head>
<body>

<!-- 统计 -->
<div class="stat-row">
  <div class="sc p"><div class="sc-icon p"><i class="ti ti-file-description"></i></div><div class="sc-val" id="s-total">-</div><div class="sc-label">PRD 总数</div></div>
  <div class="sc y"><div class="sc-icon y"><i class="ti ti-loader"></i></div><div class="sc-val" id="s-active">-</div><div class="sc-label">进行中</div></div>
  <div class="sc t"><div class="sc-icon t"><i class="ti ti-list-check"></i></div><div class="sc-val" id="s-reqs">-</div><div class="sc-label">验收范围总数（可选）</div></div>
  <div class="sc pu"><div class="sc-icon pu"><i class="ti ti-check"></i></div><div class="sc-val" id="s-done">-</div><div class="sc-label">已完成验收范围</div></div>
</div>

<!-- 工具栏 -->
<div class="toolbar">
  <div class="search-box">
    <i class="ti ti-search"></i>
    <input type="text" id="searchInput" placeholder="搜索 PRD 标题、版本..." oninput="renderList()">
  </div>
  <select class="filter-select" id="statusFilter" onchange="renderList()">
    <option value="">全部状态</option>
    <option>进行中</option><option>已完成</option><option>暂停</option><option>已归档</option>
  </select>
  <select class="filter-select" id="versionFilter" onchange="renderList()"><option value="">全部版本</option></select>
  <select class="filter-select" id="deliveryFilter" onchange="renderList()"><option value="">全部交付状态</option><option value="risk">只看有风险</option><option value="incomplete">只看未完成</option><option value="done">只看已完成</option></select>
  <button class="btn btn-primary ml-auto" onclick="openDrawer()"><i class="ti ti-plus"></i>新增 PRD</button>
</div>

<!-- PRD 列表 -->
<div class="prd-grid" id="prdList"></div>

<!-- 抽屉：新增/编辑 PRD -->
<div class="drawer-overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <i class="ti ti-file-description" style="color:var(--purple);font-size:16px;"></i>
    <span class="drawer-title" id="drawerTitle">新增 PRD</span>
    <button class="drawer-close" onclick="closeDrawer()"><i class="ti ti-x"></i></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot">
    <button class="btn btn-primary" style="flex:1;" onclick="savePrd()"><i class="ti ti-check"></i>保存</button>
    <button class="btn btn-outline" onclick="closeDrawer()">取消</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://pgpnyrglrromqqjnvaix.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBncG55cmdscnJvbXFxam52YWl4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2MjY2OTgsImV4cCI6MjA5NjIwMjY5OH0.TmkrxS2mY_95aBC2UL2BARLU7gqNb_gSpHP6ynofDsE';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

// API Key 从 localStorage 读取
function getApiKey() {
  return localStorage.getItem('aliyun_api_key') || '';
}

function promptApiKey() {
  const key = prompt('请输入阿里云 API Key（将保存在本地浏览器）：', getApiKey());
  if (key?.trim()) {
    localStorage.setItem('aliyun_api_key', key.trim());
    return key.trim();
  }
  return '';
}

let allPrds = [];
let allReqs = [];
let allReleases = [];
let requirementTasks = new Map();
let prdTasks = new Map();
let taskSnapshots = new Map();
let requirementDefects = new Map();
let prdDefects = new Map();
let editId = null;
let expandedId = null;
let editReqs = [];

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.top.location.href = 'index.html';
    return;
  }

  await loadStats();
  await loadData();
}

async function loadStats() {
  try {
    const [total, active, reqs, done] = await Promise.all([
      sb.from('prds').select('*',{count:'exact',head:true}),
      sb.from('prds').select('*',{count:'exact',head:true}).eq('status','进行中'),
      sb.from('requirements').select('*',{count:'exact',head:true}),
      sb.from('requirements').select('*',{count:'exact',head:true}).eq('status','已完成'),
    ]);
    document.getElementById('s-total').textContent  = total.count ?? 0;
    document.getElementById('s-active').textContent = active.count ?? 0;
    document.getElementById('s-reqs').textContent   = reqs.count ?? 0;
    document.getElementById('s-done').textContent   = done.count ?? 0;
  } catch(e) { console.error(e); }
}

async function loadData() {
  const [prdsResult, reqsResult, releasesResult, tasksResult, snapshotsResult, defectsResult] = await Promise.all([
    sb.from('prds').select('*').order('created_at',{ascending:false}),
    sb.from('requirements').select('*').order('created_at',{ascending:true}),
    sb.from('releases').select('id,version,name,platform,status,planned_release_date').order('created_at',{ascending:false}),
    sb.from('qa_tasks').select('id,title,status,test_round,prd_id,requirement_id,release_id,due_date,testhub_plan_ids'),
    sb.from('task_testhub_progress').select('task_id,total_cases,executed_cases,progress_ratio,sync_status'),
    sb.from('quality_defects').select('id,prd_id,requirement_id,status,exposed_stage')
  ]);
  for (const result of [prdsResult, reqsResult, releasesResult, tasksResult, snapshotsResult, defectsResult]) {
    if (result.error) throw result.error;
  }
  allPrds = prdsResult.data || [];
  allReqs = reqsResult.data || [];
  allReleases = releasesResult.data || [];
  requirementTasks = new Map();
  prdTasks = new Map();
  (tasksResult.data || []).forEach(task => {
    if (task.requirement_id) {
      const tasks = requirementTasks.get(task.requirement_id) || [];
      tasks.push(task);
      requirementTasks.set(task.requirement_id, tasks);
    }
    if (task.prd_id) {
      const tasks = prdTasks.get(task.prd_id) || [];
      tasks.push(task);
      prdTasks.set(task.prd_id, tasks);
    }
  });
  taskSnapshots = new Map((snapshotsResult.data || []).map(item => [item.task_id, item]));
  requirementDefects = new Map();
  prdDefects = new Map();
  (defectsResult.data || []).forEach(defect => {
    if (defect.requirement_id) {
      const defects = requirementDefects.get(defect.requirement_id) || [];
      defects.push(defect);
      requirementDefects.set(defect.requirement_id, defects);
    }
    if (defect.prd_id) {
      const defects = prdDefects.get(defect.prd_id) || [];
      defects.push(defect);
      prdDefects.set(defect.prd_id, defects);
    }
  });
  refreshVersionFilter();
  renderList();
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
}

function releaseLabel(releaseId) {
  const release = allReleases.find(item => item.id === releaseId);
  if (!release) return '';
  return `${release.name || release.version}${release.platform ? ` · ${release.platform}` : ''}`;
}

function requirementDelivery(r) {
  const tasks = requirementTasks.get(r.id) || [];
  const active = tasks.filter(task => task.status !== 'cancelled');
  const done = active.filter(task => task.status === 'done').length;
  const blocked = active.filter(task => task.status === 'blocked').length;
  const overdue = active.filter(task => ['todo','in_progress','blocked'].includes(task.status) && task.due_date && task.due_date.slice(0,10) < new Date().toISOString().slice(0,10)).length;
  const snapshots = active.map(task => taskSnapshots.get(task.id)).filter(Boolean);
  const totalCases = snapshots.reduce((sum,item) => sum + Number(item.total_cases || 0), 0);
  const executedCases = snapshots.reduce((sum,item) => sum + Number(item.executed_cases || 0), 0);
  const defects = requirementDefects.get(r.id) || [];
  const openDefects = defects.filter(item => !['verified','closed'].includes(item.status)).length;
  const risk = blocked || overdue || openDefects;
  return `<div class="req-delivery"><strong>${active.length ? `交付 ${done}/${active.length} 项` : '尚未创建工作事项'}</strong>${totalCases ? `<span>TestHub ${executedCases}/${totalCases}</span>` : ''}${blocked ? `<span class="risk">阻塞 ${blocked}</span>` : ''}${overdue ? `<span class="risk">逾期 ${overdue}</span>` : ''}${defects.length ? `<span class="${openDefects ? 'risk' : 'ok'}">关联 BUG ${defects.length}</span>` : ''}${active.length && !risk && done === active.length ? '<span class="ok">已完成交付</span>' : ''}<button class="req-create-task" onclick="createTaskForRequirement(event,'${r.id}')">${active.length ? '继续拆分任务' : '创建工作事项'}</button></div>`;
}

function createTaskForRequirement(event, requirementId) {
  event.stopPropagation();
  const requirement = allReqs.find(item => item.id === requirementId);
  const prd = requirement ? allPrds.find(item => item.id === requirement.prd_id) : null;
  if (!requirement || !prd) return;
  const nextRound = Math.max(0,...(requirementTasks.get(requirement.id) || []).map(task => Number(task.test_round || 1))) + 1;
  window.parent.postMessage({
    type:'open-requirement-task',
    requirement:{ id:requirement.id, prd_id:prd.id, title:requirement.title, description:requirement.description || '', prd_title:prd.title, release_id:prd.release_id || null, release_date:prd.release_date || '', next_round:nextRound }
  }, window.location.origin);
}

function createTaskForPrd(event, prdId) {
  event.stopPropagation();
  const prd = allPrds.find(item => item.id === prdId);
  if (!prd) return;
  const directTasks = (prdTasks.get(prd.id) || []).filter(task => !task.requirement_id);
  const nextRound = Math.max(0,...directTasks.map(task => Number(task.test_round || 1))) + 1;
  window.parent.postMessage({
    type:'open-prd-task',
    prd:{ id:prd.id, title:prd.title, notes:prd.notes || '', release_id:prd.release_id || null, release_date:prd.release_date || '', next_round:nextRound }
  }, window.location.origin);
}

let collapsedVersionGroups = new Set();

function normalizeVersion(value) {
  return String(value || '').trim().replace(/^v/i, '').toLowerCase();
}

function prdVersionGroup(prd) {
  const directRelease = allReleases.find(release => release.id === prd.release_id);
  if (directRelease) return { key:`release:${directRelease.id}`, release:directRelease, label:releaseLabel(directRelease.id), current:directRelease.status === 'active', legacy:false };
  const version = normalizeVersion(prd.version);
  const matches = version ? allReleases.filter(release => normalizeVersion(release.version) === version) : [];
  if (matches.length === 1) {
    const release = matches[0];
    return { key:`release:${release.id}`, release, label:releaseLabel(release.id), current:release.status === 'active', legacy:true };
  }
  if (version) return { key:`legacy:${version}`, release:null, label:`v${prd.version}`, current:false, legacy:true };
  return { key:'unassigned', release:null, label:'未关联版本', current:false, legacy:false };
}

function prdDeliveryMetrics(prd) {
  const requirements = allReqs.filter(requirement => requirement.prd_id === prd.id);
  const tasks = [...new Map([...(prdTasks.get(prd.id) || []),...requirements.flatMap(requirement => requirementTasks.get(requirement.id) || [])].map(task => [task.id,task])).values()].filter(task => task.status !== 'cancelled');
  const defects = [...new Map([...(prdDefects.get(prd.id) || []),...requirements.flatMap(requirement => requirementDefects.get(requirement.id) || [])].map(defect => [defect.id,defect])).values()];
  const doneRequirements = requirements.filter(requirement => requirement.status === '已完成').length;
  const doneTasks = tasks.filter(task => task.status === 'done').length;
  const blocked = tasks.filter(task => task.status === 'blocked').length;
  const overdue = tasks.filter(task => ['todo','in_progress','blocked'].includes(task.status) && task.due_date && task.due_date.slice(0,10) < new Date().toISOString().slice(0,10)).length;
  const openDefects = defects.filter(defect => !['verified','closed'].includes(defect.status)).length;
  const unplanned = requirements.filter(requirement => !(requirementTasks.get(requirement.id) || []).some(task => task.status !== 'cancelled')).length;
  const needsTask = prd.status === '进行中' && tasks.length === 0 ? 1 : 0;
  const criticalRiskCount = blocked + overdue + openDefects;
  const riskCount = criticalRiskCount + (prd.status === '进行中' ? unplanned : 0) + needsTask;
  const maxRound = Math.max(0,...tasks.map(task => Number(task.test_round || 1)));
  return { requirements, tasks, doneRequirements, doneTasks, blocked, overdue, openDefects, unplanned, needsTask, criticalRiskCount, riskCount, maxRound, complete:tasks.length > 0 && doneTasks === tasks.length && (!requirements.length || doneRequirements === requirements.length) };
}

function refreshVersionFilter() {
  const select = document.getElementById('versionFilter');
  if (!select) return;
  const selected = select.value;
  const groups = [...new Map(allPrds.map(prd => { const group=prdVersionGroup(prd); return [group.key,group]; })).values()]
    .sort((a,b) => Number(b.current)-Number(a.current) || a.label.localeCompare(b.label,'zh-CN'));
  select.innerHTML = `<option value="">全部版本</option>${groups.map(group => `<option value="${escapeHtml(group.key)}">${escapeHtml(group.label)}${group.current?'（当前）':''}${group.key==='unassigned'?' · 待整理':''}</option>`).join('')}`;
  select.value = groups.some(group => group.key === selected) ? selected : '';
}

function toggleVersionGroup(key) {
  if (collapsedVersionGroups.has(key)) collapsedVersionGroups.delete(key);
  else collapsedVersionGroups.add(key);
  renderList();
}

function renderList() {
  const kw = document.getElementById('searchInput').value.toLowerCase();
  const st = document.getElementById('statusFilter').value;
  const version = document.getElementById('versionFilter')?.value || '';
  const delivery = document.getElementById('deliveryFilter')?.value || '';
  const data = allPrds.filter(p => {
    const mk = !kw || `${p.title||''}${p.version||''}${p.product||''}${p.author||''}`.toLowerCase().includes(kw);
    const ms = !st || p.status === st;
    const group = prdVersionGroup(p);
    const metrics = prdDeliveryMetrics(p);
    const mv = !version || group.key === version;
    const md = !delivery || (delivery === 'risk' && metrics.riskCount > 0) || (delivery === 'incomplete' && !metrics.complete) || (delivery === 'done' && metrics.complete);
    return mk && ms && mv && md;
  });
  const list = document.getElementById('prdList');
  if (!data.length) {
    list.innerHTML = `<div class="empty"><i class="ti ti-file-off"></i>暂无 PRD，点击右上角新增</div>`;
    return;
  }
  const grouped = new Map();
  data.forEach(prd => {
    const group = prdVersionGroup(prd);
    const row = grouped.get(group.key) || { ...group, prds:[] };
    row.prds.push(prd);
    grouped.set(group.key,row);
  });
  const groups = [...grouped.values()].sort((a,b) => Number(b.current)-Number(a.current) || (a.key==='unassigned'?1:0)-(b.key==='unassigned'?1:0) || String(b.release?.planned_release_date||'').localeCompare(String(a.release?.planned_release_date||'')) || b.label.localeCompare(a.label,'zh-CN'));
  list.innerHTML = groups.map(group => {
    const groupMetrics = group.prds.map(prd => prdDeliveryMetrics(prd));
    const totalRequirements = groupMetrics.reduce((sum,item) => sum + item.requirements.length,0);
    const doneRequirements = groupMetrics.reduce((sum,item) => sum + item.doneRequirements,0);
    const totalTasks = groupMetrics.reduce((sum,item) => sum + item.tasks.length,0);
    const doneTasks = groupMetrics.reduce((sum,item) => sum + item.doneTasks,0);
    const risks = groupMetrics.reduce((sum,item) => sum + item.riskCount,0);
    const collapsed = collapsedVersionGroups.has(group.key);
    const rows = group.prds.sort((a,b) => ({进行中:0,暂停:1,已完成:2,已归档:3}[a.status]??9)-({进行中:0,暂停:1,已完成:2,已归档:3}[b.status]??9) || String(b.updated_at||'').localeCompare(String(a.updated_at||''))).map(p => {
      const metrics = prdDeliveryMetrics(p);
      const isExpanded = expandedId === p.id;
      const riskParts = [metrics.blocked?`${metrics.blocked} 阻塞`:'',metrics.overdue?`${metrics.overdue} 逾期`:'',metrics.openDefects?`${metrics.openDefects} BUG`:'',metrics.needsTask?'待安排测试':'',p.status==='进行中'&&metrics.unplanned?`${metrics.unplanned} 个验收范围待安排`:''].filter(Boolean);
      const riskClass = metrics.criticalRiskCount ? 'has-risk' : riskParts.length ? 'has-warning' : '';
      return `<div class="prd-card ${isExpanded?'expanded':''}" id="card-${p.id}"><div class="prd-row" onclick="toggleExpand('${p.id}')"><div class="prd-main"><div class="prd-main-title" title="${escapeHtml(p.title)}">${escapeHtml(p.title)}</div><div class="prd-main-meta">${p.product?`<span>${escapeHtml(p.product)}</span>`:''}${p.author?`<span>负责人 ${escapeHtml(p.author)}</span>`:''}${p.release_date?`<span>上线 ${escapeHtml(p.release_date)}</span>`:''}${p.dingtalk_url?`<a href="${escapeHtml(p.dingtalk_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--teal);">钉钉文档</a>`:''}</div></div><div class="prd-cell" data-label="状态"><span class="tag tag-${p.status||'进行中'}">${escapeHtml(p.status||'进行中')}</span></div><div class="prd-cell" data-label="验收范围">${metrics.doneRequirements}/${metrics.requirements.length}<small>${metrics.unplanned?`${metrics.unplanned} 个未安排`:metrics.requirements.length?'可选验收范围':'无需拆分'}</small></div><div class="prd-cell delivery-cell" data-label="交付">${metrics.doneTasks}/${metrics.tasks.length}<small>${metrics.tasks.length?`已建至第 ${metrics.maxRound} 轮`:'尚未安排'}</small></div><div class="prd-cell risk-cell ${riskClass}" data-label="风险">${riskParts.join(' · ')||'正常'}</div><div class="prd-actions" onclick="event.stopPropagation()"><button class="prd-task-button" onclick="createTaskForPrd(event,'${p.id}')" title="${metrics.tasks.length?'新增下一轮工作事项':'直接创建工作事项'}"><i class="ti ti-square-plus"></i>${metrics.tasks.length?'下一轮':'建事项'}</button><button class="action-btn" onclick="openDrawer('${p.id}')" title="编辑"><i class="ti ti-edit"></i></button><button class="action-btn del" onclick="deletePrd('${p.id}')" title="删除"><i class="ti ti-trash"></i></button><button class="action-btn" onclick="toggleExpand('${p.id}')" title="${isExpanded?'收起':'展开'}"><i class="ti ti-chevron-${isExpanded?'up':'down'}"></i></button></div></div><div class="prd-body">${renderReqBody(p.id,metrics.requirements)}</div></div>`;
    }).join('');
    return `<section class="version-section ${group.current?'current':''} ${collapsed?'collapsed':''}"><div class="version-head" onclick="toggleVersionGroup('${group.key}')"><div><div class="version-name"><i class="ti ti-rocket"></i>${escapeHtml(group.label)}${group.current?'<span class="version-current">当前版本</span>':''}${group.legacy?'<span class="tag tag-暂停">自动归组</span>':''}</div><div class="version-meta"><span>${group.prds.length} 个 PRD</span><span>验收范围 ${doneRequirements}/${totalRequirements}</span><span>事项 ${doneTasks}/${totalTasks}</span>${risks?`<span class="risk">${risks} 项待处理</span>`:'<span>暂无风险</span>'}${group.release?.planned_release_date?`<span>计划发布 ${escapeHtml(group.release.planned_release_date)}</span>`:''}</div></div><div class="version-progress"><div class="version-progress-text"><span>事项完成率</span><strong>${totalTasks?Math.round(doneTasks/totalTasks*100):0}%</strong></div><div class="version-progress-bar"><span style="width:${totalTasks?Math.round(doneTasks/totalTasks*100):0}%"></span></div></div><i class="ti ti-chevron-${collapsed?'down':'up'} version-chevron"></i></div><div class="version-body"><div class="prd-table-head"><span>PRD / 负责人</span><span>状态</span><span>验收范围</span><span>事项交付</span><span>风险</span><span>操作</span></div>${rows}</div></section>`;
  }).join('');
}

function renderPrdRounds(prdId) {
  const tasks = (prdTasks.get(prdId) || []).filter(task => !task.requirement_id && task.status !== 'cancelled').sort((a,b) => Number(a.test_round||1)-Number(b.test_round||1));
  if (!tasks.length) return '';
  const statusNames = {todo:'待处理',in_progress:'进行中',blocked:'已阻塞',done:'已完成',cancelled:'已取消'};
  return `<div style="margin-bottom:14px;"><div class="req-head"><span class="req-title">🧪 测试轮次（${tasks.length}）</span><button class="btn btn-purple" style="padding:4px 10px;font-size:11px;" onclick="createTaskForPrd(event,'${prdId}')"><i class="ti ti-plus"></i>新增下一轮</button></div><div class="req-list">${tasks.map(task => { const snapshot=taskSnapshots.get(task.id); return `<div class="req-delivery"><strong>第 ${Number(task.test_round||1)} 轮</strong><span>${escapeHtml(task.title)}</span><span class="${task.status==='blocked'?'risk':task.status==='done'?'ok':''}">${escapeHtml(statusNames[task.status]||task.status)}</span>${snapshot?`<span>TestHub ${Number(snapshot.executed_cases||0)}/${Number(snapshot.total_cases||0)}</span>`:''}${task.due_date?`<span>截止 ${escapeHtml(task.due_date.slice(0,10))}</span>`:''}</div>`; }).join('')}</div></div>`;
}

function renderReqBody(prdId, reqs) {
  return `
    ${renderPrdRounds(prdId)}
    <div class="req-head">
      <span class="req-title">📋 验收范围（可选，${reqs.length}）</span>
      <button class="btn btn-purple" style="padding:4px 10px;font-size:11px;" onclick="openReqDrawer('${prdId}')">
        <i class="ti ti-pencil"></i>编辑验收范围
      </button>
      <button onclick="promptApiKey()" style="background:none;border:0.5px solid rgba(255,255,255,0.15);border-radius:8px;padding:6px 10px;color:rgba(255,255,255,0.4);font-size:11px;cursor:pointer;white-space:nowrap;font-family:'Noto Sans SC',sans-serif;" title="设置 API Key">
        ⚙️ ${getApiKey() ? 'Key 已设置' : '设置 Key'}
      </button>
    </div>
    ${reqs.length ? `
    <div class="req-list">
      ${reqs.map((r,i) => `
        <div class="req-item">
          <div class="req-num">${i+1}</div>
          <div class="req-content">
            <div class="req-item-title">${r.title}</div>
            ${r.description?`<div class="req-item-desc">${r.description}</div>`:''}
            <div class="req-item-meta">
              <span class="req-priority req-priority-${r.priority||'中'}">${r.priority||'中'}优先级</span>
              <span class="req-status req-status-${r.status||'待测试'}">${r.status||'待测试'}</span>
              ${r.pingcode_case_ids?`<span class="req-case"><i class="ti ti-link" style="font-size:10px;"></i>用例 ${r.pingcode_case_ids}</span>`:''}
            </div>
            ${requirementDelivery(r)}
          </div>
        </div>`).join('')}
    </div>` : `<div style="text-align:center;padding:16px;color:var(--sub);font-size:12px;">简单 PRD 无需拆分；可直接点击行尾“建事项”。复杂流程可添加验收范围。</div>`}
    ${renderChangeLog(prdId)}`;
}

function renderChangeLog(prdId) {
  // 暂时用创建时间模拟
  const prd = allPrds.find(p => p.id === prdId);
  if (!prd) return '';
  return `
    <div style="margin-top:14px;padding-top:12px;border-top:0.5px solid var(--border);">
      <div style="font-size:12px;font-weight:500;color:var(--text);margin-bottom:8px;">📝 变更记录</div>
      <div class="change-list">
        <div class="change-item">
          <div class="change-dot"></div>
          <div class="change-text">PRD 创建${prd.notes?'：'+prd.notes:''}</div>
          <div class="change-time">${prd.created_at?.split('T')[0]||''}</div>
        </div>
      </div>
    </div>`;
}

function toggleExpand(id) {
  expandedId = expandedId === id ? null : id;
  renderList();
}

// ── PRD 抽屉 ──

  editId = id || null;
  const p = id ? allPrds.find(r => r.id === id) : null;
  const v = k => p ? (p[k]||'') : '';
  document.querySelector('.drawer-foot').innerHTML = `
    <button class="btn btn-primary" style="flex:1;" onclick="savePrd()"><i class="ti ti-check"></i>保存</button>
    <button class="btn btn-outline" onclick="closeDrawer()">取消</button>`;
  document.getElementById('drawerTitle').textContent = id ? '编辑 PRD' : '新增 PRD';
  document.getElementById('drawerBody').innerHTML = `
    <div class="form-section">基本信息</div>

    <div class="form-row2">
      <div class="form-group"><label>版本号</label><input id="f-version" value="${v('version')}" placeholder="1.0.0"></div>
      <div class="form-group"><label>负责人</label><input id="f-author" value="${v('author')}" placeholder="姓名"></div>
    </div>
    <div class="form-row2">
      <div class="form-group"><label>产品线</label><input id="f-product" value="${v('product')}" placeholder="Liene/极印"></div>
      <div class="form-group"><label>预计上线日期</label><input type="date" id="f-date" value="${v('release_date')}"></div>
    </div>
    <div class="form-group"><label>状态</label>
      <select id="f-status">${['进行中','已完成','暂停','已归档'].map(s=>`<option ${v('status')===s?'selected':''}>${s}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label>交付版本</label><select id="f-release"><option value="">暂不关联版本</option>${allReleases.map(release=>`<option value="${release.id}" ${v('release_id')===release.id?'selected':''}>${escapeHtml(releaseLabel(release.id))}${release.status==='active'?'（当前）':''}</option>`).join('')}</select></div>
    <div class="form-section">钉钉文档</div>
    <div class="form-group">
      <label>钉钉文档链接</label>

      <span style="font-size:10px;color:var(--sub);margin-top:3px;">后续支持 API 直读文档内容</span>
    </div>

  document.getElementById('overlay').classList.add('show');

}

function closeDrawer() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('open');
  editId = null;
}

async function savePrd() {
  const g = id => document.getElementById(id)?.value?.trim()||'';
  const title = g('f-title');
  if (!title) { alert('请填写 PRD 标题'); return; }
  const data = {
    title, version:g('f-version'), author:g('f-author'),
    product:g('f-product'), release_date:g('f-date')||null,
    status:g('f-status')||'进行中',
    release_id:g('f-release')||null,
    dingtalk_url:g('f-url'), notes:g('f-notes'),
    updated_at: new Date().toISOString()
  };
  try {
    if (editId) {
      const { error } = await sb.from('prds').update(data).eq('id',editId);
      if (error) throw error;
    } else {
      const { error } = await sb.from('prds').insert(data);
      if (error) throw error;
    }
    closeDrawer();
    await loadStats();
    await loadData();
  } catch(e) { alert('保存失败：'+e.message); }
}

async function deletePrd(id) {
  if (!confirm('确定删除此 PRD？相关验收范围也会一并删除。')) return;
  await sb.from('prds').delete().eq('id',id);
  if (expandedId === id) expandedId = null;
  await loadStats();
  await loadData();
}

// ── 需求点编辑抽屉 ──
let currentPrdId = null;

function openReqDrawer(prdId) {
  currentPrdId = prdId;
  const prd = allPrds.find(p => p.id === prdId);
  const reqs = allReqs.filter(r => r.prd_id === prdId);
  editReqs = reqs.map(r => ({...r}));
  renderReqDrawer(prd);
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('open');
}

function renderReqDrawer(prd) {
  document.getElementById('drawerTitle').textContent = `验收范围 · ${prd?.title||''}`;
  // 重写 foot
  document.querySelector('.drawer-foot').innerHTML = `
    <button class="btn btn-primary" style="flex:1;" onclick="saveReqs()"><i class="ti ti-check"></i>保存验收范围</button>
    <button class="btn btn-outline" onclick="closeDrawer()">取消</button>`;

  const aiSection = `
    <div class="ai-box">
      <div class="ai-box-title"><i class="ti ti-robot"></i>AI 自动拆解验收范围</div>
      <textarea class="ai-textarea" id="aiContent" placeholder="粘贴钉钉文档内容，AI 自动提取可独立验收的范围..."></textarea>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
      <button class="ai-btn" id="aiBtn" onclick="aiExtract()" style="margin-top:0;">
        <i class="ti ti-wand"></i>开始拆解
      </button>
    </div>`;

  const reqsHtml = editReqs.map((r,i) => reqEditItem(r,i)).join('');

  document.getElementById('drawerBody').innerHTML = `
    ${aiSection}
    <div style="font-size:11px;color:var(--sub);margin-bottom:8px;margin-top:4px;">验收范围列表（${editReqs.length}）</div>
    <div id="reqEditList">${reqsHtml}</div>
    <button class="add-req-btn" onclick="addReqItem()"><i class="ti ti-plus"></i>手动添加验收范围</button>`;
}

function reqEditItem(r, i) {
  return `
    <div class="req-edit-item" id="req-edit-${i}">
      <button class="req-edit-del" onclick="removeReqItem(${i})"><i class="ti ti-x"></i></button>
      <input placeholder="验收范围标题 *" value="${r.title||''}" oninput="editReqs[${i}].title=this.value">
      <textarea placeholder="描述（可选）" oninput="editReqs[${i}].description=this.value">${r.description||''}</textarea>
      <div class="req-edit-row">
        <select onchange="editReqs[${i}].priority=this.value">
          ${['高','中','低'].map(s=>`<option ${(r.priority||'中')===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <select onchange="editReqs[${i}].status=this.value">
          ${['待测试','测试中','已完成','已跳过'].map(s=>`<option ${(r.status||'待测试')===s?'selected':''}>${s}</option>`).join('')}
        </select>
        <input placeholder="PingCode 用例 ID" value="${r.pingcode_case_ids||''}" oninput="editReqs[${i}].pingcode_case_ids=this.value">
      </div>
    </div>`;
}

function addReqItem() {
  editReqs.push({id:null,title:'',description:'',priority:'中',status:'待测试',pingcode_case_ids:''});
  const i = editReqs.length - 1;
  const list = document.getElementById('reqEditList');
  const div = document.createElement('div');
  div.innerHTML = reqEditItem(editReqs[i], i);
  list.appendChild(div.firstElementChild);
}

function removeReqItem(i) {
  editReqs.splice(i, 1);
  const list = document.getElementById('reqEditList');
  const items = list.querySelectorAll('.req-edit-item');
  if (items[i]) items[i].remove();
  // 重新编号
  editReqs.forEach((_,idx) => {
    const el = list.querySelectorAll('.req-edit-item')[idx];
    if (el) {
      el.id = `req-edit-${idx}`;
      el.querySelector('.req-edit-del').setAttribute('onclick',`removeReqItem(${idx})`);
    }
  });
}

async function saveReqs() {
  const valid = editReqs.filter(r => r.title?.trim());
  if (!valid.length && editReqs.length > 0) { alert('请至少填写验收范围标题'); return; }
  try {
    const keptIds = valid.map(r => r.id).filter(Boolean);
    let deleteQuery = sb.from('requirements').delete().eq('prd_id', currentPrdId);
    if (keptIds.length) deleteQuery = deleteQuery.not('id', 'in', `(${keptIds.join(',')})`);
    const { error: deleteError } = await deleteQuery;
    if (deleteError) throw deleteError;
    if (valid.length) {
      const inserts = valid.map(r => ({
        ...(r.id ? {id:r.id} : {}),
        prd_id: currentPrdId,
        title: r.title.trim(),
        description: r.description||'',
        priority: r.priority||'中',
        status: r.status||'待测试',
        pingcode_case_ids: r.pingcode_case_ids||''
      }));
      const { error } = await sb.from('requirements').upsert(inserts, {onConflict:'id'});
      if (error) throw error;
    }
    closeDrawer();
    await loadStats();
    await loadData();
    expandedId = currentPrdId;
    renderList();
  } catch(e) { alert('保存失败：'+e.message); }
}

// ── AI 拆解 ──
async function aiExtract() {
  const content = document.getElementById('aiContent').value.trim();
  if (!content) { alert('请先粘贴 PRD 内容'); return; }
  const btn = document.getElementById('aiBtn');
  btn.disabled = true;
  btn.innerHTML = `<div class="spinner-sm"></div>AI 拆解中...`;
  try {
    let apiKey = getApiKey();
    if (!apiKey) {
      apiKey = promptApiKey();
      if (!apiKey) { btn.disabled=false; btn.innerHTML=`<i class="ti ti-wand"></i>开始拆解`; return; }
    }
    const resp = await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${apiKey}` },
      body: JSON.stringify({
        model: 'qwen-plus',
        messages: [{
          role: 'user',
          content: `请从以下 PRD 内容中提取需要独立跟踪的验收范围，以 JSON 数组格式返回。只有可以分配给不同负责人、关联不同测试计划、分批完成或具有独立风险的内容才拆分。每个元素包含：title（验收范围标题）、description（验收说明）、priority（高/中/低）。只返回 JSON 数组，不要其他内容。\n\nPRD 内容：\n${content}`
        }]
      })
    });
    const data = await resp.json();
    const text = data.choices?.[0]?.message?.content || '';
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if (Array.isArray(parsed)) {
      // 追加到现有需求点
      parsed.forEach(r => {
        editReqs.push({ title:r.title||'', description:r.description||'', priority:r.priority||'中', status:'待测试', pingcode_case_ids:'' });
      });
      const list = document.getElementById('reqEditList');
      list.innerHTML = editReqs.map((r,i) => reqEditItem(r,i)).join('');
      document.getElementById('aiContent').value = '';
    }
  } catch(e) {
    alert('AI 拆解失败，请检查 API Key 或手动添加验收范围');
  }
  btn.disabled = false;
  btn.innerHTML = `<i class="ti ti-wand"></i>开始拆解`;
}

init();
</script>

</html>
